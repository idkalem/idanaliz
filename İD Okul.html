yapmaz; çarpmaya göre tersini aldırır. Sonucun işareti değişmez.`,ornek:`2^{−3} = {1//2^3} = {1//8} olur; −8 değil.`},sifir:{ad:`Sıfırıncı kuvveti yanlış almak`,anlat:`Sıfırdan farklı her sayının sıfırıncı kuvveti 1'dir. Çünkü a^n ÷ a^n hem 1'e hem de a^{n−n} = a^0'a eşittir.`,ornek:`5^0 = 1 olur; 0 ya da 5 değil.`},parantez:{ad:`Eksi işaretini üsse yanlış katmak`,anlat:`Parantez varsa eksi de tabana aittir. Parantez yoksa önce üs alınır, eksi sonra başa konur.`,ornek:`(−2)^4 = 16 ama −2^4 = −16.`},toplam:{ad:`Toplamada üs kuralı uygulamak`,anlat:`Üs kuralları yalnızca çarpma ve bölmede geçerlidir. Toplamada aynı terimler sayılır ya da ortak çarpan parantezine alınır.`,ornek:`2^3 + 2^3 = 2·2^3 = 2^4 olur; 2^6 ya da 4^3 değil.`}},kartlar:[{id:`tanim`,baslik:`Üs ne söyler?`,metin:[`a^n yazımında a tabandır, n üstür. Üs, tabanın kaç kez yan yana yazılıp çarpılacağını söyler.`,`Üs 1 ise sayı tek başına durur: a^1 = a. Üs 0 ise, taban sıfır olmadığı sürece sonuç 1'dir.`],kural:[`a^n = a·a·…·a   (n tane a)`,`a^1 = a   ve   a^0 = 1   (a ≠ 0)`],ornek:{s:`3^4 kaçtır?`,a:[`3^4, dört tane 3'ün çarpımıdır: 3·3·3·3`,`3·3 = 9, 9·3 = 27, 27·3 = 81`,`Sonuç: 3^4 = 81`]},baska:`Bir kâğıdı ikiye katla: 2 kat. Bir daha katla: 4 kat. Bir daha: 8 kat. Her katlamada kat sayısı 2 ile çarpılır; 3 katlamadan sonra 2·2·2 = 2^3 = 8 kat olur. Hiç katlamadıysan elinde 1 kat vardır: 2^0 = 1.`,soru:{s:`2^5 kaçtır?`,o:[`10`,`25`,`32`],d:2,y:[`carp`,null,null],neden:`2^5 = 2·2·2·2·2 = 32.`}},{id:`isaret`,baslik:`Negatif taban ve parantez`,metin:[`Negatif bir sayının çift kuvveti pozitif, tek kuvveti negatiftir; çünkü eksiler ikişer ikişer birbirini götürür.`,`Parantez yoksa eksi tabana ait değildir: önce üs alınır, eksi en sona kalır.`],kural:[`(−a)^{çift} pozitif,   (−a)^{tek} negatif`,`−a^n = −(a^n)`],ornek:{s:`(−3)^2 + (−2)^3 − 2^2 kaçtır?`,a:[`(−3)^2 = 9   (çift kuvvet, pozitif)`,`(−2)^3 = −8   (tek kuvvet, negatif)`,`2^2 = 4`,`9 + (−8) − 4 = −3`]},baska:`Parantezi bir kutu gibi düşün: kutunun içinde ne varsa üs onun hepsine uygulanır. (−2)^4 kutusunda −2 var: (−2)·(−2)·(−2)·(−2) = 16. −2^4 yazımında kutu yok; üs yalnızca 2'ye dokunur, 2^4 = 16 bulunur, sonra başına eksi gelir: −16.`,soru:{s:`−3^2 kaçtır?`,o:[`9`,`−9`,`−6`],d:1,y:[`parantez`,null,`carp`],neden:`Parantez yok: önce 3^2 = 9, sonra eksi. Sonuç −9.`}},{id:`islem`,baslik:`Çarpma, bölme ve üssün üssü`,metin:[`Tabanlar aynıysa çarpmada üsler toplanır, bölmede çıkarılır. Bir üslü sayının yeniden üssü alınırsa üsler çarpılır.`,`Tabanlar farklıysa önce aynı tabana çevir: 4 = 2^2, 8 = 2^3, 9 = 3^2, 27 = 3^3.`],kural:[`a^m · a^n = a^{m+n}`,`{a^m//a^n} = a^{m−n}`,`(a^m)^n = a^{m·n}`,`(a·b)^n = a^n · b^n`],ornek:{s:`{(2^3)^2 · 2^4//2^7} kaçtır?`,a:[`Üssün üssü: (2^3)^2 = 2^6`,`Çarpma: 2^6 · 2^4 = 2^{10}`,`Bölme: 2^{10} ÷ 2^7 = 2^3`,`Sonuç: 8`]},baska:`Kuralı ezberlemek yerine say. 2^3·2^2 = (2·2·2)·(2·2): toplam 3 + 2 = 5 tane 2 var, yani 2^5. (2^3)^2 = (2·2·2)·(2·2·2): üçerli 2 grup, 3·2 = 6 tane 2 var, yani 2^6. Bölmede ise üstteki ve alttaki 2'ler birbirini götürür.`,soru:{s:`5^4 · 5^2 neye eşittir?`,o:[`5^8`,`5^6`,`25^6`],d:1,y:[`uscarp`,null,`taban`],neden:`Taban aynı, üsler toplanır: 5^{4+2} = 5^6.`}},{id:`negatif`,baslik:`Negatif üs ve sıfırıncı kuvvet`,metin:[`Üssü 1 azaltmak, sayıyı tabana bölmek demektir: 2^3 = 8, 2^2 = 4, 2^1 = 2. Aynı adımla devam et: 2^0 = 1, 2^{−1} = {1//2}, 2^{−2} = {1//4}.`,`Demek ki negatif üs sayıyı negatif yapmaz, paydaya indirir. Kesirde ise pay ile payda yer değiştirir.`],kural:[`a^{−n} = {1//a^n}`,`({a//b})^{−n} = ({b//a})^n`,`a^0 = 1   (a ≠ 0)`],ornek:{s:`({2//3})^{−2} kaçtır?`,a:[`Negatif üs kesri ters çevirir: ({3//2})^2`,`Pay ve paydanın karesi alınır: {3^2//2^2}`,`Sonuç: {9//4}`]},baska:`Bölmeyle düşün: 2^3 ÷ 2^5 işleminde üstte üç, altta beş tane 2 var. Üçü sadeleşir, altta iki tane 2 kalır: {1//2^2}. Kurala göre aynı işlem 2^{3−5} = 2^{−2} eder. Yani 2^{−2} ile {1//4} aynı şeydir; ortada negatif bir sayı yok.`,soru:{s:`2^{−3} kaçtır?`,o:[`−8`,`−6`,`{1//8}`],d:2,y:[`negatif`,`carp`,null],neden:`2^{−3} = {1//2^3} = {1//8}.`}},{id:`toplam`,baslik:`Toplama ve çıkarmada dikkat`,metin:[`Üs kuralları çarpma ve bölme içindir. Toplamada üsler toplanmaz, tabanlar da toplanmaz.`,`Aynı terimleri say ya da ortak çarpan parantezine al. Soruların çoğu bu adımla çözülür.`],kural:[`a^n + a^n = 2·a^n`,`a^{n+1} + a^n = a^n·(a + 1)`],ornek:{s:`3^5 + 3^5 + 3^5 neye eşittir?`,a:[`Aynı terimden 3 tane var: 3·3^5`,`3 = 3^1 olduğundan 3^1·3^5 = 3^6`,`Sonuç: 3^6`]},baska:`x + x + x = 3x olduğunu biliyorsun. 3^5'i tek bir "x" gibi düşün: üç tane x eder 3x, yani 3·3^5. Bundan sonrası çarpma olduğu için üs kuralı artık kullanılabilir.`,soru:{s:`2^{10} + 2^{10} neye eşittir?`,o:[`2^{20}`,`4^{10}`,`2^{11}`],d:2,y:[`toplam`,`toplam`,null],neden:`İki tane 2^{10} var: 2·2^{10} = 2^{11}.`}}],ozet:[`a^n, n tane a'nın çarpımıdır. a^1 = a, a^0 = 1 (a ≠ 0).`,`Negatif tabanın çift kuvveti pozitif, tek kuvveti negatiftir. −a^n ile (−a)^n aynı değildir.`,`Çarpmada üsler toplanır: a^m·a^n = a^{m+n}. Bölmede çıkarılır: a^m ÷ a^n = a^{m−n}.`,`Üssün üssünde üsler çarpılır: (a^m)^n = a^{m·n}.`,`Negatif üs paydaya indirir: a^{−n} = {1//a^n}. Kesir ters döner.`,`Toplamada üs kuralı yoktur; ortak çarpan parantezine alınır.`],sorular:[{id:`s1`,z:1,kart:`tanim`,s:`2^3 + 3^2 işleminin sonucu kaçtır?`,o:[`12`,`15`,`17`,`25`,`36`],d:2,y:[`carp`,null,null,null,null],c:[`2^3 = 2·2·2 = 8`,`3^2 = 3·3 = 9`,`8 + 9 = 17`],h:`2**3 + 3**2 === 17`},{id:`s2`,z:1,kart:`isaret`,s:`(−2)^3 − (−2)^2 işleminin sonucu kaçtır?`,o:[`−12`,`−4`,`−2`,`4`,`12`],d:0,y:[null,`parantez`,`carp`,`parantez`,null],c:[`(−2)^3 = −8   (tek kuvvet, negatif)`,`(−2)^2 = 4   (çift kuvvet, pozitif)`,`−8 − 4 = −12`],h:`(-2)**3 - (-2)**2 === -12`},{id:`s3`,z:1,kart:`islem`,s:`(3^2)^3 · 3^{−4} işleminin sonucu kaçtır?`,o:[`3`,`9`,`27`,`81`,`{1//9}`],d:1,y:[`ustopla`,null,null,null,null],c:[`Üssün üssü: (3^2)^3 = 3^6`,`Çarpmada üsler toplanır: 3^6 · 3^{−4} = 3^{6−4} = 3^2`,`3^2 = 9`],h:`(3**2)**3 * 3**-4 === 9`},{id:`s4`,z:2,kart:`negatif`,s:`({1//2})^{−3} + 5^0 işleminin sonucu kaçtır?`,o:[`{7//8}`,`8`,`9`,`{9//8}`,`13`],d:2,y:[`negatif`,`sifir`,null,`negatif`,`sifir`],c:[`Negatif üs kesri ters çevirir: ({1//2})^{−3} = 2^3 = 8`,`Sıfırıncı kuvvet: 5^0 = 1`,`8 + 1 = 9`],h:`(1/2)**-3 + 5**0 === 9`},{id:`s5`,z:2,kart:`toplam`,s:`3^{10} + 3^{10} + 3^{10} toplamı aşağıdakilerden hangisine eşittir?`,o:[`3^{11}`,`3^{13}`,`3^{30}`,`9^{10}`,`9^{30}`],d:0,y:[null,null,`toplam`,`toplam`,`toplam`],c:[`Aynı terimden 3 tane var: 3·3^{10}`,`3 = 3^1 yazılır: 3^1 · 3^{10}`,`Çarpmada üsler toplanır: 3^{11}`],h:`3 * 3**10 === 3**11`},{id:`s6`,z:2,kart:`islem`,s:`{2^5 · 4^3//8^3} işleminin sonucu kaçtır?`,o:[`1`,`2`,`4`,`8`,`16`],d:2,y:[null,`ustopla`,null,null,null],c:[`Hepsini 2 tabanına çevir: 4^3 = (2^2)^3 = 2^6 ve 8^3 = (2^3)^3 = 2^9`,`Pay: 2^5 · 2^6 = 2^{11}`,`Bölme: 2^{11} ÷ 2^9 = 2^2`,`Sonuç: 4`],h:`2**5 * 4**3 / 8**3 === 4`},{id:`s7`,z:3,kart:`toplam`,s:`{2^{n+2} + 2^n//2^{n−1}} ifadesinin değeri kaçtır?`,o:[`5`,`8`,`10`,`12`,`16`],d:2,y:[null,null,null,null,null],c:[`Payda ortak çarpan 2^n: 2^n·(2^2 + 1) = 5·2^n`,`Bölme: 2^n ÷ 2^{n−1} = 2^{n−(n−1)} = 2^1 = 2`,`5·2 = 10`],h:`(2**7 + 2**5) / 2**4 === 10`},{id:`s8`,z:3,kart:`isaret`,s:`a = −2^4,   b = (−2)^4,   c = (−2)^{−3} sayılarının küçükten büyüğe sıralanışı hangisidir?`,o:[`a < b < c`,`a < c < b`,`b < c < a`,`c < a < b`,`c < b < a`],d:1,y:[`negatif`,null,`parantez`,null,null],c:[`a = −2^4 = −16   (parantez yok, eksi sonda)`,`b = (−2)^4 = 16   (çift kuvvet)`,`c = (−2)^{−3} = {1//(−2)^3} = −{1//8}`,`−16 < −{1//8} < 16 olduğundan a < c < b`],h:`-(2**4) < (-2)**-3 && (-2)**-3 < (-2)**4`}]},Mh={id:`mat-koklu`,ad:`Köklü Sayılar`,dk:25,giris:`Karekök, "karesi bu olan sayı hangisi?" sorusudur. Kök dışına çıkarma, dört işlem ve paydayı kökten kurtarma.`,yan:{topla:{ad:`Kökleri toplarken içlerini toplamak`,anlat:`Toplamada kökler birleşmez. Önce her kök ayrı ayrı hesaplanır ya da sadeleştirilir; ancak içleri aynı olan kökler toplanabilir.`,ornek:`√9 + √16 = 3 + 4 = 7 olur; √25 = 5 değil.`},isaret:{ad:`√(a^2) = a sanmak`,anlat:`Karekökün sonucu negatif olamaz. Bu yüzden √(a^2) = |a| olur; a negatifse işaret değişir.`,ornek:`√((−5)^2) = √25 = 5 olur; −5 değil.`},disari:{ad:`Kök dışına çıkarırken karekök almayı unutmak`,anlat:`Kökten dışarı tam karenin kendisi değil, karekökü çıkar. İçeri alırken de sayının karesi alınır.`,ornek:`√12 = √(4·3) = 2√3 olur; 4√3 değil. Tersine 3√2 = √(9·2) = √18.`},payda:{ad:`Paydayı kökten kurtarırken paydayı unutmak`,anlat:`Pay ve payda aynı kökle çarpılır. Payda kökten kurtulurken tam sayıya dönüşür ve orada kalır; sadeleştirme en son yapılır.`,ornek:`{6//√3} = {6√3//3} = 2√3 olur; 6√3 değil.`}},kartlar:[{id:`tanim`,baslik:`Karekök ne demek?`,metin:[`√a, karesi a olan ve negatif olmayan sayıdır. √25 = 5'tir; (−5)^2 de 25 eder ama kök işareti yalnızca pozitif olanı verir.`,`Bu yüzden bir sayının karesinin karekökü o sayının mutlak değeridir. Negatif bir sayının karekökü gerçek sayı değildir.`],kural:[`√(a^2) = |a|`,`(√a)^2 = a   (a ≥ 0)`],ornek:{s:`√((−7)^2) kaçtır?`,a:[`Önce içerisi: (−7)^2 = 49`,`√49 = 7`,`Kısa yol: √((−7)^2) = |−7| = 7`]},baska:`Alanı 25 birimkare olan bir karenin kenarı kaç birimdir? 5. Karekök tam olarak bunu sorar: "alanı bilinen karenin kenarı". Kenar uzunluğu negatif olamayacağı için karekök de negatif çıkmaz.`,soru:{s:`√((−4)^2) kaçtır?`,o:[`−4`,`4`,`16`],d:1,y:[`isaret`,null,null],neden:`√((−4)^2) = √16 = 4. Kök sonucu negatif olmaz.`}},{id:`sade`,baslik:`Kök dışına çıkarma, kök içine alma`,metin:[`Kök içindeki sayıyı, biri tam kare olacak şekilde iki çarpana ayır. Tam karenin karekökü dışarı çıkar.`,`Ters yönde, kökün önündeki sayı içeri karesi alınarak girer. Köklü sayıları sıralarken bu yol çok işe yarar.`],kural:[`√(a^2·b) = a√b   (a ≥ 0)`,`a√b = √(a^2·b)`],ornek:{s:`√50 + √18 − √8 kaçtır?`,a:[`√50 = √(25·2) = 5√2`,`√18 = √(9·2) = 3√2`,`√8 = √(4·2) = 2√2`,`5√2 + 3√2 − 2√2 = 6√2`]},baska:`Kökün içini bir oda gibi düşün; dışarı çıkmak için eş bulmak gerekiyor. √12 = √(2·2·3): iki tane 2 eş olur ve dışarıya tek bir 2 olarak çıkar. 3'ün eşi yok, içeride kalır: 2√3.`,soru:{s:`√45 en sade biçimde nasıl yazılır?`,o:[`9√5`,`3√5`,`5√3`],d:1,y:[`disari`,null,null],neden:`√45 = √(9·5) = 3√5.`}},{id:`islem`,baslik:`Köklü sayılarda dört işlem`,metin:[`Toplama ve çıkarma yalnızca kök içleri aynı olan terimler arasında yapılır; katsayılar toplanır, kök aynen kalır.`,`Çarpma ve bölmede ise kökler tek kök altında birleşir.`],kural:[`a√x + b√x = (a + b)√x`,`√a · √b = √(a·b)`,`{√a//√b} = √({a//b})`],ornek:{s:`√3 · √12 + {√48//√3} kaçtır?`,a:[`Çarpma: √3 · √12 = √36 = 6`,`Bölme: √48 ÷ √3 = √16 = 4`,`6 + 4 = 10`]},baska:`√3'ü bir meyve gibi düşün: 2 elma ile 5 elma 7 elma eder, yani 2√3 + 5√3 = 7√3. Ama 2 elma ile 3 armut tek tür meyve olmaz; 2√3 + 3√2 toplanmaz. Sayılarla dene: √9 + √16 = 3 + 4 = 7 eder, √25 ise 5'tir.`,soru:{s:`√9 + √16 kaçtır?`,o:[`5`,`7`,`25`],d:1,y:[`topla`,null,`topla`],neden:`Her kök ayrı hesaplanır: 3 + 4 = 7.`}},{id:`payda`,baslik:`Paydayı kökten kurtarma`,metin:[`Paydada kök bırakılmaz. Payda tek bir kökse pay ve payda o kökle çarpılır.`,`Paydada toplam ya da fark varsa eşleniğiyle çarpılır: (√a − √b)·(√a + √b) = a − b olduğu için kökler kaybolur.`],kural:[`{a//√b} = {a√b//b}`,`(√a − √b)·(√a + √b) = a − b`],ornek:{s:`{4//√5 − 1} en sade biçimde nedir?`,a:[`Eşlenik: √5 + 1. Pay ve payda bununla çarpılır.`,`Payda: (√5 − 1)·(√5 + 1) = 5 − 1 = 4`,`Pay: 4·(√5 + 1)`,`4'ler sadeleşir: √5 + 1`]},baska:`Bir kesri 1 ile çarpmak değerini değiştirmez. {√3//√3} de 1'dir. Yani pay ve paydayı birlikte √3 ile çarptığında kesir aynı kalır; yalnızca payda √3·√3 = 3 olur ve kök paya geçer.`,soru:{s:`{10//√5} neye eşittir?`,o:[`2`,`2√5`,`10√5`],d:1,y:[null,null,`payda`],neden:`{10//√5} = {10√5//5} = 2√5.`}}],ozet:[`√a negatif olmaz. √(a^2) = |a|.`,`Dışarı çıkarma: √(a^2·b) = a√b. İçeri alma: a√b = √(a^2·b).`,`Toplama ve çıkarma yalnızca kök içleri aynıysa yapılır: 2√3 + 5√3 = 7√3.`,`Çarpma ve bölmede kökler birleşir: √a·√b = √(a·b).`,`Paydayı kökten kurtar: {a//√b} = {a√b//b}. Toplam ya da fark varsa eşlenikle çarp.`,`Köklü sayıları sıralamak için hepsini kök içine al.`],sorular:[{id:`s1`,z:1,kart:`tanim`,s:`√81 − √((−5)^2) işleminin sonucu kaçtır?`,o:[`−14`,`−4`,`0`,`4`,`14`],d:3,y:[null,null,null,null,`isaret`],c:[`√81 = 9`,`√((−5)^2) = |−5| = 5`,`9 − 5 = 4`],h:`Math.sqrt(81) - Math.sqrt((-5)**2) === 4`},{id:`s2`,z:1,kart:`sade`,s:`√48 sayısının en sade yazılışı hangisidir?`,o:[`2√12`,`3√5`,`4√3`,`16√3`,`24`],d:2,y:[null,null,null,`disari`,null],c:[`48 içindeki en büyük tam kare 16'dır: 48 = 16·3`,`√48 = √16 · √3`,`√16 = 4 olduğundan sonuç 4√3`],h:`Math.abs(Math.sqrt(48) - 4*Math.sqrt(3)) < 1e-9`},{id:`s3`,z:1,kart:`islem`,s:`√12 + √27 − √3 işleminin sonucu hangisidir?`,o:[`6`,`4√3`,`5√3`,`6√3`,`12√3`],d:1,y:[`topla`,null,null,null,`disari`],c:[`√12 = √(4·3) = 2√3`,`√27 = √(9·3) = 3√3`,`2√3 + 3√3 − √3 = (2 + 3 − 1)√3`,`Sonuç: 4√3`],h:`Math.abs(Math.sqrt(12) + Math.sqrt(27) - Math.sqrt(3) - 4*Math.sqrt(3)) < 1e-9`},{id:`s4`,z:2,kart:`islem`,s:`√2 · √18 + {√50//√2} işleminin sonucu kaçtır?`,o:[`7`,`9`,`10`,`11`,`13`],d:3,y:[null,null,null,null,null],c:[`Çarpma: √2 · √18 = √36 = 6`,`Bölme: √50 ÷ √2 = √25 = 5`,`6 + 5 = 11`],h:`Math.abs(Math.sqrt(2)*Math.sqrt(18) + Math.sqrt(50)/Math.sqrt(2) - 11) < 1e-9`},{id:`s5`,z:2,kart:`payda`,s:`{12//√6} ifadesinin eşiti hangisidir?`,o:[`2√6`,`√6`,`2`,`6√2`,`12√6`],d:0,y:[null,null,null,null,`payda`],c:[`Pay ve payda √6 ile çarpılır: {12√6//√6·√6}`,`Payda: √6·√6 = 6`,`{12√6//6} = 2√6`],h:`Math.abs(12/Math.sqrt(6) - 2*Math.sqrt(6)) < 1e-9`},{id:`s6`,z:2,kart:`sade`,s:`3√5,   2√11   ve   4√3 sayılarının küçükten büyüğe sıralanışı hangisidir?`,o:[`2√11 < 3√5 < 4√3`,`3√5 < 2√11 < 4√3`,`2√11 < 4√3 < 3√5`,`4√3 < 3√5 < 2√11`,`3√5 < 4√3 < 2√11`],d:0,y:[null,null,null,`disari`,null],c:[`Hepsini kök içine al; katsayının karesi içeri girer.`,`3√5 = √(9·5) = √45`,`2√11 = √(4·11) = √44`,`4√3 = √(16·3) = √48`,`√44 < √45 < √48 olduğundan 2√11 < 3√5 < 4√3`],h:`2*Math.sqrt(11) < 3*Math.sqrt(5) && 3*Math.sqrt(5) < 4*Math.sqrt(3)`},{id:`s7`,z:3,kart:`payda`,s:`{2//√3 − 1} − √3 işleminin sonucu kaçtır?`,o:[`−√3`,`−1`,`0`,`1`,`√3`],d:3,y:[null,null,null,null,null],c:[`Kesri eşlenikle genişlet: {2·(√3 + 1)//(√3 − 1)·(√3 + 1)}`,`Payda: 3 − 1 = 2`,`Kesir: {2·(√3 + 1)//2} = √3 + 1`,`√3 + 1 − √3 = 1`],h:`Math.abs(2/(Math.sqrt(3)-1) - Math.sqrt(3) - 1) < 1e-9`},{id:`s8`,z:3,kart:`tanim`,s:`a < 0 < b olmak üzere √(a^2) + √(b^2) − √((a − b)^2) ifadesinin eşiti hangisidir?`,o:[`0`,`2a`,`2b`,`−2a`,`2b − 2a`],d:0,y:[null,null,`isaret`,null,`isaret`],c:[`√(a^2) = |a| = −a   (a negatif)`,`√(b^2) = |b| = b   (b pozitif)`,`a − b negatiftir, bu yüzden √((a − b)^2) = |a − b| = b − a`,`−a + b − (b − a) = −a + b − b + a = 0`],h:`(() => { const a = -3, b = 5; return Math.sqrt(a*a) + Math.sqrt(b*b) - Math.sqrt((a-b)**2) === 0; })()`}]},Nh={id:`mat-mutlak`,ad:`Mutlak Değer`,dk:20,giris:`Mutlak değer bir uzaklıktır. Bu tek fikirle tanım, denklem ve eşitsizlik soruları aynı yoldan çözülür.`,yan:{eksi:{ad:`Mutlak değeri negatif bir sayıya eşitlemek`,anlat:`Mutlak değer bir uzaklıktır ve negatif olamaz. Sağ taraf negatifse denklemin çözümü yoktur; işlem yapmaya gerek kalmaz.`,ornek:`|x + 1| = −3 denkleminin çözüm kümesi boştur.`},tek:{ad:`Tek çözümle yetinmek`,anlat:`Sağ taraf pozitifse içerisi hem o sayıya hem de onun eksisine eşit olabilir. İki denklem de çözülür.`,ornek:`|x − 4| = 6 için x − 4 = 6 ve x − 4 = −6 çözülür: x = 10 ve x = −2.`},isaret:{ad:`İçi negatifken işaret değiştirmeyi unutmak`,anlat:`Mutlak değerin içi negatifse dışarı önüne eksi alarak çıkar. Önce içerinin işaretine bak, sonra aç.`,ornek:`x < 3 ise x − 3 negatiftir; |x − 3| = −(x − 3) = 3 − x.`},yon:{ad:`Eşitsizlikte içeriyi ve dışarıyı karıştırmak`,anlat:`"Küçüktür" sınıra yakın kalmaktır, tek bir aralık verir. "Büyüktür" uzaklaşmaktır, iki ayrı parça verir.`,ornek:`|x| < 2 ise −2 < x < 2.   |x| > 2 ise x < −2 ya da x > 2.`}},kartlar:[{id:`tanim`,baslik:`Mutlak değer: sıfıra uzaklık`,metin:[`|x|, sayı doğrusunda x'in sıfıra olan uzaklığıdır. Uzaklık negatif olmaz: |5| = 5 ve |−5| = 5.`,`Aynı fikirle |a − b|, a ile b arasındaki uzaklıktır.`],kural:[`x ≥ 0 ise |x| = x`,`x < 0 ise |x| = −x`],ornek:{s:`|3 − 7| + |−2| kaçtır?`,a:[`3 − 7 = −4 ve |−4| = 4`,`|−2| = 2`,`4 + 2 = 6`]},baska:`Evinden 3 km doğuya da yürüsen, 3 km batıya da yürüsen yürüdüğün yol 3 km'dir. Mutlak değer yönü atar, yalnızca mesafeyi tutar. Kuraldaki "−x" seni şaşırtmasın: x negatifken −x pozitif bir sayıdır.`,soru:{s:`x = −4 için |x| − x kaçtır?`,o:[`0`,`8`,`−8`],d:1,y:[`isaret`,null,null],neden:`|−4| = 4 ve 4 − (−4) = 8.`}},{id:`acma`,baslik:`Mutlak değeri açmak`,metin:[`Mutlak değeri kaldırmadan önce içerinin işaretine bak. İçerisi pozitifse aynen çıkar, negatifse önüne eksi alarak çıkar.`,`İçerinin işaretini bulmak için verilen aralıktan bir sayı denemek yeterlidir.`],kural:[`a > b ise |a − b| = a − b`,`a < b ise |a − b| = b − a`],ornek:{s:`1 < x < 4 için |x − 1| + |x − 4| neye eşittir?`,a:[`x − 1 pozitif: |x − 1| = x − 1`,`x − 4 negatif: |x − 4| = 4 − x`,`(x − 1) + (4 − x) = 3`]},baska:`Aklından bir sayı tut: x = 2 olsun. |2 − 1| + |2 − 4| = 1 + 2 = 3. x = 3 dene: 2 + 1 = 3. Hep 3 çıkıyor; çünkü bu toplam x'in 1'e ve 4'e uzaklıklarının toplamıdır. x ikisinin arasındayken bu toplam, 1 ile 4 arasındaki mesafeye eşittir.`,soru:{s:`x < 0 için |x| + x neye eşittir?`,o:[`2x`,`0`,`−2x`],d:1,y:[`isaret`,null,null],neden:`x negatifken |x| = −x olur: −x + x = 0.`}},{id:`denklem`,baslik:`Mutlak değerli denklemler`,metin:[`|x − a| = b denklemi "x'in a'ya uzaklığı b" demektir. b pozitifse a'nın iki yanında birer nokta vardır.`,`b sıfırsa tek çözüm vardır. b negatifse çözüm yoktur.`],kural:[`|x − a| = b ise x − a = b ya da x − a = −b   (b > 0)`],ornek:{s:`|2x − 1| = 7 denkleminin çözüm kümesi nedir?`,a:[`Birinci durum: 2x − 1 = 7, buradan x = 4`,`İkinci durum: 2x − 1 = −7, buradan x = −3`,`Çözüm kümesi: {−3, 4}`]},baska:`|x − 3| = 5 için sayı doğrusunda 3'ün üzerinde dur. 5 birim sağa git: 8. 5 birim sola git: −2. İşte iki çözüm. Denklemi kurmadan önce böyle düşünmek, ikinci çözümü unutmanı engeller.`,soru:{s:`|x + 1| = −3 denkleminin kaç çözümü vardır?`,o:[`Çözümü yoktur`,`1`,`2`],d:0,y:[null,`eksi`,`eksi`],neden:`Mutlak değer negatif olamaz; çözüm yoktur.`}},{id:`esitsizlik`,baslik:`Mutlak değerli eşitsizlikler`,metin:[`|x − a| < b, x'in a'ya uzaklığı b'den az demektir: x, a'nın çevresindeki tek bir aralıkta kalır.`,`|x − a| > b ise x o aralığın dışındadır; solda ve sağda iki ayrı parça oluşur.`],kural:[`|x| < a ise −a < x < a`,`|x| > a ise x < −a ya da x > a`],ornek:{s:`|x − 2| ≤ 3 eşitsizliğini kaç tam sayı sağlar?`,a:[`−3 ≤ x − 2 ≤ 3`,`Her tarafa 2 ekle: −1 ≤ x ≤ 5`,`Tam sayılar: −1, 0, 1, 2, 3, 4, 5`,`7 tam sayı`]},baska:`|x − 2| ≤ 3 cümlesini Türkçe oku: "2'ye en çok 3 birim uzaklıktaki sayılar". 2'nin 3 solu −1, 3 sağı 5'tir; aradaki her sayı olur. "Küçüktür" içeride kalmak, "büyüktür" dışarı çıkmaktır.`,soru:{s:`|x| > 2 koşulunu aşağıdakilerden hangisi sağlar?`,o:[`x = −3`,`x = 0`,`x = 2`],d:0,y:[null,`yon`,null],neden:`|−3| = 3 ve 3 > 2. Negatif tarafta da çözüm vardır.`}}],ozet:[`|x|, x'in sıfıra uzaklığıdır; negatif olmaz. |a − b|, a ile b arasındaki uzaklıktır.`,`Açarken içerinin işaretine bak: pozitifse aynen, negatifse önüne eksi alarak çıkar.`,`|x − a| = b (b > 0) denkleminin iki çözümü vardır: x − a = b ve x − a = −b.`,`Sağ taraf negatifse çözüm yoktur.`,`|x| < a tek aralık verir: −a < x < a.`,`|x| > a iki parça verir: x < −a ya da x > a.`],sorular:[{id:`s1`,z:1,kart:`tanim`,s:`|−8| − |3 − 5| + |−1| işleminin sonucu kaçtır?`,o:[`5`,`7`,`9`,`11`,`−7`],d:1,y:[null,null,null,`isaret`,null],c:[`|−8| = 8`,`|3 − 5| = |−2| = 2`,`|−1| = 1`,`8 − 2 + 1 = 7`],h:`Math.abs(-8) - Math.abs(3-5) + Math.abs(-1) === 7`},{id:`s2`,z:1,kart:`denklem`,s:`|x − 4| = 6 denkleminin kökleri toplamı kaçtır?`,o:[`−2`,`4`,`8`,`10`,`12`],d:2,y:[null,null,null,`tek`,null],c:[`Birinci durum: x − 4 = 6, x = 10`,`İkinci durum: x − 4 = −6, x = −2`,`10 + (−2) = 8`],h:`[10, -2].every((x) => Math.abs(x - 4) === 6)`},{id:`s3`,z:1,kart:`acma`,s:`x < 3 olmak üzere |x − 3| + x ifadesinin eşiti hangisidir?`,o:[`−3`,`3`,`2x − 3`,`3 − 2x`,`2x + 3`],d:1,y:[null,null,`isaret`,null,null],c:[`x < 3 olduğundan x − 3 negatiftir`,`|x − 3| = 3 − x`,`3 − x + x = 3`],h:`[-5, 0, 2.5].every((x) => Math.abs(x - 3) + x === 3)`},{id:`s4`,z:2,kart:`esitsizlik`,s:`|x − 1| < 4 eşitsizliğini sağlayan kaç tam sayı vardır?`,o:[`5`,`6`,`7`,`8`,`9`],d:2,y:[null,null,null,null,null],c:[`−4 < x − 1 < 4`,`Her tarafa 1 ekle: −3 < x < 5`,`Tam sayılar: −2, −1, 0, 1, 2, 3, 4`,`7 tam sayı (uçlar dahil değil)`],h:`Array.from({ length: 41 }, (_, i) => i - 20).filter((x) => Math.abs(x - 1) < 4).length === 7`},{id:`s5`,z:2,kart:`denklem`,s:`|2x + 3| = x + 6 denklemini sağlayan x değerlerinin toplamı kaçtır?`,o:[`−3`,`0`,`3`,`6`,`9`],d:1,y:[null,null,`tek`,null,null],c:[`Birinci durum: 2x + 3 = x + 6, x = 3`,`İkinci durum: 2x + 3 = −(x + 6), 3x = −9, x = −3`,`Kontrol: x = 3 için 9 = 9, x = −3 için 3 = 3; ikisi de sağlıyor`,`3 + (−3) = 0`],h:`[3, -3].every((x) => Math.abs(2*x + 3) === x + 6)`},{id:`s6`,z:2,kart:`acma`,s:`2 < x < 5 olmak üzere |x − 2| + |x − 5| + |x + 1| ifadesinin eşiti hangisidir?`,o:[`x + 4`,`3x − 6`,`8 − x`,`x + 8`,`6 − x`],d:0,y:[null,`isaret`,null,null,null],c:[`x − 2 pozitif: |x − 2| = x − 2`,`x − 5 negatif: |x − 5| = 5 − x`,`x + 1 pozitif: |x + 1| = x + 1`,`(x − 2) + (5 − x) + (x + 1) = x + 4`],h:`[2.5, 3, 4.5].every((x) => Math.abs(x-2) + Math.abs(x-5) + Math.abs(x+1) === x + 4)`},{id:`s7`,z:3,kart:`esitsizlik`,s:`|x + 2| ≥ 5 eşitsizliğini sağlamayan tam sayıların toplamı kaçtır?`,o:[`−20`,`−18`,`−14`,`−9`,`0`],d:1,y:[null,null,null,null,null],c:[`Sağlamayanlar |x + 2| < 5 koşulunu sağlar`,`−5 < x + 2 < 5, buradan −7 < x < 3`,`Tam sayılar: −6, −5, −4, −3, −2, −1, 0, 1, 2`,`Toplamları: −18`],h:`Array.from({ length: 41 }, (_, i) => i - 20).filter((x) => !(Math.abs(x + 2) >= 5)).reduce((a, b) => a + b, 0) === -18`},{id:`s8`,z:3,kart:`tanim`,s:`|x − 3| + |y + 2| = 0 olduğuna göre x·y çarpımı kaçtır?`,o:[`−6`,`−5`,`1`,`5`,`6`],d:0,y:[null,null,null,null,null],c:[`Mutlak değerler negatif olamaz; toplamları 0 ise ikisi de 0'dır`,`|x − 3| = 0 ise x = 3`,`|y + 2| = 0 ise y = −2`,`x·y = 3·(−2) = −6`],h:`Math.abs(3 - 3) + Math.abs(-2 + 2) === 0 && 3 * -2 === -6`}]},Ph={id:`mat-oran`,ad:`Oran ve Orantı`,dk:25,giris:`İki çokluk birlikte nasıl değişiyor? Doğru orantıda bölüm, ters orantıda çarpım sabit kalır.`,yan:{fark:{ad:`Oranı toplama–çıkarmayla düşünmek`,anlat:`Oran bir bölümdür. {a//b} = {2//5} demek a = 2 ve b = 5 demek değildir; a = 2k ve b = 5k demektir. Çokluklar aynı sayıyla çarpılarak büyür, aynı sayı eklenerek değil.`,ornek:`{a//b} = {2//5} ve a + b = 42 ise 7k = 42, k = 6; a = 12 ve b = 30.`},capraz:{ad:`Orantıyı ters kurmak`,anlat:`Orantıda aynı tür çokluklar aynı hizaya yazılır, sonra içler dışlar çarpımı yapılır.`,ornek:`{a//b} = {3//4} ve a = 12 ise 12·4 = 3·b, b = 16.`},ters:{ad:`Doğru ve ters orantıyı karıştırmak`,anlat:`Önce sor: biri artınca öbürü artıyor mu, azalıyor mu? Birlikte artıyorsa doğru orantıdır, bölüm sabittir. Biri artarken öbürü azalıyorsa ters orantıdır, çarpım sabittir.`,ornek:`İşçi sayısı artınca süre azalır: 8·15 = 12·x, x = 10 gün.`},pay:{ad:`Paylaştırmada oranların toplamını kullanmamak`,anlat:`Paylar oranların toplamı üzerinden bulunur: bütün, toplam pay sayısına bölünür ve bir payın değeri (k) elde edilir.`,ornek:`180 TL 2, 3 ve 4 ile doğru orantılı paylaşılırsa 9k = 180, k = 20; paylar 40, 60 ve 80 TL.`}},kartlar:[{id:`oran`,baslik:`Oran, orantı ve k sabiti`,metin:[`Oran, aynı türden iki çokluğun bölümle karşılaştırılmasıdır. İki oranın eşitliğine orantı denir.`,`Bir oran verildiğinde çoklukların gerçek değerleri bilinmez; yalnızca kaç pay oldukları bilinir. Bir payın değerine k denir.`],kural:[`{a//b} = {c//d} ise a·d = b·c`,`{a//b} = {2//3} ise a = 2k, b = 3k`],ornek:{s:`{a//b} = {2//3} ve a + b = 30 ise a kaçtır?`,a:[`a = 2k ve b = 3k yaz`,`a + b = 5k = 30, buradan k = 6`,`a = 2·6 = 12`]},baska:`Bir pilav tarifi düşün: 2 bardak pirince 3 bardak su. 4 bardak pirinç koyarsan 6 bardak su gerekir. Miktarlar değişti ama "2'ye 3" ilişkisi aynı kaldı. k, tarifi kaç kat yaptığındır.`,soru:{s:`{a//b} = {3//4} ve a = 12 ise b kaçtır?`,o:[`9`,`13`,`16`],d:2,y:[`capraz`,`fark`,null],neden:`a = 3k = 12 ise k = 4; b = 4k = 16.`}},{id:`dogru`,baslik:`Doğru orantı`,metin:[`İki çokluktan biri artarken diğeri de aynı oranda artıyorsa doğru orantılıdırlar. Bölümleri sabittir.`,`Alınan ürün miktarı ile ödenen para, sabit hızla gidilen süre ile alınan yol doğru orantılıdır.`],kural:[`{y//x} = k   (sabit)`,`y = k·x`],ornek:{s:`3 kg elma 45 TL ise 5 kg elma kaç TL'dir?`,a:[`Bölüm sabit: {45//3} = {x//5}`,`İçler dışlar: 3·x = 45·5 = 225`,`x = 75 TL`]},baska:`En kısa yol birim değeri bulmaktır: 1 kg elma 45 ÷ 3 = 15 TL. 5 kg ise 5·15 = 75 TL. Doğru orantının özü "bir tanesi ne kadar?" sorusudur.`,soru:{s:`4 defter 60 TL ise 7 defter kaç TL'dir?`,o:[`63`,`105`,`420`],d:1,y:[`fark`,null,null],neden:`Bir defter 15 TL; 7 defter 7·15 = 105 TL.`}},{id:`ters`,baslik:`Ters orantı`,metin:[`İki çokluktan biri artarken diğeri aynı oranda azalıyorsa ters orantılıdırlar. Çarpımları sabittir.`,`Aynı iş için işçi sayısı ile süre, aynı yol için hız ile süre ters orantılıdır.`],kural:[`x·y = k   (sabit)`],ornek:{s:`6 işçi bir işi 12 günde bitiriyor. 9 işçi aynı işi kaç günde bitirir?`,a:[`İşçi artınca süre azalır: ters orantı`,`Çarpım sabit: 6·12 = 9·x`,`72 = 9x, x = 8 gün`]},baska:`Toplam iş değişmez. 6 işçi 12 gün çalışınca 6·12 = 72 "işçi-gün" emek harcanır. Aynı 72'yi 9 işçiye bölersen her birine 8 gün düşer. Önce toplamı bul, sonra yeni sayıya böl.`,soru:{s:`4 musluk bir havuzu 6 saatte dolduruyor. Aynı havuzu 8 musluk kaç saatte doldurur?`,o:[`12`,`3`,`10`],d:1,y:[`ters`,null,`fark`],neden:`Çarpım sabit: 4·6 = 8·x, x = 3 saat.`}},{id:`paylastir`,baslik:`Orantılı paylaştırma`,metin:[`Bir bütün 2, 3 ve 5 ile doğru orantılı paylaştırılacaksa paylar 2k, 3k ve 5k olur. Toplam bütüne eşitlenir ve k bulunur.`,`Ters orantılı paylaşımda paylar {k//2}, {k//3} gibi yazılır: sayısı küçük olan büyük payı alır.`],kural:[`Doğru orantılı paylar: a·k, b·k`,`Ters orantılı paylar: {k//a}, {k//b}`],ornek:{s:`120 TL, 2 ve 3 ile ters orantılı paylaştırılırsa paylar kaç TL olur?`,a:[`Paylar {k//2} ve {k//3}`,`{k//2} + {k//3} = {5k//6} = 120, buradan k = 144`,`Paylar: {144//2} = 72 TL ve {144//3} = 48 TL`]},baska:`2 ve 3 ile ters orantılı olmak, {1//2} ve {1//3} ile doğru orantılı olmaktır. Paydaları eşitle: {3//6} ve {2//6}. Yani para 3'e 2 paylaşılır: 120'nin beşte üçü 72, beşte ikisi 48.`,soru:{s:`60 ceviz, 1 ve 2 ile doğru orantılı paylaştırılırsa küçük pay kaç ceviz olur?`,o:[`20`,`30`,`40`],d:0,y:[null,`pay`,null],neden:`k + 2k = 60, k = 20. Küçük pay 20 ceviz.`}}],ozet:[`Oran bölümdür. {a//b} = {2//3} ise a = 2k, b = 3k yazılır.`,`Orantıda içler dışlar çarpımı eşittir: a·d = b·c.`,`Doğru orantı: birlikte artarlar, bölüm sabittir.`,`Ters orantı: biri artar, öbürü azalır; çarpım sabittir.`,`Paylaştırmada önce payları k ile yaz, toplamı bütüne eşitle.`,`Birden çok çokluk varsa toplam işi (işçi × saat × gün) hesapla.`],sorular:[{id:`s1`,z:1,kart:`oran`,s:`{a//b} = {2//5} ve a + b = 42 ise b kaçtır?`,o:[`5`,`12`,`18`,`30`,`35`],d:3,y:[`fark`,null,null,null,null],c:[`a = 2k ve b = 5k yaz`,`a + b = 7k = 42, buradan k = 6`,`b = 5·6 = 30`],h:`12 / 30 === 2 / 5 && 12 + 30 === 42`},{id:`s2`,z:1,kart:`dogru`,s:`Bir araç sabit hızla 3 saatte 240 km yol alıyor. Aynı hızla 5 saatte kaç km yol alır?`,o:[`144`,`320`,`360`,`400`,`480`],d:3,y:[`ters`,null,null,null,null],c:[`Süre artınca yol da artar: doğru orantı`,`Bir saatte alınan yol: 240 ÷ 3 = 80 km`,`5 saatte: 5·80 = 400 km`],h:`240 / 3 * 5 === 400`},{id:`s3`,z:1,kart:`ters`,s:`8 işçi bir işi 15 günde bitiriyor. Aynı işi 12 işçi kaç günde bitirir?`,o:[`8`,`10`,`12`,`19`,`22,5`],d:1,y:[null,null,null,`fark`,`ters`],c:[`İşçi artınca süre azalır: ters orantı`,`Çarpım sabit: 8·15 = 12·x`,`120 = 12x, x = 10 gün`],h:`8 * 15 / 12 === 10`},{id:`s4`,z:2,kart:`paylastir`,s:`180 TL, üç kardeş arasında 2, 3 ve 4 sayılarıyla doğru orantılı paylaştırılıyor. En büyük pay kaç TL'dir?`,o:[`40`,`60`,`80`,`90`,`120`],d:2,y:[null,null,null,`pay`,null],c:[`Paylar 2k, 3k ve 4k`,`2k + 3k + 4k = 9k = 180, buradan k = 20`,`En büyük pay: 4·20 = 80 TL`],h:`180 / 9 * 4 === 80`},{id:`s5`,z:2,kart:`oran`,s:`{x//3} = {y//4} = {z//5} ve x + y + z = 48 ise z − x kaçtır?`,o:[`2`,`4`,`8`,`12`,`20`],d:2,y:[`fark`,null,null,null,null],c:[`x = 3k, y = 4k, z = 5k yaz`,`3k + 4k + 5k = 12k = 48, buradan k = 4`,`z − x = 5k − 3k = 2k = 8`],h:`12 + 16 + 20 === 48 && 20 - 12 === 8`},{id:`s6`,z:2,kart:`paylastir`,s:`140 ceviz, Ali ve Burak arasında sırasıyla 2 ve 5 sayılarıyla ters orantılı paylaştırılıyor. Ali kaç ceviz alır?`,o:[`40`,`56`,`70`,`100`,`120`],d:3,y:[`ters`,null,`pay`,null,null],c:[`Ters orantılı paylar: Ali {k//2}, Burak {k//5}`,`{k//2} + {k//5} = {7k//10} = 140, buradan k = 200`,`Ali: {200//2} = 100 ceviz`],h:`200 / 2 + 200 / 5 === 140`},{id:`s7`,z:3,kart:`ters`,s:`6 işçi günde 8 saat çalışarak bir işi 10 günde bitiriyor. Aynı işi 8 işçi günde 6 saat çalışarak kaç günde bitirir?`,o:[`7,5`,`8`,`10`,`12`,`15`],d:2,y:[null,null,null,null,null],c:[`Toplam iş: 6·8·10 = 480 işçi-saat`,`Yeni ekip bir günde 8·6 = 48 işçi-saat çalışır`,`480 ÷ 48 = 10 gün`],h:`6 * 8 * 10 / (8 * 6) === 10`},{id:`s8`,z:3,kart:`ters`,s:`a sayısı b ile doğru, c ile ters orantılıdır. a = 6 iken b = 4 ve c = 2'dir. Buna göre b = 10 ve c = 3 iken a kaçtır?`,o:[`5`,`10`,`15`,`22,5`,`45`],d:1,y:[null,null,null,`ters`,null],c:[`Doğru orantılı olan çarpılır, ters orantılı olan bölünür: a = {k·b//c}`,`6 = {k·4//2}, buradan k = 3`,`a = {3·10//3} = 10`],h:`3 * 4 / 2 === 6 && 3 * 10 / 3 === 10`}]},Fh={id:`tr-yazim`,ad:`Yazım Kuralları`,dk:20,giris:`Sınavda en sık çıkan dört başlık: de ile ki'nin yazımı, soru eki, büyük harfler ve kesme işareti.`,yan:{baglac:{ad:`Bağlaç olan "de"yi bitişik yazmak`,anlat:`"Dahi, bile" anlamı katan de/da bağlaçtır ve her zaman ayrı yazılır. Cümleden çıkarıldığında cümle bozulmaz. Bağlaç olan de hiçbir zaman "te, ta" biçimine girmez.`,ornek:`"Sen de gel." cümlesinden de çıkarılınca "Sen gel." kalır; cümle bozulmaz, o hâlde ayrı yazılır.`},ek:{ad:`Ek olan "-de"yi ayrı yazmak`,anlat:`Yer ya da zaman bildiren -de/-da ektir ve bitişik yazılır. Çıkarıldığında cümle bozulur.`,ornek:`"Evde kaldım." cümlesinden -de çıkarılınca "Ev kaldım." olur; bozulur, o hâlde bitişik yazılır.`},ki:{ad:`Bağlaç olan "ki" ile ek olan "-ki"yi karıştırmak`,anlat:`Bağlaç olan ki ayrı yazılır. Sıfat yapan ve zamir olan -ki bitişik yazılır; arkasına -ler getirilebiliyorsa ektir. Kalıplaşmış birkaç sözcük de bitişiktir: sanki, oysaki, mademki, belki, hâlbuki, çünkü, meğerki.`,ornek:`"Evdeki" sözcüğü "evdekiler" olabilir: ek, bitişik. "Duydum ki" için "duydum kiler" denmez: bağlaç, ayrı.`},mi:{ad:`Soru ekini bitişik yazmak`,anlat:`Soru eki mı, mi, mu, mü kendinden önceki sözcükten her zaman ayrı yazılır. Kendinden sonra gelen ekler ise ona bitişir.`,ornek:`"Gelecek misin?" doğrudur; "Gelecekmisin?" yanlıştır.`},tarih:{ad:`Tarih bildirmeyen ay ve gün adını büyük yazmak`,anlat:`Ay ve gün adları yalnızca belirli bir tarihi gösterdiklerinde büyük harfle başlar. Yanlarında gün sayısı ya da yıl yoksa küçük yazılırlar.`,ornek:`"29 Ekim 1923 Pazartesi" büyük; "ekim ayında", "her pazartesi" küçük yazılır.`},yon:{ad:`Yön adlarının yazımını karıştırmak`,anlat:`Yön adı özel addan önce gelip onunla birlikte bir bölgeyi adlandırıyorsa büyük yazılır. Özel addan sonra gelirse küçük yazılır.`,ornek:`"Doğu Anadolu" büyük; "Anadolu'nun doğusu" küçük yazılır.`},kesme:{ad:`Kesme işaretinin yerini karıştırmak`,anlat:`Özel adlara gelen çekim ekleri kesmeyle ayrılır. Yapım ekleri ve onlardan sonra gelen ekler ayrılmaz.`,ornek:`"Ankara'ya" doğru; "Ankara'lı" yanlış, doğrusu "Ankaralı". "Türkçeyi" de kesmesiz yazılır.`},kurum:{ad:`Kurum adına gelen eki kesmeyle ayırmak`,anlat:`Kurum, kuruluş ve kurul adlarına gelen ekler kesmeyle ayrılmaz.`,ornek:`"Türk Dil Kurumunun" doğru; "Türk Dil Kurumu'nun" yanlıştır.`},hersey:{ad:`Ayrı ve bitişik yazılan kalıpları karıştırmak`,anlat:`"Şey" sözcüğü her zaman ayrı yazılır: her şey, bir şey. "Birkaç, birçok, hiçbir, herhangi" bitişik; "pek çok, ya da" ayrı yazılır.`,ornek:`"Hiçbir şey" yazımında hiçbir bitişik, şey ayrıdır.`}},kartlar:[{id:`dede`,baslik:`"de" ne zaman ayrı yazılır?`,metin:[`Türkçede iki ayrı "de" vardır. Biri bağlaçtır: "dahi, bile" anlamı katar ve ayrı yazılır. Öbürü ektir: yer ya da zaman bildirir ve bitişik yazılır.`,`Ayırmak için "de"yi cümleden çıkar. Cümle bozulmuyorsa bağlaçtır. Bağlaç olan de hiçbir zaman "te, ta" olmaz; "Kitap ta aldım." yanlıştır, doğrusu "Kitap da aldım."`],kural:[`Çıkarınca cümle bozulmuyorsa: bağlaç, ayrı yaz`,`Çıkarınca cümle bozuluyorsa: ek, bitişik yaz`],ornek:{s:`"Bu akşam bizde kal, kardeşin de gelsin." cümlesindeki iki "de" nasıl yazılmış?`,a:[`"bizde": çıkarınca "Bu akşam biz kal" olur, bozulur. Ek, bitişik.`,`"kardeşin de": çıkarınca "kardeşin gelsin" olur, bozulmaz. Bağlaç, ayrı.`,`İkisi de doğru yazılmış.`]},baska:`Bir başka deneme: "de"nin yerine "bile" koy. "Ben de geldim" yerine "Ben bile geldim" denebiliyor; bağlaç, ayrı yazılır. "Evde kaldım" yerine "Ev bile kaldım" denemiyor; ek, bitişik yazılır.`,soru:{s:`"Okulda sen de vardın." cümlesinde ayrı yazılan "de" için hangisi doğrudur?`,o:[`Yer bildiren ektir`,`Bağlaçtır, doğru yazılmıştır`,`Yanlış yazılmıştır, bitişik olmalıdır`],d:1,y:[`ek`,null,`baglac`],neden:`"Okulda sen vardın." cümlesi bozulmuyor; bağlaçtır ve ayrı yazılır.`}},{id:`kimi`,baslik:`"ki" ve soru eki "mi"`,metin:[`Bağlaç olan ki ayrı yazılır: "Öyle yoruldum ki anlatamam." Sıfat yapan -ki ile zamir olan -ki bitişik yazılır: "evdeki hesap", "benimki".`,`Soru eki mı, mi, mu, mü her zaman ayrı yazılır; ardından gelen ekler ona bitişir: "Geldin mi?", "Gelecek misin?", "Güzel miydi?"`],kural:[`Arkasına -ler geliyorsa (evdekiler): ek, bitişik`,`Gelmiyorsa: bağlaç, ayrı`,`Soru eki her zaman ayrı`],ornek:{s:`"Bahçedeki çiçekler öyle güzel ki bakmaya doyamadım." cümlesindeki iki "ki" nasıl yazılmış?`,a:[`"bahçedeki": "bahçedekiler" denebiliyor. Ek, bitişik.`,`"güzel ki": "güzel kiler" denemiyor. Bağlaç, ayrı.`,`İkisi de doğru yazılmış.`]},baska:`Bitişik yazılan kalıplaşmış yedi sözcüğün baş harfleri "SOMBaHÇeM" eder: Sanki, Oysaki, Mademki, Belki, Hâlbuki, Çünkü, Meğerki. Bunların dışında bağlaç olan ki ayrı yazılır.`,soru:{s:`Aşağıdakilerin hangisinde yazım yanlışı vardır?`,o:[`Sen de mi geldin?`,`Öyle yoruldum ki anlatamam.`,`Bahçede ki çiçekler açmış.`],d:2,y:[`mi`,`ki`,null],neden:`"Bahçedeki" sıfat yapan -ki almıştır; bitişik yazılır.`}},{id:`buyuk`,baslik:`Büyük harflerin kullanımı`,metin:[`Özel adlar, dil ve millet adları, kurum adları büyük harfle başlar: Türkçe, İngiliz, Türk Dil Kurumu.`,`Ay ve gün adları yalnızca belirli bir tarihi gösterdiklerinde büyük yazılır. Yön adları ise özel addan önce geldiklerinde büyük, sonra geldiklerinde küçük yazılır.`],kural:[`29 Ekim 1923 Pazartesi  ama  ekim ayında, her pazartesi`,`Doğu Anadolu  ama  Anadolu'nun doğusu`],ornek:{s:`"Okullar 14 Eylül 2026 Pazartesi günü açılacak; her eylül olduğu gibi heyecanlıyız." cümlesi doğru yazılmış mı?`,a:[`"14 Eylül 2026 Pazartesi" belirli bir tarih: büyük, doğru.`,`"her eylül" herhangi bir eylül: küçük, doğru.`,`Cümlede yazım yanlışı yok.`]},baska:`Kendine şunu sor: "Bu, takvimde tek bir gün mü?" "5 Mayıs 2025 Pazartesi" takvimde tek bir gündür, büyük yazılır. "Pazartesi günleri" ise yılda elli iki ayrı gündür, küçük yazılır.`,soru:{s:`Aşağıdakilerin hangisinin yazımı doğrudur?`,o:[`Okullar Eylül ayında açılacak.`,`Toplantı 12 Mart 2026 Perşembe günü yapılacak.`,`Türkiye'nin Batısı daha ılımandır.`],d:1,y:[`tarih`,null,`yon`],neden:`Gün ve yıl verildiği için belirli bir tarihtir; ay ve gün adı büyük yazılır.`}},{id:`kesme`,baslik:`Kesme işareti ve sık karıştırılan sözcükler`,metin:[`Özel adlara gelen çekim ekleri kesmeyle ayrılır: Ankara'ya, Ayşe'nin, 1923'te. Yapım ekleri ve onlardan sonra gelen ekler ayrılmaz: Ankaralı, Türkçenin. Kurum adlarına gelen ekler de kesmeyle ayrılmaz: Türk Dil Kurumunun.`,`"Şey" her zaman ayrı yazılır: her şey, bir şey. "Birkaç, birçok, hiçbir, herhangi" bitişik yazılır. Birden çok sözcükten oluşan sayılar ayrı yazılır: on beş, yüz elli.`],kural:[`Ankara'ya  ama  Ankaralı`,`her şey, bir şey  ama  birkaç, hiçbir`,`on beş, otuz iki`],ornek:{s:`"Türk Dil Kurumunun sözlüğünde hiçbir şey bulamadım." cümlesi doğru yazılmış mı?`,a:[`"Kurumunun": kurum adına gelen ek kesmeyle ayrılmaz, doğru.`,`"hiçbir": bitişik, doğru.`,`"şey": ayrı, doğru.`,`Cümlede yazım yanlışı yok.`]},baska:`Kesme için tek soru: ek, özel adı başka bir sözcüğe çeviriyor mu? "Ankaralı" artık bir şehir değil, bir kişidir; yeni bir sözcük oluştu, kesme konmaz. "Ankara'ya" derken şehir hâlâ aynı şehirdir; kesme konur.`,soru:{s:`Aşağıdakilerin hangisinin yazımı doğrudur?`,o:[`Türk Dil Kurumu'nun sitesine baktım.`,`Herşey yolunda.`,`Ankara'dan birkaç kişi geldi.`],d:2,y:[`kurum`,`hersey`,null],neden:`"Ankara'dan" özel ada gelen çekim ekidir, "birkaç" bitişik yazılır.`}}],ozet:[`Bağlaç olan de/da ayrı yazılır; çıkarınca cümle bozulmaz. Ek olan -de/-da bitişik yazılır.`,`Bağlaç olan ki ayrı; sıfat yapan ve zamir olan -ki bitişik. Bitişik kalıplar: sanki, oysaki, mademki, belki, hâlbuki, çünkü, meğerki.`,`Soru eki mı, mi, mu, mü her zaman ayrı yazılır.`,`Ay ve gün adları yalnızca belirli bir tarihte büyük yazılır.`,`Yön adı özel addan önce büyük (Doğu Anadolu), sonra küçük (Anadolu'nun doğusu).`,`Özel ada gelen çekim eki kesmeyle ayrılır; yapım eki ve kurum adına gelen ek ayrılmaz.`,`her şey, bir şey ayrı; birkaç, birçok, hiçbir bitişik; on beş ayrı.`],sorular:[{id:`s1`,z:1,kart:`dede`,s:`Aşağıdaki cümlelerin hangisinde "de"nin yazımı yanlıştır?`,o:[`Bu konuyu ben de bilmiyorum.`,`Kitabı masanın üstünde unutmuş.`,`Sende mi bizimle geliyorsun?`,`Akşam evde olacağım.`,`Gitsek de olur, gitmesek de.`],d:2,y:[`baglac`,`ek`,null,`ek`,`baglac`],c:[`Her cümlede "de"yi çıkarıp cümlenin bozulup bozulmadığına bak.`,`C seçeneği: "Sen mi bizimle geliyorsun?" cümlesi bozulmuyor; bu de bağlaçtır.`,`Bağlaç ayrı yazılır: "Sen de mi bizimle geliyorsun?"`]},{id:`s2`,z:1,kart:`kimi`,s:`Aşağıdaki cümlelerin hangisinde "ki"nin yazımı yanlıştır?`,o:[`Bahçedeki ağaçlar çiçek açmış.`,`Öyle bir yağmur yağdı ki sokaklar göle döndü.`,`Seninki benimkinden daha yeni.`,`Duydumki sınavı kazanmışsın.`,`Mademki geldin, biraz otur.`],d:3,y:[`ki`,`ki`,`ki`,null,`ki`],c:[`Arkasına -ler getirmeyi dene: "bahçedekiler", "seninkiler" olur; bunlar ektir, bitişik yazılır.`,`"Duydum ki": "duydum kiler" olmaz; bağlaçtır.`,`Bağlaç ayrı yazılır: "Duydum ki sınavı kazanmışsın."`,`"Mademki" kalıplaşmış sözcüklerdendir, bitişik yazılır.`]},{id:`s3`,z:1,kart:`kimi`,s:`Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?`,o:[`Sen de mi geldin?`,`Yarın bize gelecekmisin?`,`Güzel mi güzel bir evdi.`,`Bunu sen mi yaptın?`,`Hava soğuk muydu?`],d:1,y:[`mi`,null,`mi`,`mi`,`mi`],c:[`Soru eki her zaman kendinden önceki sözcükten ayrı yazılır.`,`Kendinden sonra gelen ekler ona bitişir.`,`Doğrusu: "Yarın bize gelecek misin?"`]},{id:`s4`,z:2,kart:`buyuk`,s:`Aşağıdaki cümlelerin hangisinde büyük harflerin kullanımıyla ilgili bir yanlışlık vardır?`,o:[`Sınav 14 Haziran 2026 Pazar günü yapılacak.`,`Her yıl Ağustos ayında köye gideriz.`,`Güneydoğu Anadolu'da yazlar sıcak geçer.`,`Bu yaz Ege'nin kuzeyini gezeceğiz.`,`Türkçe dersinden yüksek not aldı.`],d:1,y:[`tarih`,null,`yon`,`yon`,null],c:[`A: gün ve yıl verilmiş, belirli bir tarih; büyük yazım doğru.`,`B: "her yıl ağustos ayında" belirli bir tarih değil; ay adı küçük yazılmalı.`,`C ve D: yön adı özel addan önce büyük, sonra küçük; ikisi de doğru.`,`Yanlış olan B: "Her yıl ağustos ayında köye gideriz."`]},{id:`s5`,z:2,kart:`kesme`,s:`Aşağıdaki cümlelerin hangisinde kesme işareti yanlış kullanılmıştır?`,o:[`Ayşe'nin kitabı bende kaldı.`,`Yarın İzmir'e gidiyoruz.`,`Toplantıya Ankara'lı iki öğretmen katıldı.`,`1923'te Cumhuriyet ilan edildi.`,`TDK'nin sözlüğüne baktım.`],d:2,y:[`kesme`,`kesme`,null,null,null],c:[`Özel adlara gelen çekim ekleri kesmeyle ayrılır: Ayşe'nin, İzmir'e.`,`"-lı" bir yapım ekidir; yeni bir sözcük oluşturur.`,`Yapım ekleri kesmeyle ayrılmaz: "Ankaralı".`]},{id:`s6`,z:2,kart:`kesme`,s:`Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?`,o:[`Bugün her şey yolunda gitti.`,`Birkaç gün sonra görüşürüz.`,`Bu konuda hiç bir fikrim yok.`,`Sana bir şey söyleyeceğim.`,`Pek çok kişi konsere geldi.`],d:2,y:[`hersey`,`hersey`,null,`hersey`,`hersey`],c:[`"Şey" her zaman ayrı yazılır: her şey, bir şey.`,`"Birkaç" bitişik, "pek çok" ayrı yazılır.`,`"Hiçbir" bitişik yazılır; C seçeneğinde ayrı yazılmış.`]},{id:`s7`,z:3,kart:`kesme`,s:`Aşağıdaki cümlelerin hangisinde yazım yanlışı yoktur?`,o:[`Türk Dil Kurumu'nun yeni sözlüğü yayımlandı.`,`Okulun önündeki parkta buluşalım, sen de gel.`,`Yarınki maça sende gelir misin?`,`Herkez bu habere çok sevindi.`,`Kardeşim bu yıl onbeş yaşına girdi.`],d:1,y:[`kurum`,null,`baglac`,null,null],c:[`A: kurum adına gelen ek kesmeyle ayrılmaz; doğrusu "Kurumunun".`,`C: "sen de" bağlaçtır, ayrı yazılır.`,`D: doğrusu "herkes".   E: doğrusu "on beş".`,`B: "önündeki" ek, bitişik; "sen de" bağlaç, ayrı. Yanlış yok.`]},{id:`s8`,z:3,kart:`buyuk`,s:`"Geçen Salı günü (I) Doğu Anadolu'ya (II) gittik. Oradaki (III) insanlar Türkçeyi (IV) çok güzel konuşuyordu; öyle ki (V) hayran kaldık." Numaralanmış sözlerin hangisinde yazım yanlışı vardır?`,o:[`I`,`II`,`III`,`IV`,`V`],d:0,y:[null,`yon`,`ki`,`kesme`,`ki`],c:[`I: "geçen salı günü" belirli bir tarih değil; gün adı küçük yazılmalı.`,`II: yön adı özel addan önce, büyük; doğru.`,`III: "oradakiler" denebiliyor; ek, bitişik; doğru.`,`IV: "-çe" yapım ekidir, sonrasına kesme konmaz; doğru.`,`V: "öyle ki" bağlaçtır, ayrı; doğru. Yanlış olan I.`]}]},Ih={id:`fiz-ozkutle`,ad:`Madde ve Özkütle`,dk:20,giris:`Aynı hacimde ne kadar madde var? Özkütle tanımı, kütle–hacim grafiği, karışımlar ve hacim ölçme.`,yan:{miktar:{ad:`Özkütleyi madde miktarına bağlamak`,anlat:`Özkütle maddenin kendisine ait, ayırt edici bir özelliktir. Aynı sıcaklık ve basınçta, maddenin ne kadar olduğuna bağlı değildir: kütle iki katına çıkarsa hacim de iki katına çıkar, oran değişmez.`,ornek:`Bir demir çubuk ikiye bölünürse her parçanın özkütlesi çubuğunkiyle aynıdır.`},tersoran:{ad:`Kütle ile hacmin yerini karıştırmak`,anlat:`Özkütle, kütlenin hacme bölümüdür. Birime bakmak yeterli: g/cm³, "gram bölü santimetreküp" demektir.`,ornek:`240 g ve 80 cm³ için d = {240//80} = 3 g/cm³ olur; {80//240} değil.`},birim:{ad:`Birim çevirmede yanılmak`,anlat:`1 g/cm³, 1000 kg/m³ eder. g/cm³ cinsinden değer kg/m³'e çevrilirken 1000 ile çarpılır.`,ornek:`Suyun özkütlesi 1 g/cm³ = 1000 kg/m³.`},eksen:{ad:`Grafikte eksenleri karıştırmak`,anlat:`Kütle düşey, hacim yatay eksendeyse doğrunun eğimi özkütleyi verir: dik olan daha yoğundur. Eksenler yer değiştirirse durum tersine döner. Önce eksenleri oku.`,ornek:`Aynı hacme karşılık kütlesi büyük olan maddenin özkütlesi büyüktür.`},ortalama:{ad:`Eşit hacim ile eşit kütleyi karıştırmak`,anlat:`Özkütlelerin ortalaması yalnızca eşit hacimli karışımda geçerlidir. Eşit kütleli ya da farklı miktarlı karışımda toplam kütle toplam hacme bölünür.`,ornek:`1 ve 3 g/cm³ için eşit hacimde 2 g/cm³, eşit kütlede 1,5 g/cm³ bulunur.`},topla:{ad:`Karışımda özkütleleri toplamak`,anlat:`Karışımın özkütlesi, karışan maddelerin özkütleleri arasında bir değerdir; ikisinden de büyük olamaz.`,ornek:`2 ve 4 g/cm³ özkütleli sıvıların karışımı 2 ile 4 arasında çıkar; 6 olamaz.`},seviye:{ad:`Su seviyesini cismin hacmi sanmak`,anlat:`Batan cismin hacmi, su seviyesindeki yükselme kadardır: son seviyeden ilk seviye çıkarılır.`,ornek:`Su 40 cm³ çizgisinden 70 cm³ çizgisine çıktıysa cismin hacmi 30 cm³'tür.`},kutle:{ad:`Taşan sıvıyı cismin kütlesine bağlamak`,anlat:`Tamamen batan bir cisim, kütlesi ne olursa olsun kendi hacmi kadar sıvının yerini değiştirir.`,ornek:`Aynı hacimli demir ve alüminyum bilyeler aynı miktarda su taşırır.`}},kartlar:[{id:`tanim`,baslik:`Özkütle nedir?`,metin:[`Özkütle, bir maddenin birim hacminin kütlesidir. Kütle hacme bölünerek bulunur; birimi g/cm³ ya da kg/m³'tür.`,`Saf maddeler için ayırt edici bir özelliktir: aynı sıcaklık ve basınçta, maddenin miktarı ne olursa olsun değişmez.`],kural:[`d = {m//V}`,`1 g/cm³ = 1000 kg/m³`],ornek:{s:`Kütlesi 200 g, hacmi 80 cm³ olan bir cismin özkütlesi kaç g/cm³'tür?`,a:[`d = {m//V} = {200//80}`,`Sonuç: 2,5 g/cm³`,`kg/m³ cinsinden: 2,5·1000 = 2500 kg/m³`]},baska:`Aynı boyda iki kutu düşün: biri pamukla, biri demirle dolu. Hacimleri eşit ama demir dolu olan çok daha ağır; çünkü demirin özkütlesi büyük. Özkütle, maddenin ne kadar sıkı paketlendiğini söyler.`,soru:{s:`Bir demir çubuk ikiye bölünürse parçaların özkütlesi nasıl olur?`,o:[`Yarıya iner`,`Değişmez`,`İki katına çıkar`],d:1,y:[`miktar`,null,`miktar`],neden:`Kütle de hacim de yarıya iner; oranları aynı kalır.`}},{id:`grafik`,baslik:`Kütle–hacim grafiği`,metin:[`Sabit sıcaklıkta bir maddenin kütlesi hacmiyle doğru orantılıdır. Kütle–hacim grafiği orijinden geçen bir doğrudur.`,`Kütle düşey, hacim yatay eksendeyse doğrunun eğimi özkütledir: doğru ne kadar dikse madde o kadar yoğundur.`],kural:[`eğim = {m//V} = d   (kütle düşey eksendeyken)`],ornek:{s:`Grafikte K için 20 cm³'e 60 g, L için 30 cm³'e 30 g karşılık geliyor. d_K / d_L kaçtır?`,a:[`d_K = {60//20} = 3 g/cm³`,`d_L = {30//30} = 1 g/cm³`,`d_K / d_L = 3`]},baska:`Grafikte aynı hacme, yani aynı düşey çizgiye bak. O hacimde hangisinin kütlesi fazlaysa o daha yoğundur. Eğim hesabına girmeden karşılaştırma yapmanın en hızlı yolu budur.`,soru:{s:`Kütle düşey, hacim yatay eksendeyken daha dik olan doğrunun özkütlesi nasıldır?`,o:[`Daha büyüktür`,`Daha küçüktür`,`Eşittir`],d:0,y:[null,`eksen`,null],neden:`Eğim {m//V} olduğundan dik doğru büyük özkütle demektir.`}},{id:`karisim`,baslik:`Karışımların özkütlesi`,metin:[`Karışımın özkütlesi, toplam kütlenin toplam hacme bölümüdür. Sonuç her zaman karışan maddelerin özkütleleri arasında kalır.`,`Eşit hacimde karıştırılırsa özkütlelerin ortalaması alınır. Eşit kütlede karıştırılırsa sonuç ortalamadan küçük çıkar, çünkü özkütlesi küçük olan daha çok yer kaplar.`],kural:[`d_{karışım} = {m_1 + m_2//V_1 + V_2}`,`Eşit hacim: {d_1 + d_2//2}`,`Eşit kütle: {2·d_1·d_2//d_1 + d_2}`],ornek:{s:`Özkütleleri 2 ve 6 g/cm³ olan iki sıvı eşit kütlede karıştırılırsa karışımın özkütlesi kaç olur?`,a:[`Her birinden 6 g alalım`,`Hacimler: {6//2} = 3 cm³ ve {6//6} = 1 cm³`,`Toplam kütle 12 g, toplam hacim 4 cm³`,`d = {12//4} = 3 g/cm³`]},baska:`Formül ezberlemek zorunda değilsin; kendine kolay sayılar seç. Eşit hacim deniyorsa her birinden 1 cm³ al, eşit kütle deniyorsa ikisinin de bölünebildiği bir kütle al. Sonra toplam kütleyi toplam hacme böl.`,soru:{s:`Özkütleleri 1 ve 3 g/cm³ olan iki sıvı eşit hacimde karıştırılırsa karışımın özkütlesi kaç g/cm³ olur?`,o:[`1,5`,`2`,`4`],d:1,y:[`ortalama`,null,`topla`],neden:`Eşit hacimde ortalama alınır: {1 + 3//2} = 2.`}},{id:`hacim`,baslik:`Hacim ölçme ve taşan sıvı`,metin:[`Düzgün olmayan bir katının hacmi sıvı yardımıyla ölçülür. Sıvıya tamamen batan cisim, kendi hacmi kadar sıvının yerini değiştirir.`,`Dereceli silindirde sıvı seviyesi cismin hacmi kadar yükselir. Ağzına kadar dolu bir kaptan ise cismin hacmi kadar sıvı taşar.`],kural:[`V_{cisim} = V_{son} − V_{ilk}`],ornek:{s:`50 cm³ su bulunan dereceli silindire 120 g'lık bir taş bırakılınca seviye 80 cm³ oluyor. Taşın özkütlesi kaçtır?`,a:[`Taşın hacmi: 80 − 50 = 30 cm³`,`d = {120//30}`,`Sonuç: 4 g/cm³`]},baska:`Küvete girdiğinde su yükselir. Yükselen su miktarı, vücudunun suya giren kısmının hacmidir; kilon bunu değiştirmez. Taş için de aynısı geçerli: su ne kadar yükseldiyse taşın hacmi o kadardır.`,soru:{s:`Suya tamamen batan iki bilyeden hacmi büyük olan için hangisi doğrudur?`,o:[`Daha çok su taşırır`,`Daha az su taşırır`,`Yalnızca kütlesi büyükse çok taşırır`],d:0,y:[null,null,`kutle`],neden:`Taşan su cismin hacmi kadardır; kütleye
