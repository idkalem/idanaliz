mi ve Sinaps, Duyu Organları`,kod:`BİY.11.1.6`,cikti:`Hayvanlardaki sinir sistemi farklılıkları ile ilgili analojik akıl yürütebilme`,y1:[0,0,0,0,0],y2:[1,2,1,1,1]},{sinif:11,ders:`biy`,tema:`Tepki`,konu:`İnsan Sinir Sisteminin Yapısı`,kod:`BİY.11.1.7`,cikti:`İnsanda sinir sistemi yapısını çözümleyebilme`,y1:[0,0,0,0,0],y2:[1,1,2,2,2]},{sinif:11,ders:`biy`,tema:`Tepki`,konu:`Refleksler`,kod:`BİY.11.1.8`,cikti:`Refleks olayını yorumlayabilme`,y1:[0,0,0,0,0],y2:[1,1,0,1,1]},{sinif:11,ders:`biy`,tema:`Tepki`,konu:`Kemik, Eklem ve Kasların Hareketteki Rolü, Kemik ve Kasların Birlikte Çalışma İlişkisi`,kod:`BİY.11.1.9`,cikti:`Harekete dayalı tepkinin oluşmasında iskelet, kas ve eklemlerin eş güdümlü çalışmasıyla ilgili eleştirel düşünebilme`,y1:[0,0,0,0,0],y2:[2,2,1,2,2]},{sinif:11,ders:`biy`,tema:`Tepki`,konu:`Kaslarda Kasılmanın Kontrolü, Kasların Kasılma Mekanizması`,kod:`BİY.11.1.10`,cikti:`İskelet kaslarının kasılma ve gevşeme mekanizması ile ilgili bilimsel model oluşturabilme`,y1:[0,0,0,0,0],y2:[0,0,0,0,0]}],n_=`MEB 9. Sınıf Matematik Ders Kitabı (1. Kitap)`,r_={id:`mat-uslu`,ad:`Üslü Gösterim`,dk:17,tdk:13,giris:`Çok büyük ve çok küçük sayıları kısa yazmanın yolu. Kuralları ezberlemeyeceksin: her birini önce küçük bir tabloda kendin göreceksin, sonra gerçek bir problemde kullanacaksın.`,day:{kod:`MAT.9.1.1`,kapsam:`Bu ders öğrenme çıktısının üslü gösterim bölümünü işler: tanım, sıfır ve negatif üs, toplama, çıkarma, çarpma, bölme, üssün üssü ve bilimsel gösterim. Köklü gösterim bir sonraki derstedir.`,surec:[`Gerçek sayıların üslü ve köklü gösterimleriyle yapılan işlemlere ilişkin varsayımlarda bulunur.`,`Farklı örneklerden elde ettiği örüntüleri listeleyerek varsayımlarına yönelik genellemeler yapar.`,`Varsayımları ile genellemelerini karşılaştırır.`,`Elde ettiği genellemelerden üslü ve köklü gösterimlerle ilgili önermeler sunar.`,`Üslü ve köklü gösterimlerle ilgili önermelerin kullanışlılığını problem durumlarında değerlendirir.`,`Üslü ve köklü gösterimlerle ilgili matematiksel doğrulama yöntemlerini kullanır.`,`Kullandığı matematiksel doğrulama yöntemlerini kullanışlılık açısından değerlendirir.`],kitap:`${n_}, 1. Tema: Sayılar, sayfa 13-24`,sira:[`Gerçek Sayıların Üslü Gösterimi`,`Üslü Gösterimlerle Toplama ve Çıkarma`,`Tabanları Aynı Olan Üslü Gösterimlerle Çarpma ve Bölme`,`Üsleri Aynı Olan Üslü Gösterimlerle Çarpma ve Bölme`,`Üslü Gösterimin Üssünü Alma`,`Bilimsel Gösterim`]},yan:{carp:{ad:`Üssü tabanla çarpmak`,anlat:`Üs, tabanın kaç kez kendisiyle çarpılacağını söyler; tabanla çarpılmaz.`,ornek:`2^3 = 2·2·2 = 8 olur; 2·3 = 6 değil.`},parantez:{ad:`Eksi işaretini üsse yanlış katmak`,anlat:`Parantez varsa eksi de tabana aittir: çift kuvvette sonuç pozitif, tek kuvvette negatif olur. Parantez yoksa önce üs alınır, eksi sonra başa konur.`,ornek:`(−2)^4 = 16 ama −2^4 = −16. (−2)^3 = −8.`},negatif:{ad:`Negatif üssün işareti değiştirdiğini sanmak`,anlat:`Negatif üs sayının işaretine dokunmaz; yalnızca çarpmaya göre tersini aldırır. Pozitif sayı pozitif, negatif sayı negatif kalır.`,ornek:`2^{−3} = {1//8} olur; −8 değil. (−{1//3})^{−1} = −3 olur; 3 değil.`},sifir:{ad:`Sıfırıncı kuvveti yanlış almak`,anlat:`Sıfırdan farklı her sayının sıfırıncı kuvveti 1'dir. Üs birer birer azalırken sonuç her seferinde tabana bölünür: 2^1 = 2 sayısından bir adım sonra 2 ÷ 2 = 1 gelir.`,ornek:`4^0 = 1 olur; 0 ya da 4 değil.`},toplam:{ad:`Toplama ve çıkarmada üslerle işlem yapmak`,anlat:`Üsleri toplama ve çıkarma kuralları çarpma ile bölmeye aittir. Toplama ve çıkarmada üslere dokunulmaz; aynı üslü gösterimden kaç tane olduğu sayılır.`,ornek:`5·10^9 − 0,2·10^9 = 4,8·10^9 olur; üs 9 olarak kalır. 2^3 + 2^3 = 2·2^3 olur; 2^6 değil.`},esitle:{ad:`Üsleri eşitlemeden katsayıları toplamak`,anlat:`Katsayılar ancak taban da üs de aynıyken toplanıp çıkarılabilir. Üsler farklıysa önce hepsi aynı üsle yazılır.`,ornek:`7,5·10^8 − 5,8·10^7 işleminde önce 5,8·10^7 = 0,58·10^8 yazılır; sonuç 6,92·10^8 olur, 1,7·10^8 değil.`},ortak:{ad:`Ortak çarpan parantezinde kalan çarpanı unutmak`,anlat:`Bir terimi ortak çarpana böldüğünde geriye ne kaldığını tek tek yazman gerekir. Üs büyüdükçe kalan çarpan da büyür.`,ornek:`3·2^{10} sayısını 2^7 parantezine alırsan geriye 3 değil, 3·2^3 = 24 kalır.`},uscarp:{ad:`Çarpmada üsleri çarpmak`,anlat:`Tabanlar aynıyken çarpmada üsler toplanır, çünkü çarpanlar yan yana eklenir. Üsler yalnızca üssün üssü alınırken çarpılır.`,ornek:`2^3·2^4 = 2^{3+4} = 2^7 olur; 2^{12} değil.`},bolme:{ad:`Bölmede üsleri yanlış çıkarmak`,anlat:`Bölmede paydaki üsten paydadaki üs çıkarılır. Paydadaki üs negatifse çıkarma toplamaya döner; çünkü eksi bir sayıyı çıkarmak onu eklemektir.`,ornek:`2^{10} ÷ 2^{−2} = 2^{10−(−2)} = 2^{12} olur; 2^8 değil.`},ustopla:{ad:`Üssün üssünde üsleri toplamak`,anlat:`Üssün üssü, aynı paketin tekrar tekrar çarpılmasıdır: paket sayısı ile paketteki çarpan sayısı çarpılır.`,ornek:`(3^2)^3 = 3^2·3^2·3^2 = 3^6 olur; 3^5 değil.`},eslestir:{ad:`Aynı üs kuralını yanlış kullanmak`,anlat:`x^a·y^a = (x·y)^a kuralında üs değişmez, yalnızca tabanlar çarpılır. Kural da yalnızca üsler aynıyken geçerlidir; üsler farklıysa önce eşit sayıda çarpan ayrılır.`,ornek:`2^3·5^3 = 10^3 olur; 10^6 değil. 2^7·5^9 çarpımında yalnızca 7 çift eşleşir: 10^7·5^2.`},basamak:{ad:`Üssü basamak sayısı sanmak`,anlat:`10^n sayısında 1'in sağında n tane sıfır vardır; sayı n + 1 basamaklıdır. Önündeki katsayının basamakları da ayrıca sayılır.`,ornek:`3·10^9 = 3 000 000 000 on basamaklıdır; dokuz değil.`},bilim:{ad:`Virgülü kaydırırken üssü ayarlamamak`,anlat:`Bilimsel gösterimde katsayı 1 ile 10 arasında olmalıdır. Virgülü her bir basamak kaydırdığında üs de 1 değişir: virgül sola giderse üs artar, sağa giderse azalır.`,ornek:`0,4·10^2 = 4·10^1 = 40 olur; 4 ya da 400 değil.`},kiyas:{ad:`Yalnızca katsayıya ya da yalnızca üsse bakarak karşılaştırmak`,anlat:`Üsleri farklı yazılmış sayılar katsayılarına bakılarak karşılaştırılamaz. Önce hepsi aynı üsle yazılır, sonra katsayılar karşılaştırılır.`,ornek:`9,8·10^3 sayısı 2,45·10^4 sayısından küçüktür; çünkü 9,8·10^3 = 0,98·10^4.`},dagit:{ad:`Üssü toplamaya dağıtmak`,anlat:`Üs, çarpmaya dağılır ama toplamaya dağılmaz. Küçük sayılarla denemek bunu hemen gösterir.`,ornek:`(1 + 2)^2 = 9 ama 1^2 + 2^2 = 5.`}},kartlar:[{id:`tanim`,baslik:`Üslü gösterim ne söyler?`,gorsel:{tip:`eslestir`,ad:`Üslü gösterimi değeriyle eşleştir`,cift:[[`2^5`,`32`],[`5^2`,`25`],[`10^3`,`1000`],[`3^4`,`81`],[`(−3)^3`,`−27`]]},ilgi:{sanat:`Bir desen her adımda üç küçük kopyasına ayrılıyor. 4 adım sonra 3·3·3·3 = 3^4 = 81 küçük desen oluşur. Tekrar eden desenleri saymak üslü gösterimin işidir.`,bilim:`Bir bakteri her bölünmede ikiye ayrılır. 10 bölünme sonra tek bakteriden 2^{10} = 1024 bakteri oluşur.`,insan:`Bir haberi duyan herkes onu 3 kişiye iletiyor. 4 adım sonra haberi yeni duyanların sayısı 3·3·3·3 = 3^4 = 81 olur.`,girisim:`Bir ürünü beğenen her müşteri 2 yeni müşteri getiriyor. 6 adım sonra son adımda gelen müşteri sayısı 2^6 = 64 olur.`},giris:`İnsan beyninde yaklaşık 86 000 000 000 nöron vardır. Bir nötronun kütlesi ise yaklaşık 0,000 000 000 000 000 000 000 001 675 gramdır. Bu sayıları her seferinde böyle yazmak hem yorucu hem hataya açık.`,metin:[`Aynı sayının art arda çarpımını kısa yazmanın yolu üslü gösterimdir. a^n yazımında **a** tabandır, **n** üstür: üs, tabanın kaç kez çarpılacağını söyler. 2^5 demek 2·2·2·2·2 demektir; 2·5 demek değildir.`,`10'un kuvvetleri özellikle işe yarar: 10^3 = 1000 ve 10^6 = 1 000 000. Üs, 1'in sağındaki sıfır sayısıdır. Beyindeki nöron sayısı bu yüzden 8,6·10^{10} diye yazılır.`,`Eksi işaretine dikkat et. Parantez varsa eksi de tabana aittir; parantez yoksa üs yalnızca sayıya aittir ve eksi en sona kalır. Tablonun son iki satırını karşılaştır.`],tablo:{ad:`Üslü gösterim ve yapılan işlem`,bas:[`Üslü gösterim`,`Yapılan işlem`,`Sonuç`],sat:[[`1^4`,`1·1·1·1`,`1`],[`({2//3})^4`,`{2//3}·{2//3}·{2//3}·{2//3}`,`{16//81}`],[`(−2)^5`,`(−2)·(−2)·(−2)·(−2)·(−2)`,`−32`],[`(−3)^4`,`(−3)·(−3)·(−3)·(−3)`,`81`],[`−3^4`,`−(3·3·3·3)`,`−81`]]},kural:[`a^n = a·a·…·a   (n tane a;  a taban, n üs)`,`(−a)^n: n çiftse pozitif, n tekse negatif`,`−a^n = −(a^n)`],ornek:{s:`(−2)^4 − 2^4 + (−1)^7 işleminin sonucu kaçtır?`,a:[`(−2)^4 = 16   (parantez var, çift kuvvet: pozitif)`,`2^4 = 16`,`(−1)^7 = −1   (tek kuvvet: negatif)`,`16 − 16 + (−1) = −1`]},baska:`Bir kâğıdı ikiye katla: 2 kat. Bir daha katla: 4 kat. Bir daha: 8 kat. Her katlamada kat sayısı 2 ile çarpılır; 3 katlamadan sonra 2·2·2 = 2^3 = 8 kat olur. Üs, kaç kez katladığını sayar; sonucu bulmak için tabanı o kadar kez çarparsın.`,soru:{s:`(−2)^3 kaçtır?`,o:[`−8`,`−6`,`8`],d:0,y:[null,`carp`,`parantez`],neden:`(−2)·(−2)·(−2) = −8. Üs tek olduğu için sonuç negatif.`}},{id:`ters`,baslik:`Sıfır ve negatif üs`,gorsel:{tip:`us-katla`},ilgi:{sanat:`Bir çizimi her seferinde yarı ölçeğe küçültüyorsun. Genişliği önce {1//2}, sonra {1//4}, sonra {1//8} olur: 2^{−1}, 2^{−2}, 2^{−3}.`,bilim:`Bir metreyi önce 10, sonra yine 10, sonra yine 10 eş parçaya böl: 10^{−1} m bir desimetre, 10^{−2} m bir santimetre, 10^{−3} m bir milimetredir.`,insan:`Bir miras her kuşakta iki kardeş arasında eşit paylaşılıyor. 3 kuşak sonra bir kişiye ilk mirasın {1//8} kadarı, yani 2^{−3} katı düşer.`,girisim:`Bir ürünün fiyatı her indirimde yarıya iniyor. 3 indirim sonra ilk fiyatın {1//8} kadarı, yani 2^{−3} katı kalır.`},giris:`Bir hidrojen atomunun çekirdeğinin çapı yaklaşık 0,00000000000000175 metredir. Bu kadar küçük sayıları da üsle yazabilmek için üssün sıfır ve negatif olduğu durumları anlamak gerekir.`,metin:[`Tabloya bak: 2'nin kuvvetlerinde üs bir azaldığında sonuç 2'ye bölünüyor. Aynı örüntüyü sürdürürsen üs 0 olduğunda 1'e, üs negatif olduğunda kesirlere ulaşırsın.`,`Demek ki negatif üs sayıyı negatif yapmaz; sayının **çarpmaya göre tersini** aldırır. a^{−n}, 1'in a^n sayısına bölümüdür. Kesirlerde bu, pay ile paydanın yer değiştirmesi demektir.`,`Sıfırdan farklı her sayının sıfırıncı kuvveti 1'dir. Sıfırın pozitif kuvvetleri ise 0'dır: 0^5 = 0.`],tablo:{ad:`Üs birer birer azalırken`,bas:[`Üslü gösterim`,`2^3`,`2^2`,`2^1`,`2^0`,`2^{−1}`,`2^{−2}`],sat:[[`Sonuç`,`8`,`4`,`2`,`1`,`{1//2}`,`{1//4}`],[`Öncekine göre`,``,`÷ 2`,`÷ 2`,`÷ 2`,`÷ 2`,`÷ 2`]]},kural:[`a^0 = 1   (a ≠ 0)`,`a^{−n} = {1//a^n}   (a ≠ 0)`,`({a//b})^{−n} = ({b//a})^n`],ornek:{s:`4^{−1} + ({1//3})^{−2} + (−6)^0 işleminin sonucu kaçtır?`,a:[`4^{−1} = {1//4}`,`({1//3})^{−2} = 3^2 = 9   (kesir ters çevrilir, üs pozitif olur)`,`(−6)^0 = 1   (sıfırdan farklı her sayının sıfırıncı kuvveti 1)`,`{1//4} + 9 + 1 = {41//4}`]},baska:`Üssü bir merdiven gibi düşün. Bir basamak yukarı çıkmak tabanla çarpmak, bir basamak aşağı inmek tabana bölmektir. 2^1 = 2 basamağından bir aşağı inersen 2 ÷ 2 = 1 olur: bu 2^0. Bir daha inersen 1 ÷ 2 = {1//2} olur: bu 2^{−1}. Hiçbir basamakta sayı negatife dönmez; yalnızca küçülür.`,soru:{s:`5^{−2} kaçtır?`,o:[`−25`,`{1//25}`,`−10`],d:1,y:[`negatif`,null,`carp`],neden:`5^{−2} = {1//5^2} = {1//25}. Negatif üs sayıyı negatif yapmaz, tersini aldırır.`}},{id:`topla`,baslik:`Toplama ve çıkarma`,gorsel:{tip:`grupla`,ad:`Hemen toplanır mı?`,kutu:[`Hemen toplanır`,`Hemen toplanmaz`],oge:[[`3·5^{10} + 5^{10}`,0],[`2^3 + 2^4`,1],[`5·7^{12} − 2·7^{12}`,0],[`2^5 + 3^5`,1],[`0,4·5^7 + 2,1·5^7`,0],[`5,8·10^7 + 7,5·10^8`,1]]},giris:`Bir laboratuvarda incelenen 1 litre kanda 5·10^9 alyuvar, 6·10^6 akyuvar ve 0,2·10^9 trombosit sayılmıştır. Alyuvarlarla trombositlerin toplamı kaçtır?`,metin:[`Tabloya bak: 3·5^{10} + 5^{10} demek, 5^{10} sayısından önce 3 tane, sonra 1 tane daha almak demektir. Toplam 4 tane 5^{10} eder. Üslü gösterim burada bir elma gibi sayılır: 3 elma ile 1 elma, 4 elma.`,`Bunun adı **ortak çarpan parantezine almak**tır. Yalnızca tabanı da üssü de aynı olan üslü gösterimler bu şekilde toplanıp çıkarılabilir. Üslere dokunulmaz; toplanan ya da çıkarılan katsayılardır.`,`Kandaki alyuvar ve trombosit toplamı böylece hemen bulunur: 5·10^9 + 0,2·10^9 = 5,2·10^9. Üsler farklı olsaydı önce eşitlemek gerekirdi; aşağıdaki örnek bunu gösteriyor.`],tablo:{ad:`Ortak çarpan parantezi`,bas:[`İşlem`,`Ortak çarpan parantezi`,`Sonuç`],sat:[[`3·5^{10} + 5^{10}`,`(3 + 1)·5^{10}`,`4·5^{10}`],[`5·7^{12} − 2·7^{12}`,`(5 − 2)·7^{12}`,`3·7^{12}`],[`−7·11^5 + 4·11^5`,`(−7 + 4)·11^5`,`−3·11^5`],[`0,4·5^7 + 2,1·5^7`,`(0,4 + 2,1)·5^7`,`2,5·5^7`]]},kural:[`a·x^n + b·x^n − c·x^n = (a + b − c)·x^n`],ornek:{s:`Aynı doğrultudayken Merkür'ün Güneş'e uzaklığı yaklaşık 5,8·10^7 km, Jüpiter'in Güneş'e uzaklığı yaklaşık 7,5·10^8 km'dir. Merkür, Güneş ile Jüpiter'in arasındadır. Merkür ile Jüpiter arasındaki uzaklık yaklaşık kaç km'dir?`,a:[`İstenen uzaklık bir farktır: 7,5·10^8 − 5,8·10^7`,`Üsler farklı, önce eşitle: 5,8·10^7 = 0,58·10^8`,`Ortak çarpan parantezi: (7,5 − 0,58)·10^8`,`Sonuç: 6,92·10^8 km`]},baska:`10^8 yerine "yüz milyon" de. 7,5 yüz milyondan 0,58 yüz milyon çıkarırsan 6,92 yüz milyon kalır. "Yüz milyon" sözü işlem boyunca hiç değişmedi; üslü gösterim de aynı şekilde olduğu gibi kalır. Ama birimler farklıysa, biri yüz milyon öteki on milyonsa, önce aynı birime çevirmen gerekir.`,soru:{s:`2^3 + 2^3 işleminin sonucu hangisidir?`,o:[`2^6`,`2^4`,`4^3`],d:1,y:[`toplam`,null,`toplam`],neden:`2^3 + 2^3 = 8 + 8 = 16 = 2^4. Ortak çarpanla: (1 + 1)·2^3 = 2·2^3. Üsler toplanmadı; iki tane 2^3 sayıldı.`}},{id:`carp`,baslik:`Çarpma ve bölme: tabanlar aynıysa`,gorsel:{tip:`us-birlestir`},ilgi:{sanat:`Bir görselin genişliği 2^{10} piksel, yüksekliği 2^9 piksel olsun. Toplam piksel sayısı 2^{10}·2^9 = 2^{19} eder.`,bilim:`Saniyede 10^9 işlem yapan bir bilgisayar 10^3 saniyede 10^9·10^3 = 10^{12} işlem yapar.`,insan:`Bir kütüphanede 10^4 kitap, her kitapta yaklaşık 10^5 harf varsa kütüphanedeki harf sayısı 10^4·10^5 = 10^9 eder.`,girisim:`Günde 10^3 sipariş alan bir dükkân her siparişten 10^2 TL kazanıyorsa günlük geliri 10^3·10^2 = 10^5 TL olur.`},giris:`Ankara'daki barajlarda 2001 yılının ocak ayında yaklaşık 4·10^6 metreküp, 2024 yılının ocak ayında yaklaşık 1,6·10^8 metreküp su ölçülmüştür. 1 metreküp 1000 litredir. 2001'deki su kaç litredir?`,metin:[`Tablodaki çarpımları açık yaz ve çarpanları say: 2^3·2^4 çarpımında önce 3 tane, sonra 4 tane 2 var; toplam 7 tane. Çarpmada çarpanlar yan yana eklenir, bu yüzden **üsler toplanır**.`,`Bölmede paydaki ve paydadaki çarpanlar birbirini götürür: 2^5 ÷ 2^3 işleminde 5 çarpandan 3'ü sadeleşir, 2 tanesi kalır. Bu yüzden **üsler çıkarılır**. Paydadaki üs daha büyükse sonuç negatif üslü çıkar: 6^3 ÷ 6^5 = 6^{−2}.`,`Barajdaki su: 4·10^6 metreküp, 4·10^6·10^3 = 4·10^9 litre eder.`],tablo:{ad:`Çarpanları say`,bas:[`İşlem`,`Açık hâli`,`Sonuç`],sat:[[`2^3·2^4`,`(2·2·2)·(2·2·2·2)`,`2^7`],[`(−6)^2·(−6)^3`,`(−6)·(−6)·(−6)·(−6)·(−6)`,`(−6)^5`],[`2^5 ÷ 2^3`,`{2·2·2·2·2//2·2·2}`,`2^2`],[`11^6 ÷ 11^2`,`6 çarpandan 2'si sadeleşir`,`11^4`]]},kural:[`x^a·x^b = x^{a+b}`,`{x^a//x^b} = x^{a−b}   (x ≠ 0)`],ornek:{s:`Yeryüzündeki kumsallarda yaklaşık 4·10^{21} kum tanesi olduğu düşünülüyor. Arşimet'in evreni doldurmak için hesapladığı kum tanesi sayısı bunun 2·10^{42} katıdır. Arşimet'in bulduğu sayı kaçtır?`,a:[`"Katı" çarpma demektir: (4·10^{21})·(2·10^{42})`,`Katsayılar kendi arasında, 10'un kuvvetleri kendi arasında çarpılır: (4·2)·(10^{21}·10^{42})`,`Tabanlar aynı, üsler toplanır: 10^{21+42} = 10^{63}`,`Sonuç: 8·10^{63}. Bu, 8'in sağına 63 sıfır yazılan 64 basamaklı sayıdır.`]},baska:`Üsleri çarpan sayacı gibi düşün. 10^{21} içinde 21 tane 10 var, 10^{42} içinde 42 tane. İkisini çarparsan elinde 21 + 42 = 63 tane 10 olur. Bölerken tersine, paydadaki her 10 paydan bir 10 götürür: 10^8 ÷ 10^6 işleminde 8 − 6 = 2 tane 10 kalır.`,soru:{s:`3^5·3^2 ÷ 3^4 işleminin sonucu hangisidir?`,o:[`3^3`,`3^{10}`,`3^{11}`],d:0,y:[null,`uscarp`,`bolme`],neden:`3^{5+2−4} = 3^3. Çarparken üsler toplanır, bölerken çıkarılır.`}},{id:`ayniUs`,baslik:`Çarpma ve bölme: üsler aynıysa`,giris:`A = 3·2^{11} ve B = 7·5^{11} sayılarının çarpımı kaç basamaklıdır? Çarpımı hesaplamaya kalkarsan çok uğraşırsın; oysa 2 ile 5'in çarpımının 10 etmesi işi birkaç satıra indirir.`,metin:[`Tabloda tabanlar farklı ama üsler aynı. 2^3·5^3 çarpımını açıp çarpanları ikişer ikişer eşleştir: her 2 bir 5 ile yan yana gelir ve üç tane (2·5) oluşur. Üs aynı kalır, **tabanlar çarpılır**.`,`Bölmede de aynı eşleştirme yapılır: 6^4 ÷ 5^4, dört tane {6//5} kesrinin çarpımıdır.`,`Bu kural en çok 2 ile 5 yan yana geldiğinde işe yarar; çünkü 2·5 = 10 eder ve 10'un kuvveti sayının sonundaki sıfırları verir.`],tablo:{ad:`Çarpanları eşleştir`,bas:[`İşlem`,`Açık hâli`,`Sonuç`],sat:[[`2^3·5^3`,`(2·5)·(2·5)·(2·5)`,`10^3`],[`3^4·4^4`,`(3·4)·(3·4)·(3·4)·(3·4)`,`12^4`],[`(−2)^5·(−7)^5`,`5 tane (−2)·(−7) çarpımı`,`14^5`],[`6^4 ÷ 5^4`,`{6//5}·{6//5}·{6//5}·{6//5}`,`({6//5})^4`]]},kural:[`x^a·y^a = (x·y)^a`,`{x^a//y^a} = ({x//y})^a   (y ≠ 0)`],ornek:{s:`A = 3·2^{11} ve B = 7·5^{11} olduğuna göre A·B kaç basamaklıdır?`,a:[`A·B = (3·7)·(2^{11}·5^{11})`,`Üsler aynı, tabanlar çarpılır: 2^{11}·5^{11} = (2·5)^{11} = 10^{11}`,`A·B = 21·10^{11}: 21 yazılır, sağına 11 tane sıfır konur`,`Basamak sayısı: 2 + 11 = 13`]},baska:`Bir halk oyununda 3 kız ile 3 erkek eşleşsin. Her kız bir erkekle çift olur ve 3 çift oluşur. 2^3·5^3 çarpımında da 3 tane 2 ile 3 tane 5 vardır; her 2 bir 5 ile çift olur ve 3 tane 10 oluşur. Sayılar eşit değilse, örneğin 3 tane 2 ile 5 tane 5 varsa, yalnızca 3 çift kurulur ve 2 tane 5 açıkta kalır.`,soru:{s:`4^5·25^5 çarpımı hangisine eşittir?`,o:[`100^5`,`100^{10}`,`29^5`],d:0,y:[null,`eslestir`,null],neden:`Üsler aynı: tabanlar çarpılır, üs olduğu gibi kalır. (4·25)^5 = 100^5.`}},{id:`ussu`,baslik:`Üssün üssü`,gorsel:{tip:`eslestir`,ad:`Aynı sayıyı bul`,cift:[[`4^5`,`2^{10}`],[`27^2`,`3^6`],[`9^4`,`3^8`],[`25^3`,`5^6`]]},giris:`Veri depolama birimleri arasında şu ilişki vardır: 1 GB = 2^{10} MB ve 1 GB = (2^{10})^3 bayt. 1 GB kaç bayttır? Cevabı 2'nin tek bir kuvveti olarak yazmak için üssün üssünü almayı bilmek gerekir.`,metin:[`Tabloya bak: (3^2)^3 demek, 3^2 sayısını 3 kez yan yana yazıp çarpmak demektir. Tabanlar aynı olduğu için üsler toplanır: 2 + 2 + 2. Aynı sayıyı 3 kez toplamak onu 3 ile çarpmaktır; bu yüzden **üsler çarpılır**.`,`1 GB = (2^{10})^3 = 2^{30} bayt, yani 1 073 741 824 bayt eder.`,`Bu kural tabanı değiştirmek için de kullanılır: 4 = 2^2 olduğundan 4^5 = (2^2)^5 = 2^{10}; 27 = 3^3 olduğundan 27^2 = 3^6. Farklı görünen tabanları aynı tabana çevirmek birçok sorunun anahtarıdır.`],tablo:{ad:`Paketleri say`,bas:[`İşlem`,`Açık hâli`,`Sonuç`],sat:[[`(3^2)^3`,`3^2·3^2·3^2 = 3^{2+2+2}`,`3^6`],[`(5^4)^2`,`5^4·5^4 = 5^{4+4}`,`5^8`],[`(2^{10})^3`,`2^{10}·2^{10}·2^{10} = 2^{10+10+10}`,`2^{30}`],[`(2^3)^{−2}`,`{1//(2^3)^2} = {1//2^6}`,`2^{−6}`]]},kural:[`(x^a)^b = x^{a·b}`],ornek:{s:`A = 3·(2^3)^6·5^{14} sayısı kaç basamaklıdır? Değerini hesaplamadan bul.`,a:[`Üssün üssü: (2^3)^6 = 2^{18}, yani A = 3·2^{18}·5^{14}`,`5'in üssü 14; 2'lerden 14 tanesini ayır: 2^{18} = 2^4·2^{14}`,`Üsleri aynı olanları eşleştir: 2^{14}·5^{14} = 10^{14}`,`A = 3·2^4·10^{14} = 48·10^{14}`,`48'in sağında 14 sıfır var: 2 + 14 = 16 basamak`]},baska:`Parantezin içini bir paket gibi düşün. (3^2)^3 yazımında paketten 3 tane var ve her pakette 2 tane 3 çarpanı duruyor. Toplam çarpan sayısı 3 paket × 2 çarpan = 6. Üssün üssünde üslerin çarpılmasının nedeni budur: paket sayısı ile paketteki çarpan sayısı çarpılır.`,soru:{s:`8^4 hangisine eşittir?`,o:[`2^7`,`2^{12}`,`2^{32}`],d:1,y:[`ustopla`,null,null],neden:`8 = 2^3 olduğundan 8^4 = (2^3)^4 = 2^{12}. Üssün üssünde üsler çarpılır.`}},{id:`bilimsel`,baslik:`Bilimsel gösterim`,gorsel:{tip:`virgul`,sayilar:[`1090000`,`1230000`,`1054000`,`0,00025`]},ilgi:{sanat:`Genişliği 4000, yüksekliği 3000 piksel olan bir fotoğrafta 12 000 000 piksel vardır: 1,2·10^7. Buna 12 megapiksel denir.`,bilim:`Işık boşlukta saniyede yaklaşık 300 000 000 metre yol alır: 3·10^8 m.`,insan:`Dünya nüfusu yaklaşık 8 000 000 000 kişidir: 8·10^9.`,girisim:`Yıllık cirosu 45 000 000 TL olan bir şirketin cirosu bilimsel gösterimle 4,5·10^7 TL yazılır.`},giris:`Adana, Kahramanmaraş ve Tokat'ın Çanakkale'ye kara yolu uzaklıkları sırasıyla yaklaşık 1,09·10^6 m, 123·10^4 m ve 10,54·10^5 m olarak verilmiş. Hangisi en uzak? Üsler de katsayılar da farklı yazıldığı için ilk bakışta söylemek zor.`,metin:[`Karışıklığı önlemek için ortak bir biçim kullanılır: sayı, **1 ile 10 arasında bir katsayı** ile 10'un bir kuvvetinin çarpımı olarak yazılır. Buna bilimsel gösterim denir. Katsayı 1 olabilir ama 10 olamaz.`,`Bir sayıyı bu biçime getirirken virgülü kaydırırsın. Virgül bir basamak sola kayarsa katsayı 10 kat küçülür; sayının değeri değişmesin diye üs 1 artar. Virgül sağa kayarsa üs azalır.`,`Üç uzaklığı da 10^6 ile yazınca karşılaştırma katsayılara kalır: 1,054 < 1,09 < 1,23. En yakın Tokat, en uzak Kahramanmaraş'tır. Üsler farklı olsaydı önce üsse bakılırdı: pozitif sayılarda üssü büyük olan büyüktür.`],tablo:{ad:`Virgül kayarken üs değişir`,bas:[`Sayı`,`Virgül`,`Bilimsel gösterim`],sat:[[`123·10^4`,`2 basamak sola, üs 2 artar`,`1,23·10^6`],[`10,54·10^5`,`1 basamak sola, üs 1 artar`,`1,054·10^6`],[`0,2·10^9`,`1 basamak sağa, üs 1 azalır`,`2·10^8`],[`0,00000000000000175`,`15 basamak sağa`,`1,75·10^{−15}`]]},kural:[`a·10^n   (1 ≤ a < 10, n tam sayı)`,`Karşılaştırırken önce üsler eşitlenir, sonra katsayılara bakılır.`],ornek:{s:`İnsan vücudundaki atom sayısı, kütle (kg) ile 10^{26} çarpılarak yaklaşık olarak bulunur. 6,02·10^{23} tane atom 1 mol sayılır. Kütlesi 66,22 kg olan bir kişinin vücudunda yaklaşık kaç mol atom vardır?`,a:[`Atom sayısı: 66,22·10^{26} = 6,622·10^{27}`,`Mol sayısı bir bölmedir: {6,622·10^{27}//6,02·10^{23}}`,`Katsayılar bölünür: 6,622 ÷ 6,02 = 1,1. Üsler çıkarılır: 10^{27−23} = 10^4`,`Sonuç: 1,1·10^4 mol`]},baska:`Bilimsel gösterimi bir adres gibi düşün. 10'un kuvveti sayının hangi mahallede olduğunu söyler: binler mi, milyonlar mı, milyarlar mı? Katsayı ise o mahalledeki kapı numarasıdır. İki sayıyı karşılaştırırken önce mahalleye bakarsın; mahalle aynıysa kapı numarasına.`,soru:{s:`Aşağıdakilerden hangisi bilimsel gösterimdir?`,o:[`12,5·10^6`,`0,8·10^{−3}`,`3,7·10^{−5}`],d:2,y:[`bilim`,`bilim`,null],neden:`Katsayı 1 ile 10 arasında olmalı: 3,7 uygun. 12,5 fazla büyük, 0,8 fazla küçük.`}},{id:`onerme`,baslik:`Bir kural her zaman doğru mu?`,giris:`Selin şöyle düşünüyor: "Çarpmada üsler toplanıyorsa toplamada da toplanır: 2^3 + 2^2 = 2^5." Kontrol edelim: 2^3 + 2^2 = 8 + 4 = 12, oysa 2^5 = 32. Tek bir örnek, Selin'in tahminini çürütmeye yetti.`,metin:[`Matematikte bir tahmine **varsayım** denir. Birkaç örnekte denenip örüntü görülünce **genelleme** yapılır; genelleme açıkça yazılınca **önerme** olur. Bu derste her kuralı böyle bulduk: önce tablo, sonra kural.`,`Bir önermenin yanlış olduğunu göstermek için ona uymayan **tek bir örnek** yeter; buna karşıt örnek denir. Doğru olduğunu göstermek için ise örnek yetmez: önermenin her sayı için geçerli olduğu gösterilmelidir. Bunun yolu, işlemi harflerle açık yazıp çarpanları saymaktır.`,`x^a·x^b = x^{a+b} önermesinin doğrulaması: x^a içinde a tane, x^b içinde b tane x çarpanı vardır. Çarpımda toplam a + b tane x olur. Sayılar ne olursa olsun bu sayım değişmez; önerme doğrudur.`],tablo:{ad:`Önce bir örnekle dene`,bas:[`Önerme`,`Deneme`,`Sonuç`],sat:[[`x^a + x^b = x^{a+b}`,`2^3 + 2^2 = 12  ama  2^5 = 32`,`Yanlış`],[`(x + y)^a = x^a + y^a`,`(1 + 2)^2 = 9  ama  1^2 + 2^2 = 5`,`Yanlış`],[`(x·y)^a = x^a·y^a`,`(2·3)^2 = 36  ve  2^2·3^2 = 36`,`Tutuyor, doğrulanmalı`],[`(x^a)^b = x^{a·b}`,`(2^3)^2 = 64  ve  2^6 = 64`,`Tutuyor, doğrulanmalı`]]},kural:[`Yanlışlamak için tek bir karşıt örnek yeter.`,`Doğrulamak için her sayıda geçerli bir gerekçe gerekir.`],ornek:{s:`"Bir sayının negatif kuvveti her zaman negatiftir." önermesi doğru mudur?`,a:[`Bir örnek dene: 2^{−1} = {1//2}`,`{1//2} pozitif bir sayıdır; önermeye uymuyor`,`Tek bir karşıt örnek yeterlidir: önerme yanlıştır`,`Doğrusu: negatif üs sayının çarpmaya göre tersini aldırır, işaretini değiştirmez`]},baska:`"Bütün kuşlar uçar" cümlesini çürütmek için tek bir penguen göstermek yeter. Ama "bütün kuşların kanadı vardır" cümlesini kanıtlamak için birkaç kuş göstermek yetmez; kuş olmanın tanımına bakman gerekir. Matematikte de böyledir: karşıt örnek çürütür, tanıma dayanan gerekçe doğrular.`,soru:{s:`"(x + y)^2 = x^2 + y^2" önermesini çürüten karşıt örnek hangisidir?`,o:[`x = 0 ve y = 5`,`x = 1 ve y = 2`,`x = 3 ve y = 0`],d:1,neden:`x = 1 ve y = 2 için sol taraf 3^2 = 9, sağ taraf 1 + 4 = 5 eder; eşit değil. Öteki iki örnekte iki taraf eşit çıkar, yani onlar önermeyi çürütmez.`}}],ozet:[`a^n, n tane a'nın çarpımıdır. Parantez yoksa eksi tabana ait değildir: (−2)^4 = 16 ama −2^4 = −16.`,`a^0 = 1 ve a^{−n} = {1//a^n}. Negatif üs sayıyı negatif yapmaz, tersini aldırır.`,`Toplama ve çıkarma yalnızca taban ve üs aynıyken yapılır; katsayılar toplanır: a·x^n + b·x^n = (a + b)·x^n.`,`Tabanlar aynıysa çarpmada üsler toplanır, bölmede çıkarılır.`,`Üsler aynıysa tabanlar çarpılır ya da bölünür. Özellikle 2^n·5^n = 10^n.`,`Üssün üssünde üsler çarpılır: (x^a)^b = x^{a·b}.`,`Bilimsel gösterim a·10^n biçimindedir ve 1 ≤ a < 10 olmalıdır. Karşılaştırmadan önce üsleri eşitle.`,`Bir önermeyi tek karşıt örnek çürütür; doğrulamak için çarpanları sayan genel bir gerekçe gerekir.`],sorular:[{id:`s1`,z:1,kart:`tanim`,tur:`islem`,s:`−3^2 + (−3)^2 + (−2)^3 işleminin sonucu kaçtır?`,o:[`10`,`−26`,`−8`,`8`,`−18`],d:2,y:[`parantez`,`parantez`,null,`parantez`,`carp`],c:[`−3^2: parantez yok, üs yalnızca 3'e aittir: −(3^2) = −9`,`(−3)^2 = (−3)·(−3) = 9`,`(−2)^3 = (−2)·(−2)·(−2) = −8`,`−9 + 9 + (−8) = −8`],h:`-(3**2) + (-3)**2 + (-2)**3 === -8`,kay:`${n_}, 1. Uygulama tablosundaki gösterim türleri`},{id:`s2`,z:1,kart:`ters`,tur:`islem`,s:`2^{−2} + (−{1//3})^{−1} + 4^0 − (−2)^3 işleminin sonucu kaçtır?`,o:[`{25//4}`,`{21//4}`,`{49//4}`,`−{39//4}`,`2`],d:0,y:[null,`sifir`,`negatif`,`parantez`,`negatif`],c:[`2^{−2} = {1//2^2} = {1//4}`,`(−{1//3})^{−1}: kesir ters çevrilir, işaret aynı kalır: −3`,`4^0 = 1`,`(−2)^3 = −8; önündeki eksiyle birlikte −(−8) = +8`,`{1//4} − 3 + 1 + 8 = {25//4}`],h:`Math.abs(2**-2 + (-1/3)**-1 + 4**0 - (-2)**3 - 25/4) < 1e-9`,kay:`${n_}, 1. Sıra Sizde`},{id:`s3`,z:1,kart:`topla`,tur:`baglam`,b:[`Bir laboratuvarda incelenen 1 litre kanda 5·10^9 alyuvar, 6·10^6 akyuvar ve 0,2·10^9 trombosit sayılmıştır.`],s:`Buna göre bu kanda alyuvar sayısı trombosit sayısından kaç fazladır?`,o:[`4,994·10^9`,`4,8`,`4,8·10^{18}`,`5,2·10^9`,`4,8·10^9`],d:4,y:[null,`toplam`,`toplam`,null,null],c:[`"Kaç fazla" bir farktır: 5·10^9 − 0,2·10^9`,`Taban ve üs aynı; ortak çarpan parantezi: (5 − 0,2)·10^9`,`Sonuç: 4,8·10^9. Üs değişmedi, yalnızca katsayılar çıkarıldı.`],h:`5e9 - 0.2e9 === 4.8e9`,kay:`${n_}, toplama ve çıkarma bölümünün giriş durumu (kan hücreleri)`},{id:`s4`,z:2,kart:`carp`,tur:`baglam`,b:[`Ankara'daki barajlarda 2001 yılının ocak ayında yaklaşık 4·10^6 metreküp, 2024 yılının ocak ayında yaklaşık 1,6·10^8 metreküp su ölçülmüştür.`],s:`Buna göre 2024'teki su miktarı 2001'dekinin kaç katıdır?`,o:[`4`,`40`,`400`,`4·10^{13}`,`2,5·10^{−2}`],d:1,y:[`bilim`,null,`bilim`,`bolme`,null],c:[`"Kaç katı" bir bölmedir: {1,6·10^8//4·10^6}`,`Katsayılar bölünür: 1,6 ÷ 4 = 0,4`,`Tabanlar aynı, üsler çıkarılır: 10^{8−6} = 10^2`,`0,4·10^2 = 40. Su miktarı 40 katına çıkmıştır.`],h:`1.6e8 / 4e6 === 40`,kay:`${n_}, çarpma ve bölme bölümünün giriş durumu (Ankara barajları)`},{id:`s5`,z:2,kart:`ayniUs`,tur:`islem`,s:`A = 12·2^7·5^9 sayısı kaç basamaklıdır?`,o:[`9`,`10`,`11`,`17`,`18`],d:1,y:[`basamak`,null,`eslestir`,`eslestir`,`eslestir`],c:[`5'lerden 7 tanesini ayır: 5^9 = 5^7·5^2`,`Üsleri aynı olanları eşleştir: 2^7·5^7 = (2·5)^7 = 10^7`,`A = 12·5^2·10^7 = 12·25·10^7 = 300·10^7`,`300'ün sağında 7 sıfır var: 3 + 7 = 10 basamak`],h:`String(12 * 2**7 * 5**9).length === 10`,kay:`${n_}, 4. Uygulama 5. madde ve 3. Örnek (basamak sayısı) tipinde`},{id:`s6`,z:3,kart:`ussu`,tur:`islem`,s:`3^x = 2 olduğuna göre 9^{2x+1} ifadesinin değeri kaçtır?`,o:[`108`,`25`,`144`,`48`,`36`],d:2,y:[`ustopla`,`toplam`,null,null,null],c:[`Tabanı 3'e çevir: 9 = 3^2, yani 9^{2x+1} = (3^2)^{2x+1}`,`Üssün üssünde üsler çarpılır: 3^{4x+2}`,`Üsteki toplamı çarpıma ayır: 3^{4x+2} = 3^{4x}·3^2 = (3^x)^4·9`,`3^x = 2 yerine yaz: 2^4·9 = 16·9 = 144`],h:`Math.abs(9**(2*Math.log(2)/Math.log(3)+1) - 144) < 1e-6`,kay:`${n_}, 2. Sıra Sizde 2. sorudan uyarlandı`},{id:`s7`,z:2,kart:`bilimsel`,tur:`baglam`,b:[`Bir radyo istasyonu, bulunduğu noktadan en çok 2,45·10^4 metre uzağa yayın ulaştırabilmektedir. Üç dinleyicinin istasyona uzaklıkları tabloda verilmiştir.`],t:{bas:[`Dinleyici`,`İstasyona uzaklık (m)`],sat:[[`Defne`,`9,8·10^3`],[`Emre`,`2,6·10^4`],[`Kerem`,`0,23·10^5`]]},s:`Buna göre yayın bu dinleyicilerden hangilerine ulaşır?`,o:[`Yalnız Defne`,`Yalnız Kerem`,`Defne ve Emre`,`Defne ve Kerem`,`Defne, Emre ve Kerem`],d:3,y:[`kiyas`,`kiyas`,`kiyas`,null,null],c:[`Hepsini sınırla aynı üsle yaz: sınır 2,45·10^4 m`,`Defne: 9,8·10^3 = 0,98·10^4. 0,98 < 2,45 olduğundan yayın ulaşır`,`Emre: 2,6·10^4. 2,6 > 2,45 olduğundan yayın ulaşmaz`,`Kerem: 0,23·10^5 = 2,3·10^4. 2,3 < 2,45 olduğundan yayın ulaşır`,`Yayın Defne ve Kerem'e ulaşır`],h:`9.8e3 <= 2.45e4 && 2.6e4 > 2.45e4 && 0.23e5 <= 2.45e4`,kay:`${n_}, 1. Tema Ölçme ve Değerlendirme 10. sorudan uyarlandı (sayılar ve adlar değiştirildi)`},{id:`s8`,z:3,kart:`topla`,tur:`baglam`,b:[`Ece, evdeki elektrik tüketimini incelediği bir proje hazırlıyor. Üç cihazın gücünü ve bir günde çalıştığı süreyi tabloya yazıyor. Bir cihazın tükettiği enerji (watt saat), gücü ile çalışma süresinin çarpımıdır.`],t:{bas:[`Cihaz`,`Güç (watt)`,`Günlük süre (saat)`],sat:[[`LED ampul`,`2^4`,`8`],[`Televizyon`,`2^6`,`4`],[`Buzdolabı`,`2^7`,`24`]]},s:`Buna göre bu üç cihazın bir günde tükettiği toplam enerji kaç watt saattir?`,o:[`27·2^7`,`3·2^{25}`,`6·2^7`,`5·2^{10}`,`2^{13} + 3·2^{21}`],d:0,y:[null,`toplam`,`ortak`,`esitle`,`uscarp`],c:[`Enerji = güç × süre. Süreleri de 2'nin kuvvetiyle yaz: 8 = 2^3, 4 = 2^2 ve 24 = 3·2^3`,`LED ampul: 2^4·2^3 = 2^7.   Televizyon: 2^6·2^2 = 2^8.   Buzdolabı: 2^7·3·2^3 = 3·2^{10}`,`Toplam: 2^7 + 2^8 + 3·2^{10}. Üsler farklı; hepsini 2^7 cinsinden yaz: 2^8 = 2·2^7 ve 3·2^{10} = 24·2^7`,`Ortak çarpan parantezi: (1 + 2 + 24)·2^7 = 27·2^7`,`Kontrol: 128 + 256 + 3072 = 3456 ve 27·128 = 3456`],h:`2**4*8 + 2**6*4 + 2**7*24 === 27 * 2**7`,kay:`MEB Bağlam Temelli Çoktan Seçmeli Soru Yazım Kılavuzu (2026), ortaöğretim matematik örnek sorusunun biçiminde: cihaz tablosu, günlük kullanım, üslü gösterimle toplam`},{id:`s9`,z:2,kart:`carp`,tur:`muhakeme`,b:[`Bora, (2^3)^2·2^4 ÷ 2^{−2} ÷ 2^5 işlemini soldan sağa aşağıdaki adımlarla yapmıştır.`],t:{bas:[`Adım`,`Yapılan işlem`],sat:[[`1`,`(2^3)^2 = 2^6`],[`2`,`2^6·2^4 = 2^{10}`],[`3`,`2^{10} ÷ 2^{−2} = 2^8`],[`4`,`2^8 ÷ 2^5 = 2^3`],[`5`,`2^3 = 8`]]},s:`Buna göre Bora ilk hatayı hangi adımda yapmıştır?`,o:[`1. adım`,`2. adım`,`3. adım`,`4. adım`,`5. adım`],d:2,y:[`ustopla`,`uscarp`,null,`bolme`,`carp`],c:[`1. adım doğru: üssün üssünde üsler çarpılır, 3·2 = 6`,`2. adım doğru: tabanlar aynı, üsler toplanır, 6 + 4 = 10`,`3. adım hatalı: bölmede üsler çıkarılır ve 10 − (−2) = 12 olmalıydı. Bora eksi 2'yi çıkarmak yerine 2 çıkarmış`,`Doğru sonuç: 2^{12} ÷ 2^5 = 2^7 = 128`],h:`(2**3)**2 * 2**4 / 2**-2 / 2**5 === 128`,kay:`${n_}, 1. Tema Ölçme ve Değerlendirme 11. soru tipinde: "ilk hata hangi adımda"`},{id:`s10`,z:3,kart:`onerme`,tur:`muhakeme`,s:`x ve y sıfırdan farklı gerçek sayılar, a pozitif tam sayıdır. Aşağıdaki önermelerden hangisi her zaman doğrudur?`,o:[`x^a + x^a = x^{2a}`,`(x + y)^a = x^a + y^a`,`(x^a)^a = x^{2a}`,`(x·y)^a = x^a·y^a`,`x^a·y^a = (x·y)^{2a}`],d:3,y:[`toplam`,`dagit`,`ustopla`,null,`eslestir`],c:[`Her seçeneği küçük sayılarla dene: x = 3, y = 2 ve a = 3`,`x^a + x^a = 27 + 27 = 54 ama x^{2a} = 3^6 = 729. Tutmadı`,`(x + y)^a = 5^3 = 125 ama x^a + y^a = 27 + 8 = 35. Tutmadı`,`(x^a)^a = 27^3 = 3^9 ama x^{2a} = 3^6. Tutmadı. x^a·y^a = 216 ama (x·y)^{2a} = 6^6. Tutmadı`,`(x·y)^a = x^a·y^a her sayı için geçerlidir: a tane (x·y) çarpımında a tane x ve a tane y vardır`],h:`(3*2)**3 === 3**3 * 2**3 && 3**3 + 3**3 !== 3**6 && (3+2)**3 !== 3**3 + 2**3 && (3**3)**3 !== 3**6 && 3**3 * 2**3 !== (3*2)**6`,kay:`Öğretim programı MAT.9.1.1 süreç bileşenleri: önerme sunma ve doğrulama`}],acik:[{id:`a1`,baslik:`Işık yılı`,b:[`Işığın hızı yaklaşık 3·10^5 km/sn, Güneş'in Dünya'ya uzaklığı yaklaşık 1,5·10^8 km'dir. Bir yılda yaklaşık 3,15·10^7 saniye vardır.`],alt:[`Güneş'ten çıkan ışık Dünya'ya kaç saniyede ulaşır? Sonucu bilimsel gösterimle yazınız.`,`Işığın bir yılda aldığı yol, yani 1 ışık yılı kaç kilometredir? Sonucu bilimsel gösterimle yazınız.`],adim:[{p:2,m:`Süre = yol ÷ hız ilişkisini kurma: {1,5·10^8//3·10^5}`},{p:2,m:`Katsayıları bölme ve üsleri çıkarma: 0,5·10^3`},{p:1,m:`Bilimsel gösterime çevirme: 5·10^2 saniye`},{p:2,m:`Yol = hız × süre ilişkisini kurma: (3·10^5)·(3,15·10^7)`},{p:2,m:`Katsayıları çarpma ve üsleri toplama: 9,45·10^{12}`},{p:1,m:`Sonucu birimiyle yazma: 9,45·10^{12} km`}],kay:`${n_}, bilimsel gösterim araştırma ödevindeki "1 ışık yılı" hesabı`},{id:`a2`,baslik:`Önermeyi doğrula`,b:[`Elif, tabloyu inceleyip şu genellemeye ulaşıyor: "Tabanları aynı olan üslü gösterimler çarpılırken üsler toplanır."`],t:{bas:[`İşlem`,`Açık hâli`,`Sonuç`],sat:[[`2^3·2^4`,`(2·2·2)·(2·2·2·2)`,`2^7`],[`5^2·5^3`,`…`,`…`],[`7^4·7`,`…`,`…`]]},alt:[`Tablodaki boşlukları doldurunuz.`,`x sıfırdan farklı bir gerçek sayı, a ve b pozitif tam sayı olmak üzere x^a·x^b = x^{a+b} önermesini doğrulayınız.`,`"x^a + x^b = x^{a+b}" önermesinin yanlış olduğunu bir karşıt örnekle gösteriniz.`],adim:[{p:1,m:`5^2·5^3 = (5·5)·(5·5·5) = 5^5`},{p:1,m:`7^4·7 = (7·7·7·7)·7 = 7^5`},{p:2,m:`x^a ve x^b çarpımlarını açık yazma: x^a içinde a tane, x^b içinde b tane x çarpanı`},{p:2,m:`Çarpımda toplam a + b tane x çarpanı olduğunu belirtme`},{p:1,m:`Sonucu yazma: x^a·x^b = x^{a+b}`},{p:2,m:`Uygun bir karşıt örnek verme: örneğin x = 2, a = 3 ve b = 2 için 2^3 + 2^2 = 12`},{p:1,m:`İki tarafın eşit olmadığını gösterme: 2^5 = 32 ve 32 ≠ 12`}],kay:`${n_}, 3. Uygulama: varsayım, tablo, önerme ve doğrulama adımları`},{id:`a3`,baslik:`Kaç basamaklı?`,alt:[`A = 5·(2^4)^3·5^{10} sayısının kaç basamaklı olduğunu, sayının değerini hesaplamadan bulunuz.`,`Kullandığınız yöntemi bir iki cümleyle açıklayınız.`],adim:[{p:2,m:`Üssün üssü: (2^4)^3 = 2^{12}`},{p:2,m:`2'lerden 10 tanesini ayırma: 2^{12} = 2^2·2^{10}`},{p:2,m:`Üsleri aynı olanları birleştirme: 2^{10}·5^{10} = 10^{10}`},{p:2,m:`A = 5·2^2·10^{10} = 20·10^{10} ve basamak sayısı: 2 + 10 = 12`},{p:2,m:`Açıklama: sayı 10'un kuvveti cinsinden yazıldı; 10^{10} sondaki sıfırları, 20 baştaki basamakları verir`}],kay:`${n_}, 3. Örnek`}]},i_=`MEB 9. Sınıf Matematik Ders Kitabı (1. Kitap)`,a_={id:`mat-koklu`,ad:`Köklü Gösterim`,dk:17,tdk:13,giris:`Alanı bilinen bir karenin kenarı ya da bir cismin düşme süresi çoğu zaman tam sayı çıkmaz. Bu sayıları yazmanın yolu köklü gösterimdir. Üslü gösterimde öğrendiğin her kural burada yeniden işine yarayacak.`,day:{kod:`MAT.9.1.1`,kapsam:`Bu ders öğrenme çıktısının köklü gösterim bölümünü işler: rasyonel üs ile kök arasındaki ilişki, köklü gösterimlerle toplama, çıkarma, çarpma, bölme, kökün kökü, kök derecelerini eşitleme, eşlenik ve yaklaşık değer.`,surec:[`Gerçek sayıların üslü ve köklü gösterimleriyle yapılan işlemlere ilişkin varsayımlarda bulunur.`,`Farklı örneklerden elde ettiği örüntüleri listeleyerek varsayımlarına yönelik genellemeler yapar.`,`Varsayımları ile genellemelerini karşılaştırır.`,`Elde ettiği genellemelerden üslü ve köklü gösterimlerle ilgili önermeler sunar.`,`Üslü ve köklü gösterimlerle ilgili önermelerin kullanışlılığını problem durumlarında değerlendirir.`,`Üslü ve köklü gösterimlerle ilgili matematiksel doğrulama yöntemlerini kullanır.`,`Kullandığı matematiksel doğrulama yöntemlerini kullanışlılık açısından değerlendirir.`],kitap:`${i_}, 1. Tema: Sayılar, sayfa 24-36`,sira:[`Gerçek Sayıların Köklü Gösterimi`,`Üslü ve Köklü Gösterimlerin Birbiri Cinsinden İfade Edilmesi`,`Köklü Gösterimlerle Toplama, Çıkarma, Çarpma, Bölme ve Kökün Kökü`,`Kök Dereceleri Farklı Olan Köklü Gösterimlerle Çarpma ve Bölme`,`Köklü Gösterimlerin Eşleniğini Bulma`,`Yaklaşık Değer`]},yan:{kokNeg:{ad:`Kökte işaret kuralını karıştırmak`,anlat:`Karekök hiçbir zaman negatif çıkmaz: √(a^2), a sayısının mutlak değeridir. Derecesi tek olan kökte ise içerideki işaret korunur.`,ornek:`√((−3)^2) = √9 = 3 olur; −3 değil. √[3](−8) = −2 olur; 2 değil.`},yari:{ad:`Kökü ya da kesirli üssü bölme sanmak`,anlat:`Karekök almak ikiye bölmek değildir; "hangi sayının karesi bu?" sorusunun cevabıdır. Kesirli üs de tabanı o kesirle çarpmak değildir.`,ornek:`√64 = 8 olur; 32 değil. 27^{{2//3}} = 9 olur; 18 değil.`},rasyonel:{ad:`Rasyonel üste pay ile paydanın görevini karıştırmak`,anlat:`x^{{m//n}} yazımında payda kökün derecesidir, pay içerideki üstür. İkisi de uygulanmalıdır: önce kök alınır, sonra kuvvet.`,ornek:`16^{{3//4}}: önce √[4]16 = 2, sonra 2^3 = 8.`},disari:{ad:`Kök dışına çıkarırken karekök almayı unutmak`,anlat:`Kök içindeki tam kare çarpan dışarı kendisi olarak değil, karekökü olarak çıkar. Tersine, dışarıdaki sayı içeri karesi alınarak girer.`,ornek:`√48 = √(16·3) = 4√3 olur; 16√3 değil.`},kokTopla:{ad:`Kök içlerini toplamak ya da çıkarmak`,anlat:`Toplama ve çıkarmada kök içlerine dokunulmaz. Yalnızca kök içi ve derecesi aynı olan terimlerin katsayıları toplanır; bu yüzden önce kök dışına çıkarılır.`,ornek:`√9 + √16 = 3 + 4 = 7 olur; √25 = 5 değil.`},kare:{ad:`Köklü ifadenin karesini eksik almak`,anlat:`a√b sayısının karesi alınırken hem katsayının hem kökün karesi alınır: (a√b)^2 = a^2·b.`,ornek:`(5√3)^2 = 25·3 = 75 olur; 15 ya da 25√3 değil.`},derece:{ad:`Dereceleri eşitlemeden çarpmak`,anlat:`Dereceleri farklı kökler tek kök altına doğrudan giremez. Önce dereceler ortak bir kata getirilir; bunu yaparken içerideki üs de aynı sayıyla çarpılır.`,ornek:`√2·√[3]2 = √[6](2^3)·√[6](2^2) = √[6]32 olur; √[6]4 ya da √[5]4 değil.`},siralama:{ad:`Yalnızca kök içine ya da dereceye bakarak sıralamak`,anlat:`Dereceleri farklı kökler, kök içindeki sayılara bakılarak sıralanamaz. Önce dereceler eşitlenir, sonra kök içleri karşılaştırılır.`,ornek:`√2 = √[6]8 ve √[6]6 karşılaştırılırsa √2 daha büyüktür; kök içi küçük olduğu hâlde.`},kokKok:{ad:`Kökün kökünde dereceleri toplamak`,anlat:`Kökün kökü, üssün üssüdür; dereceler çarpılır.`,ornek:`√(√[3]x) = √[6]x olur; √[5]x değil.`},eslenik:{ad:`Eşleniği yanlış kurmak`,anlat:`Eşlenik, ortadaki işaretin değiştirilmiş hâlidir ve çarpım iki karenin farkını verir: (√a − √b)·(√a + √b) = a − b. Toplam değil, fark çıkar.`,ornek:`(√7 − √3)·(√7 + √3) = 7 − 3 = 4 olur; 10 değil.`},paydaKok:{ad:`Kesri genişletirken payı ya da paydayı unutmak`,anlat:`Bir kesrin değeri ancak pay ve payda aynı sayıyla çarpılırsa değişmez. Yalnızca birini çarparsan başka bir sayı elde edersin.`,ornek:`{6//√3} = {6·√3//√3·√3} = {6√3//3} = 2√3.`},yuvarla:{ad:`Parça sayısını yuvarlamamak ya da aşağı yuvarlamak`,anlat:`Top, panel ya da paket hâlinde satılan bir şeyden kesirli sayıda alınamaz. İhtiyaç 11,2 top çıkıyorsa 11 top yetmez; bir üst tam sayıya çıkılır.`,ornek:`112 m için 10 metrelik toplardan 12 tane gerekir; 11 tane 110 m eder.`}},kartlar:[{id:`kok`,baslik:`Karekök ve n. dereceden kök`,gorsel:{tip:`kare`,alan:21},giris:`Yüzey alanı 21 m² olan kare şeklindeki bir halının bir kenarı kaç metredir? Kendisiyle çarpılınca 21 eden sayı bir tam sayı değildir: 4·4 = 16 az gelir, 5·5 = 25 fazla.`,metin:[`Bu sayıya **karekök 21** denir ve √21 diye yazılır. Karekök almak, kare almanın tersidir: √25 = 5, çünkü 5^2 = 25. √21 ise 4 ile 5 arasındadır.`,`Aynı fikir daha büyük kuvvetler için de geçerlidir. Hacmi 8 birimküp olan küpün kenarı, küpü 8 eden sayıdır: √[3]8 = 2, çünkü 2^3 = 8. Kök işaretinin üstündeki küçük sayıya **kökün derecesi** denir; karekökte derece 2'dir ve yazılmaz.`,`İşarete dikkat et: karekök hiçbir zaman negatif çıkmaz. (−5)^2 = 25 olsa da √25 = 5'tir. Derecesi çift olan kökün içi negatif olamaz; derecesi tek olan kökün içi negatif olabilir.`],tablo:{ad:`Kök, kuvvetin tersidir`,bas:[`Köklü gösterim`,`Neden?`,`Sonuç`],sat:[[`√49`,`7^2 = 49`,`7`],[`√[3]8`,`2^3 = 8`,`2`],[`√[4]16`,`2^4 = 16`,`2`],[`√[3](−27)`,`(−3)^3 = −27`,`−3`],[`√((−5)^2)`,`√25`,`5`]]},kural:[`√[n](a^n) = a   (n tek ise)`,`√[n](a^n) = |a|   (n çift ise)`,`Derecesi çift olan kökün içi negatif olamaz.`],ornek:{s:`√25 + √[4]16 − √0 + 2·√[3](−27) işleminin sonucu kaçtır?`,a:[`√25 = 5, çünkü 5^2 = 25`,`√[4]16 = 2, çünkü 2^4 = 16`,`√0 = 0`,`√[3](−27) = −3, çünkü (−3)^3 = −27`,`5 + 2 − 0 + 2·(−3) = 1`]},baska:`Karekökü bir soru gibi oku: "Hangi sayıyı kendisiyle çarparsam bunu bulurum?" √49 için cevap 7. Küp kök için soru şudur: "Hangi sayıyı üç kez çarparsam bunu bulurum?" √[3]8 için cevap 2. Kök, sayıyı ikiye ya da üçe bölmek değildir; çarpımı o sayıyı veren çarpanı aramaktır.`,soru:{s:`√64 kaçtır?`,o:[`32`,`8`,`−8`],d:1,y:[`yari`,null,`kokNeg`],neden:`8·8 = 64 olduğundan √64 = 8. Karekök yarıya bölmek değildir ve negatif çıkmaz.`}},{id:`rasyonel`,baslik:`Kök ile üs arasındaki köprü`,gorsel:{tip:`eslestir`,ad:`Aynı sayıyı bul`,cift:[[`25^{{1//2}}`,`5`],[`8^{{1//3}}`,`2`],[`√[3]27`,`3`],[`√49`,`7`]]},giris:`9 sayısının yarım kuvveti olur mu? Üslü gösterimin kurallarına güvenirsek olur: 9^{{1//2}}·9^{{1//2}} = 9^1 = 9 etmelidir. Kendisiyle çarpılınca 9 veren sayı ise √9, yani 3'tür.`,metin:[`Demek ki yarım kuvvet karekök demektir: x^{{1//2}} = √x. Aynı düşünceyle x^{{1//3}} = √[3]x olur; çünkü üç tanesinin çarpımı x^1 eder.`,`Genel olarak kesirli üste **payda kökün derecesi**, **pay içerideki üs** olur. Tabloyu soldan sağa da sağdan sola da okuyabilirsin: her köklü gösterim üslü, her rasyonel üslü gösterim köklü yazılabilir.`,`Bu köprü çok işe yarar: kökle ilgili bütün kurallar, bildiğin üs kurallarından çıkar. Yeni bir şey ezberlemene gerek kalmaz.`],tablo:{ad:`Üslü gösterimden köklü gösterime`,bas:[`Üslü gösterim`,`Kökün derecesi`,`İçerideki üs`,`Köklü gösterim`],sat:[[`2^{{3//2}}`,`2`,`3`,`√(2^3) = √8`],[`3^{{1//2}}`,`2`,`1`,`√3`],[`5^{{2//3}}`,`3`,`2`,`√[3](5^2) = √[3]25`],[`7^{{3//5}}`,`5`,`3`,`√[5](7^3)`],[`16^{{1//4}}`,`4`,`1`,`√[4]16 = 2`]]},kural:[`x^{{m//n}} = √[n](x^m)   (x > 0;  n kökün derecesi)`,`x^{{1//2}} = √x`],ornek:{s:`(16^{{1//4}} + 625^{{1//2}})^{{1//3}} işleminin sonucu kaçtır?`,a:[`16^{{1//4}} = √[4]16 = 2, çünkü 2^4 = 16`,`625^{{1//2}} = √625 = 25, çünkü 25^2 = 625`,`Parantezin içi: 2 + 25 = 27`,`27^{{1//3}} = √[3]27 = 3, çünkü 3^3 = 27`]},baska:`Üssü bir yolculuk gibi düşün: x^1, x sayısına tek adımda varmaktır. Bu yolu iki eşit çarpma adımında yürümek istersen her adım x^{{1//2}} olur ve iki adımın çarpımı x eder. Kendisiyle çarpılınca x veren sayı √x olduğuna göre yarım adım, kareköktür. Üç eşit adım istersen her adım küp köktür.`,soru:{s:`8^{{2//3}} kaçtır?`,o:[`4`,`{16//3}`,`√(8^3)`],d:0,y:[null,`yari`,`rasyonel`],neden:`8^{{2//3}} = √[3](8^2) = √[3]64 = 4. Payda kökün derecesi, pay içerideki üs.`}},{id:`disari`,baslik:`Kök dışına çıkarmak`,gorsel:{tip:`kok-cikar`,sayilar:[72,48,108,1200]},giris:`Ahmet Bey'in kare şeklindeki arazisi 1200 m² büyüklüğündedir. Arazinin bir kenarı √1200 metredir. Bu sayıyı daha tanıdık bir biçimde yazabilir miyiz?`,metin:[`Çarpımın karekökü, kareköklerin çarpımıdır. Nedeni üs kuralıdır: (x·y)^{{1//2}} = x^{{1//2}}·y^{{1//2}}. Öyleyse kök içindeki sayıyı, biri tam kare olan iki çarpana ayırabilirsen tam kare olan dışarı çıkar.`,`1200 = 400·3 ve 400 = 20^2 olduğundan √1200 = √400·√3 = 20√3. Arazinin kenarı 20√3 metredir.`,`Tersi de yapılabilir: dışarıdaki sayı karesi alınarak içeri girer. 3√2 = √(3^2·2) = √18. Bu, köklü sayıları karşılaştırırken işe yarar.`],tablo:{ad:`Tam kare çarpanı bul`,bas:[`Sayı`,`Tam kare · kalan`,`Sonuç`],sat:[[`√12`,`√(4·3)`,`2√3`],[`√48`,`√(16·3)`,`4√3`],[`√75`,`√(25·3)`,`5√3`],[`√108`,`√(36·3)`,`6√3`],[`√1200`,`√(400·3)`,`20√3`]]},kural:[`√(a^2·b) = a√b   (a ≥ 0, b ≥ 0)`,`a√b = √(a^2·b)`],ornek:{s:`√72 sayısını a√b biçiminde yaz.`,a:[`72'yi tam kare bir çarpanla yaz: 72 = 36·2`,`√72 = √36·√2`,`√36 = 6 olduğundan √72 = 6√2`,`Kontrol: 6√2 = √(36·2) = √72`]},baska:`Kök işaretini bir kapı gibi düşün: kapıdan yalnızca çiftler çıkabilir. 12 = 2·2·3 çarpanlarında bir çift 2 var; çift kapıdan tek bir 2 olarak çıkar, eşi olmayan 3 içeride kalır: √12 = 2√3. 72 = 2·2·2·3·3 çarpanlarında bir çift 2 ile bir çift 3 var; dışarı 2·3 = 6 çıkar, eşsiz kalan 2 içeride kalır: 6√2.`,soru:{s:`√50 hangisine eşittir?`,o:[`25√2`,`5√2`,`2√5`],d:1,y:[`disari`,null,`disari`],neden:`50 = 25·2 ve √25 = 5 olduğundan √50 = 5√2. Dışarı 25 değil, 25'in karekökü çıkar.`}},{id:`topla`,baslik:`Toplama ve çıkarma`,gorsel:{tip:`grupla`,ad:`Hemen toplanır mı?`,kutu:[`Hemen toplanır`,`Önce kök dışına çıkar`],oge:[[`3√2 + 5√2`,0],[`√12 + √27`,1],[`7√5 − 2√5`,0],[`√8 + √2`,1],[`6√3 − √3`,0],[`√50 − √18`,1]]},giris:`Bir deneyde iki cisim farklı yüksekliklerden bırakılmış; yere düşme süreleri √48 saniye ve √108 saniye olarak hesaplanmıştır. İki süre arasındaki fark kaç saniyedir?`,metin:[`Köklü gösterimler de üslü gösterimler gibi toplanır: yalnızca **kökün derecesi ve kökün içi aynı** olanlar, ortak çarpan parantezine alınarak. 4√5 + 2√5 demek, √5 sayısından 4 + 2 = 6 tane almak demektir.`,`Kök içleri farklı görünüyorsa önce kök dışına çıkar; çoğu zaman aynı köke iner. √108 = 6√3 ve √48 = 4√3 olduğundan fark 6√3 − 4√3 = 2√3 saniyedir.`,`Kök içleri gerçekten farklıysa toplam daha fazla sadeleşmez: √2 + √3 öylece kalır. Kök içlerini toplamak yanlıştır: √9 + √16 = 3 + 4 = 7 eder, oysa √25 = 5'tir.`],tablo:{ad:`Üslü gösterimde ne yapıyorsan aynısı`,bas:[`Üslü gösterimle`,`Köklü gösterimle`,`Sonuç`],sat:[[`4·5^{{1//3}} + 2·5^{{1//3}}`,`4√[3]5 + 2√[3]5`,`6√[3]5`],[`4·6^{{1//5}} − 2·6^{{1//5}}`,`4√[5]6 − 2√[5]6`,`2√[5]6`],[`3^{{2//3}} + 8·3^{{2//3}} − 2·3^{{2//3}}`,`√[3]9 + 8√[3]9 − 2√[3]9`,`7√[3]9`]]},kural:[`a·√[n]x + b·√[n]x − c·√[n]x = (a + b − c)·√[n]x`],ornek:{s:`√75 − 2√12 + 5√27 işleminin sonucu kaçtır?`,a:[`Hepsini kök dışına çıkar: √75 = 5√3 ve √12 = 2√3 ve √27 = 3√3`,`Yerine yaz: 5√3 − 2·2√3 + 5·3√3`,`5√3 − 4√3 + 15√3`,`Ortak çarpan parantezi: (5 − 4 + 15)√3 = 16√3`]},baska:`√3 yerine "elma" de. 5 elma − 4 elma + 15 elma = 16 elma. Ama 2 elma ile 3 armut toplanınca 5 elma da olmaz, 5 armut da: √2 ile √3 de böyle ayrı kalır. Önce kök dışına çıkarmak, meyvelerin aslında aynı olup olmadığını anlamanın yoludur: √12 ile √27 farklı görünür ama ikisi de √3 cinsindendir.`,soru:{s:`√8 + √18 işleminin sonucu hangisidir?`,o:[`√26`,`5√2`,`6√2`],d:1,y:[`kokTopla`,null,null],neden:`√8 = 2√2 ve √18 = 3√2 olduğundan toplam 5√2. Kök içleri toplanmaz.`}},{id:`carp`,baslik:`Çarpma, bölme ve kökün kökü`,giris:`Bahar Hanım'ın evinde mutfak, kiler ve salon kare şeklindedir. Mutfağın alanı 20 m², kilerin alanı 5 m²'dir. Salonun bir kenarı, mutfak ile kilerin birer kenarının toplamı kadardır. Salonun alanı kaç metrekaredir?`,metin:[`Dereceleri aynı olan kökler tek kök altında çarpılır ve bölünür. Nedeni yine üs kuralıdır: x^{{1//n}}·y^{{1//n}} = (x·y)^{{1//n}}.`,`Bahar Hanım'ın evi: mutfağın kenarı √20 = 2√5 m, kilerin kenarı √5 m. Salonun kenarı 2√5 + √5 = 3√5 m, alanı 3√5·3√5 = 9·5 = 45 m². Bir sayının karekökü kendisiyle çarpılınca kök kalkar: √5·√5 = 5.`,`Kökün kökü alınırken dereceler çarpılır; çünkü bu, üssün üssüdür: (x^{{1//3}})^{{1//2}} = x^{{1//6}}.`],tablo:{ad:`Aynı dereceli kökler tek kök altında`,bas:[`İşlem`,`Tek kök altında`,`Sonuç`],sat:[[`√2·√3`,`√(2·3)`,`√6`],[`√[3]10 ÷ √[3]5`,`√[3]({10//5})`,`√[3]2`],[`√[5]24·√[5]4 ÷ √[5]3`,`√[5]({24·4//3})`,`√[5]32 = 2`],[`√(√[3]15)`,`dereceler çarpılır: 2·3`,`√[6]15`]]},kural:[`√[n]x·√[n]y = √[n](x·y)`,`{√[n]x//√[n]y} = √[n]({x//y})`,`√[m](√[n]x) = √[m·n]x`,`√x·√x = x`],ornek:{s:`Bahar Hanım mutfak, kiler ve salonun zeminini metrekaresi 975 TL olan parke ile kaplatacaktır. Ödeyeceği tutar kaç TL'dir?`,a:[`Mutfağın kenarı √20 = 2√5 m, kilerin kenarı √5 m`,`Salonun kenarı: 2√5 + √5 = 3√5 m`,`Salonun alanı: 3√5·3√5 = 9·5 = 45 m²`,`Toplam alan: 20 + 5 + 45 = 70 m²`,`Tutar: 70·975 = 68 250 TL`]},baska:`Aynı dereceli kökleri çarpmak, aynı boy kutuları birleştirmek gibidir: içindekiler tek kutuda toplanır, √2·√3 = √6. Kökün kökü ise kutunun içindeki kutudur: önce küp kökünü, sonra karekökünü alıyorsan sayıyı toplamda 3·2 = 6 eşit çarpana ayırıyorsun demektir; bu da 6. dereceden köktür.`,soru:{s:`√12·√3 kaçtır?`,o:[`6`,`√15`,`36`],d:0,y:[null,`kokTopla`,null],neden:`√12·√3 = √36 = 6. Çarpmada kök içleri çarpılır, toplanmaz; sonra kök alınır.`}},{id:`derece`,baslik:`Dereceleri farklı kökler`,giris:`√2 ile √[3]3 çarpılabilir mi? Dereceleri farklı olduğu için tek kök altına hemen giremezler. Kesirlerde paydaları eşitlediğin gibi burada da kök derecelerini eşitlemen gerekir.`,metin:[`Bir kökün derecesi ile içerideki üs aynı sayıyla çarpılırsa ya da bölünürse değeri değişmez; çünkü rasyonel üste pay ile payda aynı sayıyla genişletilmiş olur: 3^{{1//2}} = 3^{{3//6}}, yani √3 = √[6](3^3).`,`İki kökü çarpmak için derecelerini ortak bir kata getir. √2 ile √[3]3 için ortak derece 6'dır: √2 = √[6](2^3) = √[6]8 ve √[3]3 = √[6](3^2) = √[6]9. Çarpım √[6]72 olur.`,`Aynı yol sıralamada da kullanılır: dereceler eşitlenince kök içi büyük olan sayı büyüktür.`],tablo:{ad:`Genişletme ve sadeleştirme`,bas:[`Köklü gösterim`,`Üsse yapılan işlem`,`Elde edilen eşitlik`],sat:[[`√3`,`{1//2} kesri 3 ile genişler: {3//6}`,`√3 = √[6](3^3)`],[`√[3]2`,`{1//3} kesri 2 ile genişler: {2//6}`,`√[3]2 = √[6](2^2)`],[`√[4](5^6)`,`{6//4} kesri 2 ile sadeleşir: {3//2}`,`√[4](5^6) = √(5^3)`],[`√[12](3^{16})`,`{16//12} kesri 4 ile sadeleşir: {4//3}`,`√[12](3^{16}) = √[3](3^4)`]]},kural:[`√[n](x^m) = √[n·k](x^{m·k})`,`Çarpmadan, bölmeden ve sıralamadan önce dereceler eşitlenir.`],ornek:{s:`a = √[6]3, b = √[3]2 ve c = √[9]7 sayılarını küçükten büyüğe sırala.`,a:[`Dereceler 6, 3 ve 9; hepsinin ortak katı 18`,`a = √[6]3 = √[18](3^3) = √[18]27`,`b = √[3]2 = √[18](2^6) = √[18]64`,`c = √[9]7 = √[18](7^2) = √[18]49`,`Kök içleri: 27 < 49 < 64, yani a < c < b`]},baska:`Kesirleri toplamadan önce paydaları eşitlersin: {1//2} ile {1//3}, {3//6} ile {2//6} olur. Kök derecesi de aslında bir paydadır; çünkü √2 = 2^{{1//2}} ve √[3]3 = 3^{{1//3}}. Paydaları 6'da eşitlersen 2^{{3//6}} ve 3^{{2//6}} olur: ikisi de 6. dereceden köktür ve artık tek kök altında çarpılabilir.`,soru:{s:`√2·√[3]2 hangisine eşittir?`,o:[`√[6]4`,`√[6]32`,`√[5]4`],d:1,y:[`derece`,null,`derece`],neden:`√2 = √[6](2^3) ve √[3]2 = √[6](2^2). Çarpım: √[6](2^5) = √[6]32.`}},{id:`eslenik`,baslik:`Paydayı kökten kurtarmak: eşlenik`,giris:`{1//√2} + {1//2√3} toplamını yapmak için paydaları eşitlemek gerekir; ama paydalarda kök varken bu zordur. Önce paydalar kökten kurtarılır.`,metin:[`Paydada tek bir karekök varsa kesri o kökle genişletirsin: √a·√a = a olduğundan kök kalkar. {1//√3} = {√3//3}. Pay da aynı sayıyla çarpılır; yoksa kesrin değeri değişir.`,`Paydada √a − √b gibi iki terim varsa onu kendisiyle çarpmak işe yaramaz. İşareti değiştirilmiş hâliyle, yani **eşleniğiyle** çarparsın: (√a − √b)·(√a + √b) = a − b. Ortadaki terimler birbirini götürür ve kök kalmaz.`,`Tabloda bunu adım adım gör: (√5 − √2)·(√5 + √2) = 5 + √10 − √10 − 2 = 3.`],tablo:{ad:`Eşlenikle çarp`,bas:[`İşlem`,`Adımlar`,`Sonuç`],sat:[[`√3·√3`,`√9`,`3`],[`{1//√3}·{√3//√3}`,`{√3//√3·√3}`,`{√3//3}`],[`(√5 − √2)·(√5 + √2)`,`5 + √10 − √10 − 2`,`3`],[`(2√2 + 1)·(2√2 − 1)`,`8 − 2√2 + 2√2 − 1`,`7`],[`{1//√5 − √2}·{√5 + √2//√5 + √2}`,`{√5 + √2//5 − 2}`,`{√5 + √2//3}`]]},kural:[`{1//√a} = {√a//a}`,`(√a − √b)·(√a + √b) = a − b`],ornek:{s:`{√3//√3 − 1} − {1//√3 + 1} işleminin sonucu kaçtır?`,a:[`İlk kesri √3 + 1 ile genişlet: {√3·(√3 + 1)//(√3 − 1)·(√3 + 1)} = {3 + √3//2}`,`İkinci kesri √3 − 1 ile genişlet: {√3 − 1//(√3 + 1)·(√3 − 1)} = {√3 − 1//2}`,`Paydalar eşit, payları çıkar: {3 + √3 − √3 + 1//2}`,`{4//2} = 2`]},baska:`Bir kökü yok etmenin yolu onu kendisiyle çarpmaktır: √5·√5 = 5. Ama paydada √5 − √2 varsa ve onu kendisiyle çarparsan ortada 2√10 gibi yeni bir kök doğar. Eşleniğiyle çarptığında ise ortadaki iki terimin biri artı biri eksi çıkar ve birbirini siler; geriye yalnızca kareler kalır: 5 − 2.`,soru:{s:`{6//√3} kesrinin paydası rasyonel yapıldığında hangisi elde edilir?`,o:[`2√3`,`2`,`6√3`],d:0,y:[null,`paydaKok`,`paydaKok`],neden:`{6//√3}·{√3//√3} = {6√3//3} = 2√3. Pay da payda da √3 ile çarpılır.`}},{id:`yaklasik`,baslik:`Yaklaşık değer ve hata payı`,gorsel:{tip:`kare-ara`,n:3},giris:`Ahmet Bey, 1200 m² büyüklüğündeki kare arazisinin çevresini çitle çevirecek. Çit 5 metrelik paneller hâlinde satılıyor ve bir panel 1700 TL. Arazinin kenarı 20√3 metre; ama mağazaya "20√3 metre çit" diye gidilmez.`,metin:[`√3 bir irrasyonel sayıdır: ondalık yazımı hiç bitmez ve tekrar etmez. Gerçek yaşamda bu yüzden yaklaşık değeri kullanılır. Yaklaşık değeri bulmanın yolu, sayıyı karesi bilinen iki sayının arasına sıkıştırmaktır.`,`1^2 = 1 ve 2^2 = 4 olduğundan √3, 1 ile 2 arasındadır. Aralığın ortasını dene: 1,5^2 = 2,25 eder. Bu 3'ten küçük, demek ki √3, 1,5 ile 2 arasında. Yine ortayı dene: 1,75^2 = 3,0625 eder. Bu 3'e çok yakın; √3 ≈ 1,75 alınabilir.`,`Yaklaşık değer kullanıldığında sonuç da yaklaşıktır; aradaki farka **hata payı** denir. √3'ün değeri 1,732… olduğundan 1,75 almak sonucu biraz büyütür. Çit alırken bu iyidir: eksik kalmasındansa biraz artması istenir.`],tablo:{ad:`Araya sıkıştır`,bas:[`Deneme`,`Karesi`,`3 ile karşılaştır`,`Sonuç`],sat:[[`1`,`1`,`küçük`,`√3 > 1`],[`2`,`4`,`büyük`,`√3 < 2`],[`1,5`,`2,25`,`küçük`,`√3 > 1,5`],[`1,75`,`3,0625`,`biraz büyük`,`√3 ≈ 1,75`]]},kural:[`a^2 < x < b^2 ise a < √x < b   (a ≥ 0, b ≥ 0)`,`Yaklaşık değerle bulunan sonuç da yaklaşıktır.`],ornek:{s:`Ahmet Bey bu işi en az kaç TL harcayarak tamamlar? √3 yerine 1,75 al.`,a:[`Bir kenar: 20√3 ≈ 20·1,75 = 35 m`,`Çevre: 4·35 = 140 m`,`Panel sayısı: 140 ÷ 5 = 28`,`Tutar: 28·1700 = 47 600 TL`]},baska:`Bir sayı tahmin oyunu oyna: "Karesi 3 eden sayıyı tuttum." 1 dersin, "daha büyük" denir. 2 dersin, "daha küçük". 1,5 dersin, "daha büyük". 1,75 dersin, "çok yaklaştın, azıcık küçüğü". Her tahminde aralık yarıya iner. İstediğin kadar yaklaşabilirsin ama tam üstüne hiç basamazsın; irrasyonel sayı budur.`,soru:{s:`√40 hangi iki tam sayının arasındadır?`,o:[`5 ile 6`,`6 ile 7`,`19 ile 21`],d:1,y:[null,null,`yari`],neden:`6^2 = 36 ve 7^2 = 49. 36 < 40 < 49 olduğundan √40, 6 ile 7 arasındadır.`}}],ozet:[`Kök, kuvvetin tersidir: √[n]a, n. kuvveti a eden sayıdır. Karekök negatif çıkmaz: √(a^2) = |a|.`,`Rasyonel üs köktür: x^{{m//n}} = √[n](x^m). Payda kökün derecesi, pay içerideki üs.`,`Tam kare çarpan kök dışına karekökü olarak çıkar: √(a^2·b) = a√b.`,`Toplama ve çıkarma yalnızca derecesi ve içi aynı olan köklerde yapılır; katsayılar toplanır, kök içleri toplanmaz.`,`Aynı dereceli kökler tek kök altında çarpılır ve bölünür. Kökün kökünde dereceler çarpılır.`,`Dereceler farklıysa önce eşitlenir: √[n](x^m) = √[n·k](x^{m·k}).`,`Paydadaki kök eşlenikle çarpılarak kaldırılır: (√a − √b)·(√a + √b) = a − b.`,`İrrasyonel bir kökün yaklaşık değeri, karesi bilinen iki sayının arasına sıkıştırılarak bulunur; sonuç da yaklaşıktır.`],sorular:[{id:`s1`,z:1,kart:`kok`,tur:`islem`,s:`√81 − √[3](−8) + √((−3)^2) işleminin sonucu kaçtır?`,o:[`10`,`4`,`14`,`20`,`8`],d:2,y:[`kokNeg`,`kokNeg`,null,null,`kokNeg`],c:[`√81 = 9, çünkü 9^2 = 81`,`√[3](−8) = −2, çünkü (−2)^3 = −8. Tek dereceli kökte işaret korunur`,`√((−3)^2) = √9 = 3. Karekök negatif çıkmaz`,`9 − (−2) + 3 = 14`],h:`Math.sqrt(81) - Math.cbrt(-8) + Math.sqrt((-3)**2) === 14`,kay:`${i_}, 6. Örnek tipinde`},{id:`s2`,z:1,kart:`rasyonel`,tur:`islem`,s:`27^{{2//3}} + 16^{{3//4}} işleminin sonucu kaçtır?`,o:[`12`,`30`,`11`,`5`,`17`],d:4,y:[`rasyonel`,`yari`,`rasyonel`,`rasyonel`,null],c:[`27^{{2//3}} = √[3](27^2). Önce kökü almak kolaydır: √[3]27 = 3, sonra karesi 3^2 = 9`,`16^{{3//4}} = √[4](16^3). √[4]16 = 2, sonra küpü 2^3 = 8`,`9 + 8 = 17`],h:`Math.abs(27**(2/3) + 16**(3/4) - 17) < 1e-9`,kay:`${i_}, 6. Uygulama tabloları ve Alıştırmalar 4. soru tipinde`},{id:`s3`,z:1,kart:`topla`,tur:`baglam`,b:[`Bir deneyde iki cisim farklı yüksekliklerden bırakılmıştır. Birinci cismin yere düşme süresi √48 saniye, ikinci cismin yere düşme süresi √108 saniye olarak hesaplanmıştır.`],s:`Buna göre iki cismin düşme süreleri arasındaki fark kaç saniyedir?`,o:[`√60`,`10√3`,`2√3`,`20√3`,`2√15`],d:2,y:[`kokTopla`,null,null,`disari`,`kokTopla`],c:[`Kök dışına çıkar: √108 = √(36·3) = 6√3`,`√48 = √(16·3) = 4√3`,`Fark: 6√3 − 4√3 = (6 − 4)√3 = 2√3 saniye`],h:`Math.abs(Math.sqrt(108) - Math.sqrt(48) - 2*Math.sqrt(3)) < 1e-9`,kay:`${i_}, köklü gösterimlerle işlemler bölümünün giriş durumu (düşme süreleri)`},{id:`s4`,z:2,kart:`disari`,tur:`islem`,s:`√45 − 2√20 + 3√80 işleminin sonucu kaçtır?`,o:[`11√5`,`5√5`,`19√5`,`49√5`,`7√5`],d:0,y:[null,null,null,`disari`,`kokTopla`],c:[`√45 = √(9·5) = 3√5`,`√20 = √(4·5) = 2√5 ve √80 = √(16·5) = 4√5`,`Yerine yaz: 3√5 − 2·2√5 + 3·4√5 = 3√5 − 4√5 + 12√5`,`(3 − 4 + 12)√5 = 11√5`],h:`Math.abs(Math.sqrt(45) - 2*Math.sqrt(20) + 3*Math.sqrt(80) - 11*Math.sqrt(5)) < 1e-9`,kay:`${i_}, 4. Sıra Sizde ve Alıştırmalar 5. soru tipinde`},{id:`s5`,z:2,kart:`carp`,tur:`baglam`,b:[`Kare şeklindeki iki bahçenin alanları 12 m² ve 27 m²'dir. Bu iki bahçenin birer kenarı uç uca eklenerek kare şeklinde yeni bir bahçenin bir kenarı elde edilecektir.`],s:`Buna göre yeni bahçenin alanı kaç metrekaredir?`,o:[`75`,`15`,`25√3`,`5√3`,`39`],d:0,y:[null,`kare`,`kare`,null,`kokTopla`],c:[`Kenarlar: √12 = 2√3 m ve √27 = 3√3 m`,`Yeni kenar: 2√3 + 3√3 = 5√3 m`,`Alan: (5√3)^2 = 25·3 = 75 m²`,`Dikkat: alanları toplarsan 39 çıkar ama uç uca eklenen kenarlardır, alanlar değil`],h:`Math.abs((Math.sqrt(12) + Math.sqrt(27))**2 - 75) < 1e-9`,kay:`${i_}, 7. Uygulama 5. maddedeki ev planı probleminden uyarlandı`},{id:`s6`,z:2,kart:`derece`,tur:`islem`,s:`a = √2, b = √[3]3 ve c = √[6]6 sayılarının küçükten büyüğe sıralanışı hangisidir?`,o:[`a < b < c`,`c < a < b`,`a < c < b`,`c < b < a`,`b < a < c`],d:1,y:[`siralama`,null,null,`siralama`,null],c:[`Dereceler 2, 3 ve 6; ortak derece 6`,`a = √2 = √[6](2^3) = √[6]8`,`b = √[3]3 = √[6](3^2) = √[6]9`,`c = √[6]6 olduğu gibi kalır`,`Kök içleri: 6 < 8 < 9, yani c < a < b`],h:`6**(1/6) < Math.SQRT2 && Math.SQRT2 < Math.cbrt(3)`,kay:`${i_}, 11. Örnek ve 7. Sıra Sizde tipinde`},{id:`s7`,z:2,kart:`eslenik`,tur:`islem`,s:`{4//√7 − √3} kesrinin paydası rasyonel yapıldığında hangisi elde edilir?`,o:[`√7 − √3`,`4·(√7 + √3)`,`{2·(√7 + √3)//5}`,`1`,`√7 + √3`],d:4,y:[`eslenik`,`paydaKok`,`eslenik`,`paydaKok`,null],c:[`Paydanın eşleniği √7 + √3; kesri bununla genişlet`,`Payda: (√7 − √3)·(√7 + √3) = 7 − 3 = 4`,`Pay: 4·(√7 + √3)`,`{4·(√7 + √3)//4} = √7 + √3`],h:`Math.abs(4/(Math.sqrt(7)-Math.sqrt(3)) - (Math.sqrt(7)+Math.sqrt(3))) < 1e-9`,kay:`${i_}, 9. Uygulama tablosu ve 13. Örnek tipinde`},{id:`s8`,z:3,kart:`yaklasik`,tur:`baglam`,b:[`Bir okul, alanı 800 m² olan kare şeklindeki bahçesinin çevresine tel örgü çektirecektir. Tel örgü 10 metrelik toplar hâlinde satılmaktadır ve bir topun fiyatı 1500 TL'dir. Okul yönetimi hesap yaparken √2 yerine 1,4 almıştır.`],s:`Buna göre okul bu iş için en az kaç TL ödemelidir?`,o:[`4 500`,`16 500`,`16 800`,`18 000`,`240 000`],d:3,y:[null,`yuvarla`,`yuvarla`,null,`yari`],c:[`Bir kenar: √800 = √(400·2) = 20√2 m`,`Yaklaşık değer: 20·1,4 = 28 m`,`Çevre: 4·28 = 112 m`,`Top sayısı: 112 ÷ 10 = 11,2. Yarım top satılmadığı için 12 top gerekir`,`Tutar: 12·1500 = 18 000 TL`],h:`Math.ceil(Math.round(4 * 20 * 1.4) / 10) * 1500 === 18000`,kay:`${i_}, 14. Örnekten uyarlandı (çit yerine tel örgü, sayılar değiştirildi)`},{id:`s9`,z:2,kart:`carp`,tur:`muhakeme`,b:[`Zeynep, (√48 + √27)·√3 işlemini aşağıdaki adımlarla yapmıştır.`],t:{bas:[`Adım`,`Yapılan işlem`],sat:[[`1`,`√48 = 4√3`],[`2`,`√27 = 3√3`],[`3`,`4√3 + 3√3 = 7√3`],[`4`,`7√3·√3 = 7√6`],[`5`,`Sonuç: 7√6`]]},s:`Buna göre Zeynep ilk hatayı hangi adımda yapmıştır?`,o:[`1. adım`,`2. adım`,`3. adım`,`4. adım`,`5. adım`],d:3,y:[`disari`,`disari`,`kokTopla`,null,null],c:[`1. ve 2. adım doğru: 48 = 16·3 ve 27 = 9·3`,`3. adım doğru: kök içleri aynı, katsayılar toplanır`,`4. adım hatalı: √3·√3 = √9 = 3 eder. Çarpmada kök içleri çarpılır, toplanmaz`,`Doğru sonuç: 7·3 = 21`],h:`Math.abs((Math.sqrt(48) + Math.sqrt(27)) * Math.sqrt(3) - 21) < 1e-9`,kay:`${i_}, 1. Tema Ölçme ve Değerlendirme 11. soru tipinde: "ilk hata hangi adımda"`},{id:`s10`,z:3,kart:`topla`,tur:`muhakeme`,s:`a ve b pozitif gerçek sayılardır. Aşağıdaki önermelerden hangisi her zaman doğrudur?`,o:[`√a + √b = √(a + b)`,`√a·√b = √(a·b)`,`√(a^2 + b^2) = a + b`,`√(a·b) = a·√b`,`√(√a) = √[3]a`],d:1,y:[`kokTopla`,null,`kokTopla`,`disari`,`kokKok`],c:[`Küçük sayılarla dene: a = 9 ve b = 16`,`√9 + √16 = 7 ama √25 = 5. Tutmadı`,`√(81 + 256) = √337 ama 9 + 16 = 25 ve 25^2 = 625. Tutmadı`,`√(9·16) = 12 ama 9·√16 = 36. Tutmadı. a = 16 için √(√16) = 2 ama √[3]16, 2 değildir; çünkü 2^3 = 8`,`√a·√b = √(a·b) her zaman doğrudur: a^{{1//2}}·b^{{1//2}} = (a·b)^{{1//2}}; üsleri aynı olanların tabanları çarpılır`],h:`Math.abs(Math.sqrt(9)*Math.sqrt(16) - Math.sqrt(9*16)) < 1e-9 && Math.sqrt(9)+Math.sqrt(16) !== Math.sqrt(25) && Math.sqrt(81+256) !== 25 && Math.sqrt(9*16) !== 9*Math.sqrt(16)`,kay:`Öğretim programı MAT.9.1.1 süreç bileşenleri: önerme sunma ve doğrulama`}],acik:[{id:`a1`,baslik:`Düşme süresi`,b:[`Belli bir yükseklikten bırakılan cismin yere düşme süresi t = √({2h//g}) eşitliğiyle bulunur. Burada h yükseklik (metre), g yer çekimi ivmesidir. Bu soruda g = 10 m/sn² alınız.`],alt:[`5 metre yükseklikten bırakılan cismin düşme süresini bulunuz.`,`20 metre yükseklikten bırakılan cismin düşme süresini bulunuz.`,`Yükseklik 4 katına çıktığında düşme süresi kaç katına çıkmıştır? Nedenini köklü gösterimin bir özelliğiyle açıklayınız.`],adim:[{p:2,m:`h = 5 için t = √({2·5//10}) = √1`},{p:1,m:`t = 1 saniye`},{p:2,m:`h = 20 için t = √({2·20//10}) = √4`},{p:1,m:`t = 2 saniye`},{p:2,m:`Süre 2 katına çıkmıştır`},{p:2,m:`Açıklama: √(4·x) = √4·√x = 2√x; kök içindeki 4 dışarı 2 olarak çıkar`}],kay:`${i_}, 9. Uygulama 5. maddedeki düşme süresi probleminden uyarlandı (g = 10 alındı)`},{id:`a2`,baslik:`Paydayı rasyonel yap`,alt:[`{1//√5 + √3} + {1//√3 − 1} işleminin sonucunu, paydaları rasyonel yaparak bulunuz.`,`Kullandığınız eşlenik ifadeleri yazınız ve neden işe yaradıklarını açıklayınız.`],adim:[{p:2,m:`İlk kesri √5 − √3 ile genişletme: {√5 − √3//5 − 3} = {√5 − √3//2}`},{p:2,m:`İkinci kesri √3 + 1 ile genişletme: {√3 + 1//3 − 1} = {√3 + 1//2}`},{p:2,m:`Paydalar eşit, payları toplama: {√5 − √3 + √3 + 1//2}`},{p:2,m:`Sonuç: {√5 + 1//2}`},{p:2,m:`Açıklama: (√a − √b)·(√a + √b) = a − b olduğundan eşlenikle çarpınca paydada kök kalmaz`}],kay:`${i_}, 8. Sıra Sizde sorusundan uyarlandı`},{id:`a3`,baslik:`Bahçenin çiti`,b:[`Alanı 50 m² olan kare şeklindeki bir bahçenin çevresi çitle çevrilecektir.`],alt:[`Bahçenin bir kenarının uzunluğunu a√b biçiminde yazınız.`,`1,4 ve 1,5 sayılarının karelerini hesaplayarak √2 sayısının 1,4 ile 1,5 arasında olduğunu gösteriniz.`,`√2 yerine 1,4 alarak bahçenin çevresini yaklaşık olarak bulunuz. √2 yerine 1,5 alınsaydı sonuç kaç metre değişirdi?`],adim:[{p:2,m:`√50 = √(25·2) = 5√2 m`},{p:2,m:`1,4^2 = 1,96 ve 1,5^2 = 2,25`},{p:1,m:`1,96 < 2 < 2,25 olduğundan 1,4 < √2 < 1,5`},{p:2,m:`Çevre: 4·5√2 = 20√2 ≈ 20·1,4 = 28 m`},{p:2,m:`1,5 alınırsa çevre 20·1,5 = 30 m bulunur`},{p:1,m:`Sonuç 2 metre değişir: yaklaşık değerin seçimi sonucu etkiler, buna hata payı denir`}],kay:`${i_}, 14. Örnek; öğretim programındaki "yaklaşık değer ve hata payı" açıklaması`}]},o_={id:`mat-mutlak`,ad:`Mutlak Değer`,dk:20,giris:`Mutlak değer bir uzaklıktır. Bu tek fikirle tanım, denklem ve eşitsizlik soruları aynı yoldan çözülür.`,yan:{eksi:{ad:`Mutlak değeri negatif bir sayıya eşitlemek`,anlat:`Mutlak değer bir uzaklıktır ve negatif olamaz. Sağ taraf negatifse denklemin çözümü yoktur; işlem yapmaya gerek kalmaz.`,ornek:`|x + 1| = −3 denkleminin çözüm kümesi boştur.`},tek:{ad:`Tek çözümle yetinmek`,anlat:`Sağ taraf pozitifse içerisi hem o sayıya hem de onun eksisine eşit olabilir. İki denklem de çözülür.`,ornek:`|x − 4| = 6 için x − 4 = 6 ve x − 4 = −6 çözülür: x = 10 ve x = −2.`},isaret:{ad:`İçi negatifken işaret değiştirmeyi unutmak`,anlat:`Mutlak değerin içi negatifse dışarı önüne eksi alarak çıkar. Önce içerinin işaretine bak, sonra aç.`,ornek:`x < 3 ise x − 3 negatiftir; |x − 3| = −(x − 3) = 3 − x.`},yon:{ad:`Eşitsizlikte içeriyi ve dışarıyı karıştırmak`,anlat:`"Küçüktür" sınıra yakın kalmaktır, tek bir aralık verir. "Büyüktür" uzaklaşmaktır, iki ayrı parça verir.`,ornek:`|x| < 2 ise −2 < x < 2.   |x| > 2 ise x < −2 ya da x > 2.`}},kartlar:[{id:`tanim`,baslik:`Mutlak değer: sıfıra uzaklık`,metin:[`|x|, sayı doğrusunda x'in sıfıra olan uzaklığıdır. Uzaklık negatif olmaz: |5| = 5 ve |−5| = 5.`,`Aynı fikirle |a − b|, a ile b arasındaki uzaklıktır.`],kural:[`x ≥ 0 ise |x| = x`,`x < 0 ise |x| = −x`],ornek:{s:`|3 − 7| + |−2| kaçtır?`,a:[`3 − 7 = −4 ve |−4| = 4`,`|−2| = 2`,`4 + 2 = 6`]},baska:`Evinden 3 km doğuya da yürüsen, 3 km batıya da yürüsen yürüdüğün yol 3 km'dir. Mutlak değer yönü atar, yalnızca mesafeyi tutar. Kuraldaki "−x" seni şaşırtmasın: x negatifken −x pozitif bir sayıdır.`,soru:{s:`x = −4 için |x| − x kaçtır?`,o:[`0`,`8`,`−8`],d:1,y:[`isaret`,null,null],neden:`|−4| = 4 ve 4 − (−4) = 8.`}},{id:`acma`,baslik:`Mutlak değeri açmak`,metin:[`Mutlak değeri kaldırmadan önce içerinin işaretine bak. İçerisi pozitifse aynen çıkar, negatifse önüne eksi alarak çıkar.`,`İçerinin işaretini bulmak için verilen aralıktan bir sayı denemek yeterlidir.`],kural:[`a > b ise |a − b| = a − b`,`a < b ise |a − b| = b − a`],ornek:{s:`1 < x < 4 için |x − 1| + |x − 4| neye eşittir?`,a:[`x − 1 pozitif: |x − 1| = x − 1`,`x − 4 negatif: |x − 4| = 4 − x`,`(x − 1) + (4 − x) = 3`]},baska:`Aklından bir sayı tut: x = 2 olsun. |2 − 1| + |2 − 4| = 1 + 2 = 3. x = 3 dene: 2 + 1 = 3. Hep 3 çıkıyor; çünkü bu toplam x'in 1'e ve 4'e uzaklıklarının toplamıdır. x ikisinin arasındayken bu toplam, 1 ile 4 arasındaki mesafeye eşittir.`,soru:{s:`x < 0 için |x| + x neye eşittir?`,o:[`2x`,`0`,`−2x`],d:1,y:[`isaret`,null,null],neden:`x negatifken |x| = −x olur: −x + x = 0.`}},{id:`denklem`,baslik:`Mutlak değerli denklemler`,metin:[`|x − a| = b denklemi "x'in a'ya uzaklığı b" demektir. b pozitifse a'nın iki yanında birer nokta vardır.`,`b sıfırsa tek çözüm vardır. b negatifse çözüm yoktur.`],kural:[`|x − a| = b ise x − a = b ya da x − a = −b   (b > 0)`],ornek:{s:`|2x − 1| = 7 denkleminin çözüm kümesi nedir?`,a:[`Birinci durum: 2x − 1 = 7, buradan x = 4`,`İkinci durum: 2x − 1 = −7, buradan x = −3`,`Çözüm kümesi: {−3, 4}`]},baska:`|x − 3| = 5 için sayı doğrusunda 3'ün üzerinde dur. 5 birim sağa git: 8. 5 birim sola git: −2. İşte iki çözüm. Denklemi kurmadan önce böyle düşünmek, ikinci çözümü unutmanı engeller.`,soru:{s:`|x + 1| = −3 denkleminin kaç çözümü vardır?`,o:[`Çözümü yoktur`,`1`,`2`],d:0,y:[null,`eksi`,`eksi`],neden:`Mutlak değer negatif olamaz; çözüm yoktur.`}},{id:`esitsizlik`,baslik:`Mutlak değerli eşitsizlikler`,metin:[`|x − a| < b, x'in a'ya uzaklığı b'den az demektir: x, a'nın çevresindeki tek bir aralıkta kalır.`,`|x − a| > b ise x o aralığın dışındadır; solda ve sağda iki ayrı parça oluşur.`],kural:[`|x| < a ise −a < x < a`,`|x| > a ise x < −a ya da x > a`],ornek:{s:`|x − 2| ≤ 3 eşitsizliğini kaç tam sayı sağlar?`,a:[`−3 ≤ x − 2 ≤ 3`,`Her tarafa 2 ekle: −1 ≤ x ≤ 5`,`Tam sayılar: −1, 0, 1, 2, 3, 4, 5`,`7 tam sayı`]},baska:`|x − 2| ≤ 3 cümlesini Türkçe oku: "2'ye en çok 3 birim uzaklıktaki sayılar". 2'nin 3 solu −1, 3 sağı 5'tir; aradaki her sayı olur. "Küçüktür" içeride kalmak, "büyüktür" dışarı çıkmaktır.`,soru:{s:`|x| > 2 koşulunu aşağıdakilerden hangisi sağlar?`,o:[`x = −3`,`x = 0`,`x = 2`],d:0,y:[null,`yon`,null],neden:`|−3| = 3 ve 3 > 2. Negatif tarafta da çözüm vardır.`}}],ozet:[`|x|, x'in sıfıra uzaklığıdır; negatif olmaz. |a − b|, a ile b arasındaki uzaklıktır.`,`Açarken içerinin işaretine bak: pozitifse aynen, negatifse önüne eksi alarak çıkar.`,`|x − a| = b (b > 0) denkleminin iki çözümü vardır: x − a = b ve x − a = −b.`,`Sağ taraf negatifse çözüm yoktur.`,`|x| < a tek aralık verir: −a < x < a.`,`|x| > a iki parça verir: x < −a ya da x > a.`],sorular:[{id:`s1`,z:1,kart:`tanim`,s:`|−8| − |3 − 5| + |−1| işleminin sonucu kaçtır?`,o:[`5`,`7`,`9`,`11`,`−7`],d:1,y:[null,null,null,`isaret`,null],c:[`|−8| = 8`,`|3 − 5| = |−2| = 2`,`|−1| = 1`,`8 − 2 + 1 = 7`],h:`Math.abs(-8) - Math.abs(3-5) + Math.abs(-1) === 7`},{id:`s2`,z:1,kart:`denklem`,s:`|x − 4| = 6 denkleminin kökleri toplamı kaçtır?`,o:[`−2`,`4`,`8`,`10`,`12`],d:2,y:[null,null,null,`tek`,null],c:[`Birinci durum: x − 4 = 6, x = 10`,`İkinci durum: x − 4 = −6, x = −2`,`10 + (−2) = 8`],h:`[10, -2].every((x) => Math.abs(x - 4) === 6)`},{id:`s3`,z:1,kart:`acma`,s:`x < 3 olmak üzere |x − 3| + x ifadesinin eşiti hangisidir?`,o:[`−3`,`3`,`2x − 3`,`3 − 2x`,`2x + 3`],d:1,y:[null,null,`isaret`,null,null],c:[`x < 3 olduğundan x − 3 negatiftir`,`|x − 3| = 3 − x`,`3 − x + x = 3`],h:`[-5, 0, 2.5].every((x) => Math.abs(x - 3) + x === 3)`},{id:`s4`,z:2,kart:`esitsizlik`,s:`|x − 1| < 4 eşitsizliğini sağlayan kaç tam sayı vardır?`,o:[`5`,`6`,`7`,`8`,`9`],d:2,y:[null,null,null,null,null],c:[`−4 < x − 1 < 4`,`Her tarafa 1 ekle: −3 < x < 5`,`Tam sayılar: −2, −1, 0, 1, 2, 3, 4`,`7 tam sayı (uçlar dahil değil)`],h:`Array.from({ length: 41 }, (_, i) => i - 20).filter((x) => Math.abs(x - 1) < 4).length === 7`},{id:`s5`,z:2,kart:`denklem`,s:`|2x + 3| = x + 6 denklemini sağlayan x değerlerinin toplamı kaçtır?`,o:[`−3`,`0`,`3`,`6`,`9`],d:1,y:[null,null,`tek`,null,null],c:[`Birinci durum: 2x + 3 = x + 6, x = 3`,`İkinci durum: 2x + 3 = −(x + 6), 3x = −9, x = −3`,`Kontrol: x = 3 için 9 = 9, x = −3 için 3 = 3; ikisi de sağlıyor`,`3 + (−3) = 0`],h:`[3, -3].every((x) => Math.abs(2*x + 3) === x + 6)`},{id:`s6`,z:2,kart:`acma`,s:`2 < x < 5 olmak üzere |x − 2| + |x − 5| + |x + 1| ifadesinin eşiti hangisidir?`,o:[`x + 4`,`3x − 6`,`8 − x`,`x + 8`,`6 − x`],d:0,y:[null,`isaret`,null,null,null],c:[`x − 2 pozitif: |x − 2| = x − 2`,`x − 5 negatif: |x − 5| = 5 − x`,`x + 1 pozitif: |x + 1| = x + 1`,`(x − 2) + (5 − x) + (x + 1) = x + 4`],h:`[2.5, 3, 4.5].every((x) => Math.abs(x-2) + Math.abs(x-5) + Math.abs(x+1) === x + 4)`},{id:`s7`,z:3,kart:`esitsizlik`,s:`|x + 2| ≥ 5 eşitsizliğini sağlamayan tam sayıların toplamı kaçtır?`,o:[`−20`,`−18`,`−14`,`−9`,`0`],d:1,y:[null,null,null,null,null],c:[`Sağlamayanlar |x + 2| < 5 koşulunu sağlar`,`−5 < x + 2 < 5, buradan −7 < x < 3`,`Tam sayılar: −6, −5, −4, −3, −2, −1, 0, 1, 2`,`Toplamları: −18`],h:`Array.from({ length: 41 }, (_, i) => i - 20).filter((x) => !(Math.abs(x + 2) >= 5)).reduce((a, b) => a + b, 0) === -18`},{id:`s8`,z:3,kart:`tanim`,s:`|x − 3| + |y + 2| = 0 olduğuna göre x·y çarpımı kaçtır?`,o:[`−6`,`−5`,`1`,`5`,`6`],d:0,y:[null,null,null,null,null],c:[`Mutlak değerler negatif olamaz; toplamları 0 ise ikisi de 0'dır`,`|x − 3| = 0 ise x = 3`,`|y + 2| = 0 ise y = −2`,`x·y = 3·(−2) = −6`],h:`Math.abs(3 - 3) + Math.abs(-2 + 2) === 0 && 3 * -2 === -6`}]},s_={id:`mat-oran`,ad:`Oran ve Orantı`,dk:25,giris:`İki çokluk birlikte nasıl değişiyor? Doğru orantıda bölüm, ters orantıda çarpım sabit kalır.`,yan:{fark:{ad:`Oranı toplama–çıkarmayla düşünmek`,anlat:`Oran bir bölümdür. {a//b} = {2//5} demek a = 2 ve b = 5 demek değildir; a = 2k ve b = 5k demektir. Çokluklar aynı sayıyla çarpılarak büyür, aynı sayı eklenerek değil.`,ornek:`{a//b} = {2//5} ve a + b = 42 ise 7k = 42, k = 6; a = 12 ve b = 30.`},capraz:{ad:`Orantıyı ters kurmak`,anlat:`Orantıda aynı tür çokluklar aynı hizaya yazılır, sonra içler dışlar çarpımı yapılır.`,ornek:`{a//b} = {3//4} ve a = 12 ise 12·4 = 3·b, b = 16.`},ters:{ad:`Doğru ve ters orantıyı karıştırmak`,anlat:`Önce sor: biri artınca öbürü artıyor mu, azalıyor mu? Birlikte artıyorsa doğru orantıdır, bölüm sabittir. Biri artarken öbürü azalıyorsa ters orantıdır, çarpım sabittir.`,ornek:`İşçi sayısı artınca süre azalır: 8·15 = 12·x, x = 10 gün.`},pay:{ad:`Paylaştırmada oranların toplamını kullanmamak`,anlat:`Paylar oranların toplamı üzerinden bulunur: bütün, toplam pay sayısına bölünür ve bir payın değeri (k) elde edilir.`,ornek:`180 TL 2, 3 ve 4 ile doğru orantılı paylaşılırsa 9k = 180, k = 20; paylar 40, 60 ve 80 TL.`}},kartlar:[{id:`oran`,baslik:`Oran, orantı ve k sabiti`,metin:[`Oran, aynı türden iki çokluğun bölümle karşılaştırılmasıdır. İki oranın eşitliğine orantı denir.`,`Bir oran verildiğinde çoklukların gerçek değerleri bilinmez; yalnızca kaç pay oldukları bilinir. Bir payın değerine k denir.`],kural:[`{a//b} = {c//d} ise a·d = b·c`,`{a//b} = {2//3} ise a = 2k, b = 3k`],ornek:{s:`{a//b} = {2//3} ve a + b = 30 ise a kaçtır?`,a:[`a = 2k ve b = 3k yaz`,`a + b = 5k = 30, buradan k = 6`,`a = 2·6 = 12`]},baska:`Bir pilav tarifi düşün: 2 bardak pirince 3 bardak su. 4 bardak pirinç koyarsan 6 bardak su gerekir. Miktarlar değişti ama "2'ye 3" ilişkisi aynı kaldı. k, tarifi kaç kat yaptığındır.`,soru:{s:`{a//b} = {3//4} ve a = 12 ise b kaçtır?`,o:[`9`,`13`,`16`],d:2,y:[`capraz`,`fark`,null],neden:`a = 3k = 12 ise k = 4; b = 4k = 16.`}},{id:`dogru`,baslik:`Doğru orantı`,metin:[`İki çokluktan biri artarken diğeri de aynı oranda artıyorsa doğru orantılıdırlar. Bölümleri sabittir.`,`Alınan ürün miktarı ile ödenen para, sabit hızla gidilen süre ile alınan yol doğru orantılıdır.`],kural:[`{y//x} = k   (sabit)`,`y = k·x`],ornek:{s:`3 kg elma 45 TL ise 5 kg elma kaç TL'dir?`,a:[`Bölüm sabit: {45//3} = {x//5}`,`İçler dışlar: 3·x = 45·5 = 225`,`x = 75 TL`]},baska:`En kısa yol birim değeri bulmaktır: 1 kg elma 45 ÷ 3 = 15 TL. 5 kg ise 5·15 = 75 TL. Doğru orantının özü "bir tanesi ne kadar?" sorusudur.`,soru:{s:`4 defter 60 TL ise 7 defter kaç TL'dir?`,o:[`63`,`105`,`420`],d:1,y:[`fark`,null,null],neden:`Bir defter 15 TL; 7 defter 7·15 = 105 TL.`}},{id:`ters`,baslik:`Ters orantı`,metin:[`İki çokluktan biri artarken diğeri aynı oranda azalıyorsa ters orantılıdırlar. Çarpımları sabittir.`,`Aynı iş için işçi sayısı ile süre, aynı yol için hız ile süre ters orantılıdır.`],kural:[`x·y = k   (sabit)`],ornek:{s:`6 işçi bir işi 12 günde bitiriyor. 9 işçi aynı işi kaç günde bitirir?`,a:[`İşçi artınca süre azalır: ters orantı`,`Çarpım sabit: 6·12 = 9·x`,`72 = 9x, x = 8 gün`]},baska:`Toplam iş değişmez. 6 işçi 12 gün çalışınca 6·12 = 72 "işçi-gün" emek harcanır. Aynı 72'yi 9 işçiye bölersen her birine 8 gün düşer. Önce toplamı bul, sonra yeni sayıya böl.`,soru:{s:`4 musluk bir havuzu 6 saatte dolduruyor. Aynı havuzu 8 musluk kaç saatte doldurur?`,o:[`12`,`3`,`10`],d:1,y:[`ters`,null,`fark`],neden:`Çarpım sabit: 4·6 = 8·x, x = 3 saat.`}},{id:`paylastir`,baslik:`Orantılı paylaştırma`,metin:[`Bir bütün 2, 3 ve 5 ile doğru orantılı paylaştırılacaksa paylar 2k, 3k ve 5k olur. Toplam bütüne eşitlenir ve k bulunur.`,`Ters orantılı paylaşımda paylar {k//2}, {k//3} gibi yazılır: sayısı küçük olan büyük payı alır.`],kural:[`Doğru orantılı paylar: a·k, b·k`,`Ters orantılı paylar: {k//a}, {k//b}`],ornek:{s:`120 TL, 2 ve 3 ile ters orantılı paylaştırılırsa paylar kaç TL olur?`,a:[`Paylar {k//2} ve {k//3}`,`{k//2} + {k//3} = {5k//6} = 120, buradan k = 144`,`Paylar: {144//2} = 72 TL ve {144//3} = 48 TL`]},baska:`2 ve 3 ile ters orantılı olmak, {1//2} ve {1//3} ile doğru orantılı olmaktır. Paydaları eşitle: {3//6} ve {2//6}. Yani para 3'e 2 paylaşılır: 120'nin beşte üçü 72, beşte ikisi 48.`,soru:{s:`60 ceviz, 1 ve 2 ile doğru orantılı paylaştırılırsa küçük pay kaç ceviz olur?`,o:[`20`,`30`,`40`],d:0,y:[null,`pay`,null],neden:`k + 2k = 60, k = 20. Küçük pay 20 ceviz.`}}],ozet:[`Oran bölümdür. {a//b} = {2//3} ise a = 2k, b = 3k yazılır.`,`Orantıda içler dışlar çarpımı eşittir: a·d = b·c.`,`Doğru orantı: birlikte artarlar, bölüm sabittir.`,`Ters orantı: biri artar, öbürü azalır; çarpım sabittir.`,`Paylaştırmada önce payları k ile yaz, toplamı bütüne eşitle.`,`Birden çok çokluk varsa toplam işi (işçi × saat × gün) hesapla.`],sorular:[{id:`s1`,z:1,kart:`oran`,s:`{a//b} = {2//5} ve a + b = 42 ise b kaçtır?`,o:[`5`,`12`,`18`,`30`,`35`],d:3,y:[`fark`,null,null,null,null],c:[`a = 2k ve b = 5k yaz`,`a + b = 7k = 42, buradan k = 6`,`b = 5·6 = 30`],h:`12 / 30 === 2 / 5 && 12 + 30 === 42`},{id:`s2`,z:1,kart:`dogru`,s:`Bir araç sabit hızla 3 saatte 240 km yol alıyor. Aynı hızla 5 saatte kaç km yol alır?`,o:[`144`,`320`,`360`,`400`,`480`],d:3,y:[`ters`,null,null,null,null],c:[`Süre artınca yol da artar: doğru orantı`,`Bir saatte alınan yol: 240 ÷ 3 = 80 km`,`5 saatte: 5·80 = 400 km`],h:`240 / 3 * 5 === 400`},{id:`s3`,z:1,kart:`ters`,s:`8 işçi bir işi 15 günde bitiriyor. Aynı işi 12 işçi kaç günde bitirir?`,o:[`8`,`10`,`12`,`19`,`22,5`],d:1,y:[null,null,null,`fark`,`ters`],c:[`İşçi artınca süre azalır: ters orantı`,`Çarpım sabit: 8·15 = 12·x`,`120 = 12x, x = 10 gün`],h:`8 * 15 / 12 === 10`},{id:`s4`,z:2,kart:`paylastir`,s:`180 TL, üç kardeş arasında 2, 3 ve 4 sayılarıyla doğru orantılı paylaştırılıyor. En büyük pay kaç TL'dir?`,o:[`40`,`60`,`80`,`90`,`120`],d:2,y:[null,null,null,`pay`,null],c:[`Paylar 2k, 3k ve 4k`,`2k + 3k + 4k = 9k = 180, buradan k = 20`,`En büyük pay: 4·20 = 80 TL`],h:`180 / 9 * 4 === 80`},{id:`s5`,z:2,kart:`oran`,s:`{x//3} = {y//4} = {z//5} ve x + y + z = 48 ise z − x kaçtır?`,o:[`2`,`4`,`8`,`12`,`20`],d:2,y:[`fark`,null,null,null,null],c:[`x = 3k, y = 4k, z = 5k yaz`,`3k + 4k + 5k = 12k = 48, buradan k = 4`,`z − x = 5k − 3k = 2k = 8`],h:`12 + 16 + 20 === 48 && 20 - 12 === 8`},{id:`s6`,z:2,kart:`paylastir`,s:`140 ceviz, Ali ve Burak arasında sırasıyla 2 ve 5 sayılarıyla ters orantılı paylaştırılıyor. Ali kaç ceviz alır?`,o:[`40`,`56`,`70`,`100`,`120`],d:3,y:[`ters`,null,`pay`,null,null],c:[`Ters orantılı paylar: Ali {k//2}, Burak {k//5}`,`{k//2} + {k//5} = {7k//10} = 140, buradan k = 200`,`Ali: {200//2} = 100 ceviz`],h:`200 / 2 + 200 / 5 === 140`},{id:`s7`,z:3,kart:`ters`,s:`6 işçi günde 8 saat çalışarak bir işi 10 günde bitiriyor. Aynı işi 8 işçi günde 6 saat çalışarak kaç günde bitirir?`,o:[`7,5`,`8`,`10`,`12`,`15`],d:2,y:[null,null,null,null,null],c:[`Toplam iş: 6·8·10 = 480 işçi-saat`,`Yeni ekip bir günde 8·6 = 48 işçi-saat çalışır`,`480 ÷ 48 = 10 gün`],h:`6 * 8 * 10 / (8 * 6) === 10`},{id:`s8`,z:3,kart:`ters`,s:`a sayısı b ile doğru, c ile ters orantılıdır. a = 6 iken b = 4 ve c = 2'dir. Buna göre b = 10 ve c = 3 iken a kaçtır?`,o:[`5`,`10`,`15`,`22,5`,`45`],d:1,y:[null,null,null,`ters`,null],c:[`Doğru orantılı olan çarpılır, ters orantılı olan bölünür: a = {k·b//c}`,`6 = {k·4//2}, buradan k = 3`,`a = {3·10//3} = 10`],h:`3 * 4 / 2 === 6 && 3 * 10 / 3 === 10`}]},c_={id:`tr-yazim`,ad:`Yazım Kuralları`,dk:20,giris:`Sınavda en sık çıkan dört başlık: de ile ki'nin yazımı, soru eki, büyük harfler ve kesme işareti.`,yan:{baglac:{ad:`Bağlaç olan "de"yi bitişik yazmak`,anlat:`"Dahi, bile" anlamı katan de/da bağlaçtır ve her zaman ayrı yazılır. Cümleden çıkarıldığında cümle bozulmaz. Bağlaç olan de hiçbir zaman "te, ta" biçimine girmez.`,ornek:`"Sen de gel." cümlesinden de çıkarılınca "Sen gel." kalır; cümle bozulmaz, o hâlde ayrı yazılır.`},ek:{ad:`Ek olan "-de"yi ayrı yazmak`,anlat:`Yer ya da zaman bildiren -de/-da ektir ve bitişik yazılır. Çıkarıldığında cümle bozulur.`,ornek:`"Evde kaldım." cümlesinden -de çıkarılınca "Ev kaldım." olur; bozulur, o hâlde bitişik yazılır.`},ki:{ad:`Bağlaç olan "ki" ile ek olan "-ki"yi karıştırmak`,anlat:`Bağlaç olan ki ayrı yazılır. Sıfat yapan ve zamir olan -ki bitişik yazılır; arkasına -ler getirilebiliyorsa ektir. Kalıplaşmış birkaç sözcük de bitişiktir: sanki, oysaki, mademki, belki, hâlbuki, çünkü, meğerki.`,ornek:`"Evdeki" sözcüğü "evdekiler" olabilir: ek, bitişik. "Duydum ki" için "duydum kiler" denmez: bağlaç, ayrı.`},mi:{ad:`Soru ekini bitişik yazmak`,anlat:`Soru eki mı, mi, mu, mü kendinden önceki sözcükten her zaman ayrı yazılır. Kendinden sonra gelen ekler ise ona bitişir.`,ornek:`"Gelecek misin?" doğrudur; "Gelecekmisin?" yanlıştır.`},tarih:{ad:`Tarih bildirmeyen ay ve gün adını büyük yazmak`,anlat:`Ay ve gün adları yalnızca belirli bir tarihi gösterdiklerinde büyük harfle başlar. Yanlarında gün sayısı ya da yıl yoksa küçük yazılırlar.`,ornek:`"29 Ekim 1923 Pazartesi" büyük; "ekim ayında", "her pazartesi" küçük yazılır.`},yon:{ad:`Yön adlarının yazımını karıştırmak`,anlat:`Yön adı özel addan önce gelip onunla birlikte bir bölgeyi adlandırıyorsa büyük yazılır. Özel addan sonra gelirse küçük yazılır.`,ornek:`"Doğu Anadolu" büyük; "Anadolu'nun doğusu" küçük yazılır.`},kesme:{ad:`Kesme işaretinin yerini karıştırmak`,anlat:`Özel adlara gelen çekim ekleri kesmeyle ayrılır. Yapım ekleri ve onlardan sonra gelen ekler ayrılmaz.`,ornek:
