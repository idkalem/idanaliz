`"Ankara'ya" doğru; "Ankara'lı" yanlış, doğrusu "Ankaralı". "Türkçeyi" de kesmesiz yazılır.`},kurum:{ad:`Kurum adına gelen eki kesmeyle ayırmak`,anlat:`Kurum, kuruluş ve kurul adlarına gelen ekler kesmeyle ayrılmaz.`,ornek:`"Türk Dil Kurumunun" doğru; "Türk Dil Kurumu'nun" yanlıştır.`},hersey:{ad:`Ayrı ve bitişik yazılan kalıpları karıştırmak`,anlat:`"Şey" sözcüğü her zaman ayrı yazılır: her şey, bir şey. "Birkaç, birçok, hiçbir, herhangi" bitişik; "pek çok, ya da" ayrı yazılır.`,ornek:`"Hiçbir şey" yazımında hiçbir bitişik, şey ayrıdır.`}},kartlar:[{id:`dede`,baslik:`"de" ne zaman ayrı yazılır?`,metin:[`Türkçede iki ayrı "de" vardır. Biri bağlaçtır: "dahi, bile" anlamı katar ve ayrı yazılır. Öbürü ektir: yer ya da zaman bildirir ve bitişik yazılır.`,`Ayırmak için "de"yi cümleden çıkar. Cümle bozulmuyorsa bağlaçtır. Bağlaç olan de hiçbir zaman "te, ta" olmaz; "Kitap ta aldım." yanlıştır, doğrusu "Kitap da aldım."`],kural:[`Çıkarınca cümle bozulmuyorsa: bağlaç, ayrı yaz`,`Çıkarınca cümle bozuluyorsa: ek, bitişik yaz`],ornek:{s:`"Bu akşam bizde kal, kardeşin de gelsin." cümlesindeki iki "de" nasıl yazılmış?`,a:[`"bizde": çıkarınca "Bu akşam biz kal" olur, bozulur. Ek, bitişik.`,`"kardeşin de": çıkarınca "kardeşin gelsin" olur, bozulmaz. Bağlaç, ayrı.`,`İkisi de doğru yazılmış.`]},baska:`Bir başka deneme: "de"nin yerine "bile" koy. "Ben de geldim" yerine "Ben bile geldim" denebiliyor; bağlaç, ayrı yazılır. "Evde kaldım" yerine "Ev bile kaldım" denemiyor; ek, bitişik yazılır.`,soru:{s:`"Okulda sen de vardın." cümlesinde ayrı yazılan "de" için hangisi doğrudur?`,o:[`Yer bildiren ektir`,`Bağlaçtır, doğru yazılmıştır`,`Yanlış yazılmıştır, bitişik olmalıdır`],d:1,y:[`ek`,null,`baglac`],neden:`"Okulda sen vardın." cümlesi bozulmuyor; bağlaçtır ve ayrı yazılır.`}},{id:`kimi`,baslik:`"ki" ve soru eki "mi"`,metin:[`Bağlaç olan ki ayrı yazılır: "Öyle yoruldum ki anlatamam." Sıfat yapan -ki ile zamir olan -ki bitişik yazılır: "evdeki hesap", "benimki".`,`Soru eki mı, mi, mu, mü her zaman ayrı yazılır; ardından gelen ekler ona bitişir: "Geldin mi?", "Gelecek misin?", "Güzel miydi?"`],kural:[`Arkasına -ler geliyorsa (evdekiler): ek, bitişik`,`Gelmiyorsa: bağlaç, ayrı`,`Soru eki her zaman ayrı`],ornek:{s:`"Bahçedeki çiçekler öyle güzel ki bakmaya doyamadım." cümlesindeki iki "ki" nasıl yazılmış?`,a:[`"bahçedeki": "bahçedekiler" denebiliyor. Ek, bitişik.`,`"güzel ki": "güzel kiler" denemiyor. Bağlaç, ayrı.`,`İkisi de doğru yazılmış.`]},baska:`Bitişik yazılan kalıplaşmış yedi sözcüğün baş harfleri "SOMBaHÇeM" eder: Sanki, Oysaki, Mademki, Belki, Hâlbuki, Çünkü, Meğerki. Bunların dışında bağlaç olan ki ayrı yazılır.`,soru:{s:`Aşağıdakilerin hangisinde yazım yanlışı vardır?`,o:[`Sen de mi geldin?`,`Öyle yoruldum ki anlatamam.`,`Bahçede ki çiçekler açmış.`],d:2,y:[`mi`,`ki`,null],neden:`"Bahçedeki" sıfat yapan -ki almıştır; bitişik yazılır.`}},{id:`buyuk`,baslik:`Büyük harflerin kullanımı`,metin:[`Özel adlar, dil ve millet adları, kurum adları büyük harfle başlar: Türkçe, İngiliz, Türk Dil Kurumu.`,`Ay ve gün adları yalnızca belirli bir tarihi gösterdiklerinde büyük yazılır. Yön adları ise özel addan önce geldiklerinde büyük, sonra geldiklerinde küçük yazılır.`],kural:[`29 Ekim 1923 Pazartesi  ama  ekim ayında, her pazartesi`,`Doğu Anadolu  ama  Anadolu'nun doğusu`],ornek:{s:`"Okullar 14 Eylül 2026 Pazartesi günü açılacak; her eylül olduğu gibi heyecanlıyız." cümlesi doğru yazılmış mı?`,a:[`"14 Eylül 2026 Pazartesi" belirli bir tarih: büyük, doğru.`,`"her eylül" herhangi bir eylül: küçük, doğru.`,`Cümlede yazım yanlışı yok.`]},baska:`Kendine şunu sor: "Bu, takvimde tek bir gün mü?" "5 Mayıs 2025 Pazartesi" takvimde tek bir gündür, büyük yazılır. "Pazartesi günleri" ise yılda elli iki ayrı gündür, küçük yazılır.`,soru:{s:`Aşağıdakilerin hangisinin yazımı doğrudur?`,o:[`Okullar Eylül ayında açılacak.`,`Toplantı 12 Mart 2026 Perşembe günü yapılacak.`,`Türkiye'nin Batısı daha ılımandır.`],d:1,y:[`tarih`,null,`yon`],neden:`Gün ve yıl verildiği için belirli bir tarihtir; ay ve gün adı büyük yazılır.`}},{id:`kesme`,baslik:`Kesme işareti ve sık karıştırılan sözcükler`,metin:[`Özel adlara gelen çekim ekleri kesmeyle ayrılır: Ankara'ya, Ayşe'nin, 1923'te. Yapım ekleri ve onlardan sonra gelen ekler ayrılmaz: Ankaralı, Türkçenin. Kurum adlarına gelen ekler de kesmeyle ayrılmaz: Türk Dil Kurumunun.`,`"Şey" her zaman ayrı yazılır: her şey, bir şey. "Birkaç, birçok, hiçbir, herhangi" bitişik yazılır. Birden çok sözcükten oluşan sayılar ayrı yazılır: on beş, yüz elli.`],kural:[`Ankara'ya  ama  Ankaralı`,`her şey, bir şey  ama  birkaç, hiçbir`,`on beş, otuz iki`],ornek:{s:`"Türk Dil Kurumunun sözlüğünde hiçbir şey bulamadım." cümlesi doğru yazılmış mı?`,a:[`"Kurumunun": kurum adına gelen ek kesmeyle ayrılmaz, doğru.`,`"hiçbir": bitişik, doğru.`,`"şey": ayrı, doğru.`,`Cümlede yazım yanlışı yok.`]},baska:`Kesme için tek soru: ek, özel adı başka bir sözcüğe çeviriyor mu? "Ankaralı" artık bir şehir değil, bir kişidir; yeni bir sözcük oluştu, kesme konmaz. "Ankara'ya" derken şehir hâlâ aynı şehirdir; kesme konur.`,soru:{s:`Aşağıdakilerin hangisinin yazımı doğrudur?`,o:[`Türk Dil Kurumu'nun sitesine baktım.`,`Herşey yolunda.`,`Ankara'dan birkaç kişi geldi.`],d:2,y:[`kurum`,`hersey`,null],neden:`"Ankara'dan" özel ada gelen çekim ekidir, "birkaç" bitişik yazılır.`}}],ozet:[`Bağlaç olan de/da ayrı yazılır; çıkarınca cümle bozulmaz. Ek olan -de/-da bitişik yazılır.`,`Bağlaç olan ki ayrı; sıfat yapan ve zamir olan -ki bitişik. Bitişik kalıplar: sanki, oysaki, mademki, belki, hâlbuki, çünkü, meğerki.`,`Soru eki mı, mi, mu, mü her zaman ayrı yazılır.`,`Ay ve gün adları yalnızca belirli bir tarihte büyük yazılır.`,`Yön adı özel addan önce büyük (Doğu Anadolu), sonra küçük (Anadolu'nun doğusu).`,`Özel ada gelen çekim eki kesmeyle ayrılır; yapım eki ve kurum adına gelen ek ayrılmaz.`,`her şey, bir şey ayrı; birkaç, birçok, hiçbir bitişik; on beş ayrı.`],sorular:[{id:`s1`,z:1,kart:`dede`,s:`Aşağıdaki cümlelerin hangisinde "de"nin yazımı yanlıştır?`,o:[`Bu konuyu ben de bilmiyorum.`,`Kitabı masanın üstünde unutmuş.`,`Sende mi bizimle geliyorsun?`,`Akşam evde olacağım.`,`Gitsek de olur, gitmesek de.`],d:2,y:[`baglac`,`ek`,null,`ek`,`baglac`],c:[`Her cümlede "de"yi çıkarıp cümlenin bozulup bozulmadığına bak.`,`C seçeneği: "Sen mi bizimle geliyorsun?" cümlesi bozulmuyor; bu de bağlaçtır.`,`Bağlaç ayrı yazılır: "Sen de mi bizimle geliyorsun?"`]},{id:`s2`,z:1,kart:`kimi`,s:`Aşağıdaki cümlelerin hangisinde "ki"nin yazımı yanlıştır?`,o:[`Bahçedeki ağaçlar çiçek açmış.`,`Öyle bir yağmur yağdı ki sokaklar göle döndü.`,`Seninki benimkinden daha yeni.`,`Duydumki sınavı kazanmışsın.`,`Mademki geldin, biraz otur.`],d:3,y:[`ki`,`ki`,`ki`,null,`ki`],c:[`Arkasına -ler getirmeyi dene: "bahçedekiler", "seninkiler" olur; bunlar ektir, bitişik yazılır.`,`"Duydum ki": "duydum kiler" olmaz; bağlaçtır.`,`Bağlaç ayrı yazılır: "Duydum ki sınavı kazanmışsın."`,`"Mademki" kalıplaşmış sözcüklerdendir, bitişik yazılır.`]},{id:`s3`,z:1,kart:`kimi`,s:`Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?`,o:[`Sen de mi geldin?`,`Yarın bize gelecekmisin?`,`Güzel mi güzel bir evdi.`,`Bunu sen mi yaptın?`,`Hava soğuk muydu?`],d:1,y:[`mi`,null,`mi`,`mi`,`mi`],c:[`Soru eki her zaman kendinden önceki sözcükten ayrı yazılır.`,`Kendinden sonra gelen ekler ona bitişir.`,`Doğrusu: "Yarın bize gelecek misin?"`]},{id:`s4`,z:2,kart:`buyuk`,s:`Aşağıdaki cümlelerin hangisinde büyük harflerin kullanımıyla ilgili bir yanlışlık vardır?`,o:[`Sınav 14 Haziran 2026 Pazar günü yapılacak.`,`Her yıl Ağustos ayında köye gideriz.`,`Güneydoğu Anadolu'da yazlar sıcak geçer.`,`Bu yaz Ege'nin kuzeyini gezeceğiz.`,`Türkçe dersinden yüksek not aldı.`],d:1,y:[`tarih`,null,`yon`,`yon`,null],c:[`A: gün ve yıl verilmiş, belirli bir tarih; büyük yazım doğru.`,`B: "her yıl ağustos ayında" belirli bir tarih değil; ay adı küçük yazılmalı.`,`C ve D: yön adı özel addan önce büyük, sonra küçük; ikisi de doğru.`,`Yanlış olan B: "Her yıl ağustos ayında köye gideriz."`]},{id:`s5`,z:2,kart:`kesme`,s:`Aşağıdaki cümlelerin hangisinde kesme işareti yanlış kullanılmıştır?`,o:[`Ayşe'nin kitabı bende kaldı.`,`Yarın İzmir'e gidiyoruz.`,`Toplantıya Ankara'lı iki öğretmen katıldı.`,`1923'te Cumhuriyet ilan edildi.`,`TDK'nin sözlüğüne baktım.`],d:2,y:[`kesme`,`kesme`,null,null,null],c:[`Özel adlara gelen çekim ekleri kesmeyle ayrılır: Ayşe'nin, İzmir'e.`,`"-lı" bir yapım ekidir; yeni bir sözcük oluşturur.`,`Yapım ekleri kesmeyle ayrılmaz: "Ankaralı".`]},{id:`s6`,z:2,kart:`kesme`,s:`Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?`,o:[`Bugün her şey yolunda gitti.`,`Birkaç gün sonra görüşürüz.`,`Bu konuda hiç bir fikrim yok.`,`Sana bir şey söyleyeceğim.`,`Pek çok kişi konsere geldi.`],d:2,y:[`hersey`,`hersey`,null,`hersey`,`hersey`],c:[`"Şey" her zaman ayrı yazılır: her şey, bir şey.`,`"Birkaç" bitişik, "pek çok" ayrı yazılır.`,`"Hiçbir" bitişik yazılır; C seçeneğinde ayrı yazılmış.`]},{id:`s7`,z:3,kart:`kesme`,s:`Aşağıdaki cümlelerin hangisinde yazım yanlışı yoktur?`,o:[`Türk Dil Kurumu'nun yeni sözlüğü yayımlandı.`,`Okulun önündeki parkta buluşalım, sen de gel.`,`Yarınki maça sende gelir misin?`,`Herkez bu habere çok sevindi.`,`Kardeşim bu yıl onbeş yaşına girdi.`],d:1,y:[`kurum`,null,`baglac`,null,null],c:[`A: kurum adına gelen ek kesmeyle ayrılmaz; doğrusu "Kurumunun".`,`C: "sen de" bağlaçtır, ayrı yazılır.`,`D: doğrusu "herkes".   E: doğrusu "on beş".`,`B: "önündeki" ek, bitişik; "sen de" bağlaç, ayrı. Yanlış yok.`]},{id:`s8`,z:3,kart:`buyuk`,s:`"Geçen Salı günü (I) Doğu Anadolu'ya (II) gittik. Oradaki (III) insanlar Türkçeyi (IV) çok güzel konuşuyordu; öyle ki (V) hayran kaldık." Numaralanmış sözlerin hangisinde yazım yanlışı vardır?`,o:[`I`,`II`,`III`,`IV`,`V`],d:0,y:[null,`yon`,`ki`,`kesme`,`ki`],c:[`I: "geçen salı günü" belirli bir tarih değil; gün adı küçük yazılmalı.`,`II: yön adı özel addan önce, büyük; doğru.`,`III: "oradakiler" denebiliyor; ek, bitişik; doğru.`,`IV: "-çe" yapım ekidir, sonrasına kesme konmaz; doğru.`,`V: "öyle ki" bağlaçtır, ayrı; doğru. Yanlış olan I.`]}]},l_={id:`fiz-ozkutle`,ad:`Madde ve Özkütle`,dk:20,giris:`Aynı hacimde ne kadar madde var? Özkütle tanımı, kütle–hacim grafiği, karışımlar ve hacim ölçme.`,yan:{miktar:{ad:`Özkütleyi madde miktarına bağlamak`,anlat:`Özkütle maddenin kendisine ait, ayırt edici bir özelliktir. Aynı sıcaklık ve basınçta, maddenin ne kadar olduğuna bağlı değildir: kütle iki katına çıkarsa hacim de iki katına çıkar, oran değişmez.`,ornek:`Bir demir çubuk ikiye bölünürse her parçanın özkütlesi çubuğunkiyle aynıdır.`},tersoran:{ad:`Kütle ile hacmin yerini karıştırmak`,anlat:`Özkütle, kütlenin hacme bölümüdür. Birime bakmak yeterli: g/cm³, "gram bölü santimetreküp" demektir.`,ornek:`240 g ve 80 cm³ için d = {240//80} = 3 g/cm³ olur; {80//240} değil.`},birim:{ad:`Birim çevirmede yanılmak`,anlat:`1 g/cm³, 1000 kg/m³ eder. g/cm³ cinsinden değer kg/m³'e çevrilirken 1000 ile çarpılır.`,ornek:`Suyun özkütlesi 1 g/cm³ = 1000 kg/m³.`},eksen:{ad:`Grafikte eksenleri karıştırmak`,anlat:`Kütle düşey, hacim yatay eksendeyse doğrunun eğimi özkütleyi verir: dik olan daha yoğundur. Eksenler yer değiştirirse durum tersine döner. Önce eksenleri oku.`,ornek:`Aynı hacme karşılık kütlesi büyük olan maddenin özkütlesi büyüktür.`},ortalama:{ad:`Eşit hacim ile eşit kütleyi karıştırmak`,anlat:`Özkütlelerin ortalaması yalnızca eşit hacimli karışımda geçerlidir. Eşit kütleli ya da farklı miktarlı karışımda toplam kütle toplam hacme bölünür.`,ornek:`1 ve 3 g/cm³ için eşit hacimde 2 g/cm³, eşit kütlede 1,5 g/cm³ bulunur.`},topla:{ad:`Karışımda özkütleleri toplamak`,anlat:`Karışımın özkütlesi, karışan maddelerin özkütleleri arasında bir değerdir; ikisinden de büyük olamaz.`,ornek:`2 ve 4 g/cm³ özkütleli sıvıların karışımı 2 ile 4 arasında çıkar; 6 olamaz.`},seviye:{ad:`Su seviyesini cismin hacmi sanmak`,anlat:`Batan cismin hacmi, su seviyesindeki yükselme kadardır: son seviyeden ilk seviye çıkarılır.`,ornek:`Su 40 cm³ çizgisinden 70 cm³ çizgisine çıktıysa cismin hacmi 30 cm³'tür.`},kutle:{ad:`Taşan sıvıyı cismin kütlesine bağlamak`,anlat:`Tamamen batan bir cisim, kütlesi ne olursa olsun kendi hacmi kadar sıvının yerini değiştirir.`,ornek:`Aynı hacimli demir ve alüminyum bilyeler aynı miktarda su taşırır.`}},kartlar:[{id:`tanim`,baslik:`Özkütle nedir?`,metin:[`Özkütle, bir maddenin birim hacminin kütlesidir. Kütle hacme bölünerek bulunur; birimi g/cm³ ya da kg/m³'tür.`,`Saf maddeler için ayırt edici bir özelliktir: aynı sıcaklık ve basınçta, maddenin miktarı ne olursa olsun değişmez.`],kural:[`d = {m//V}`,`1 g/cm³ = 1000 kg/m³`],ornek:{s:`Kütlesi 200 g, hacmi 80 cm³ olan bir cismin özkütlesi kaç g/cm³'tür?`,a:[`d = {m//V} = {200//80}`,`Sonuç: 2,5 g/cm³`,`kg/m³ cinsinden: 2,5·1000 = 2500 kg/m³`]},baska:`Aynı boyda iki kutu düşün: biri pamukla, biri demirle dolu. Hacimleri eşit ama demir dolu olan çok daha ağır; çünkü demirin özkütlesi büyük. Özkütle, maddenin ne kadar sıkı paketlendiğini söyler.`,soru:{s:`Bir demir çubuk ikiye bölünürse parçaların özkütlesi nasıl olur?`,o:[`Yarıya iner`,`Değişmez`,`İki katına çıkar`],d:1,y:[`miktar`,null,`miktar`],neden:`Kütle de hacim de yarıya iner; oranları aynı kalır.`}},{id:`grafik`,baslik:`Kütle–hacim grafiği`,metin:[`Sabit sıcaklıkta bir maddenin kütlesi hacmiyle doğru orantılıdır. Kütle–hacim grafiği orijinden geçen bir doğrudur.`,`Kütle düşey, hacim yatay eksendeyse doğrunun eğimi özkütledir: doğru ne kadar dikse madde o kadar yoğundur.`],kural:[`eğim = {m//V} = d   (kütle düşey eksendeyken)`],ornek:{s:`Grafikte K için 20 cm³'e 60 g, L için 30 cm³'e 30 g karşılık geliyor. d_K / d_L kaçtır?`,a:[`d_K = {60//20} = 3 g/cm³`,`d_L = {30//30} = 1 g/cm³`,`d_K / d_L = 3`]},baska:`Grafikte aynı hacme, yani aynı düşey çizgiye bak. O hacimde hangisinin kütlesi fazlaysa o daha yoğundur. Eğim hesabına girmeden karşılaştırma yapmanın en hızlı yolu budur.`,soru:{s:`Kütle düşey, hacim yatay eksendeyken daha dik olan doğrunun özkütlesi nasıldır?`,o:[`Daha büyüktür`,`Daha küçüktür`,`Eşittir`],d:0,y:[null,`eksen`,null],neden:`Eğim {m//V} olduğundan dik doğru büyük özkütle demektir.`}},{id:`karisim`,baslik:`Karışımların özkütlesi`,metin:[`Karışımın özkütlesi, toplam kütlenin toplam hacme bölümüdür. Sonuç her zaman karışan maddelerin özkütleleri arasında kalır.`,`Eşit hacimde karıştırılırsa özkütlelerin ortalaması alınır. Eşit kütlede karıştırılırsa sonuç ortalamadan küçük çıkar, çünkü özkütlesi küçük olan daha çok yer kaplar.`],kural:[`d_{karışım} = {m_1 + m_2//V_1 + V_2}`,`Eşit hacim: {d_1 + d_2//2}`,`Eşit kütle: {2·d_1·d_2//d_1 + d_2}`],ornek:{s:`Özkütleleri 2 ve 6 g/cm³ olan iki sıvı eşit kütlede karıştırılırsa karışımın özkütlesi kaç olur?`,a:[`Her birinden 6 g alalım`,`Hacimler: {6//2} = 3 cm³ ve {6//6} = 1 cm³`,`Toplam kütle 12 g, toplam hacim 4 cm³`,`d = {12//4} = 3 g/cm³`]},baska:`Formül ezberlemek zorunda değilsin; kendine kolay sayılar seç. Eşit hacim deniyorsa her birinden 1 cm³ al, eşit kütle deniyorsa ikisinin de bölünebildiği bir kütle al. Sonra toplam kütleyi toplam hacme böl.`,soru:{s:`Özkütleleri 1 ve 3 g/cm³ olan iki sıvı eşit hacimde karıştırılırsa karışımın özkütlesi kaç g/cm³ olur?`,o:[`1,5`,`2`,`4`],d:1,y:[`ortalama`,null,`topla`],neden:`Eşit hacimde ortalama alınır: {1 + 3//2} = 2.`}},{id:`hacim`,baslik:`Hacim ölçme ve taşan sıvı`,metin:[`Düzgün olmayan bir katının hacmi sıvı yardımıyla ölçülür. Sıvıya tamamen batan cisim, kendi hacmi kadar sıvının yerini değiştirir.`,`Dereceli silindirde sıvı seviyesi cismin hacmi kadar yükselir. Ağzına kadar dolu bir kaptan ise cismin hacmi kadar sıvı taşar.`],kural:[`V_{cisim} = V_{son} − V_{ilk}`],ornek:{s:`50 cm³ su bulunan dereceli silindire 120 g'lık bir taş bırakılınca seviye 80 cm³ oluyor. Taşın özkütlesi kaçtır?`,a:[`Taşın hacmi: 80 − 50 = 30 cm³`,`d = {120//30}`,`Sonuç: 4 g/cm³`]},baska:`Küvete girdiğinde su yükselir. Yükselen su miktarı, vücudunun suya giren kısmının hacmidir; kilon bunu değiştirmez. Taş için de aynısı geçerli: su ne kadar yükseldiyse taşın hacmi o kadardır.`,soru:{s:`Suya tamamen batan iki bilyeden hacmi büyük olan için hangisi doğrudur?`,o:[`Daha çok su taşırır`,`Daha az su taşırır`,`Yalnızca kütlesi büyükse çok taşırır`],d:0,y:[null,null,`kutle`],neden:`Taşan su cismin hacmi kadardır; kütleye bağlı değildir.`}}],ozet:[`d = {m//V}. Birimler: g/cm³ ve kg/m³. 1 g/cm³ = 1000 kg/m³.`,`Özkütle ayırt edici özelliktir; madde miktarına bağlı değildir.`,`Kütle–hacim grafiğinde (kütle düşeyde) eğim özkütledir.`,`Karışım: toplam kütle bölü toplam hacim. Sonuç iki özkütlenin arasındadır.`,`Eşit hacimde ortalama alınır; eşit kütlede sonuç ortalamadan küçüktür.`,`Batan cismin hacmi, sıvı seviyesindeki yükselme kadardır.`],sorular:[{id:`s1`,z:1,kart:`tanim`,s:`Kütlesi 240 g, hacmi 80 cm³ olan bir cismin özkütlesi kaç g/cm³'tür?`,o:[`{1//3}`,`2`,`3`,`4`,`160`],d:2,y:[`tersoran`,null,null,null,null],c:[`d = {m//V}`,`d = {240//80}`,`Sonuç: 3 g/cm³`],h:`240 / 80 === 3`},{id:`s2`,z:1,kart:`tanim`,s:`Özkütlesi 2,5 g/cm³ olan bir maddenin özkütlesi kaç kg/m³'tür?`,o:[`0,0025`,`2,5`,`25`,`250`,`2500`],d:4,y:[`birim`,`birim`,`birim`,`birim`,null],c:[`1 g/cm³ = 1000 kg/m³`,`2,5·1000 = 2500`,`Sonuç: 2500 kg/m³`],h:`2.5 * 1000 === 2500`},{id:`s3`,z:1,kart:`tanim`,s:`Aynı maddeden yapılmış, aynı sıcaklıktaki X ve Y cisimlerinden X'in kütlesi Y'ninkinin 3 katıdır. X'in özkütlesinin Y'nin özkütlesine oranı kaçtır?`,o:[`{1//3}`,`1`,`3`,`6`,`9`],d:1,y:[`miktar`,null,`miktar`,null,null],c:[`Özkütle maddeye aittir; miktara bağlı değildir`,`Aynı madde, aynı sıcaklık: özkütleler eşit`,`Oran: 1`]},{id:`s4`,z:2,kart:`grafik`,s:`Bir kütle–hacim grafiğinde K sıvısı için 20 cm³'e 60 g, L sıvısı için 40 cm³'e 40 g karşılık gelmektedir. d_K / d_L oranı kaçtır?`,o:[`{1//3}`,`{2//3}`,`{3//2}`,`2`,`3`],d:4,y:[`tersoran`,null,null,null,null],c:[`d_K = {60//20} = 3 g/cm³`,`d_L = {40//40} = 1 g/cm³`,`d_K / d_L = 3`],h:`(60 / 20) / (40 / 40) === 3`},{id:`s5`,z:2,kart:`karisim`,s:`Özkütleleri 2 g/cm³ ve 4 g/cm³ olan, birbirine karışabilen iki sıvıdan eşit hacimde alınarak karışım yapılıyor. Karışımın özkütlesi kaç g/cm³'tür?`,o:[`{8//3}`,`3`,`3,5`,`6`,`8`],d:1,y:[`ortalama`,null,null,`topla`,null],c:[`Her birinden 1 cm³ alalım`,`Kütleler: 2 g ve 4 g; toplam 6 g`,`Toplam hacim: 2 cm³`,`d = {6//2} = 3 g/cm³`],h:`(2 + 4) / 2 === 3`},{id:`s6`,z:2,kart:`karisim`,s:`Özkütleleri 1 g/cm³ ve 3 g/cm³ olan iki sıvıdan eşit kütlede alınarak karışım yapılıyor. Karışımın özkütlesi kaç g/cm³'tür?`,o:[`1,5`,`2`,`2,5`,`3`,`4`],d:0,y:[null,`ortalama`,null,null,`topla`],c:[`Her birinden 3 g alalım`,`Hacimler: {3//1} = 3 cm³ ve {3//3} = 1 cm³`,`Toplam kütle 6 g, toplam hacim 4 cm³`,`d = {6//4} = 1,5 g/cm³`],h:`6 / (3 / 1 + 3 / 3) === 1.5`},{id:`s7`,z:2,kart:`hacim`,s:`İçinde 40 cm³ su bulunan dereceli silindire kütlesi 150 g olan bir taş bırakılıyor. Taş tamamen batıyor ve su seviyesi 70 cm³ çizgisine yükseliyor. Taşın özkütlesi kaç g/cm³'tür?`,o:[`2`,`{15//7}`,`3,75`,`5`,`6`],d:3,y:[null,`seviye`,`seviye`,null,null],c:[`Taşın hacmi: 70 − 40 = 30 cm³`,`d = {150//30}`,`Sonuç: 5 g/cm³`],h:`150 / (70 - 40) === 5`},{id:`s8`,z:3,kart:`karisim`,s:`Özkütlesi 1 g/cm³ olan sudan 300 cm³ ile özkütlesi 0,8 g/cm³ olan bir sıvıdan 200 cm³ karıştırılıyor. Karışımın özkütlesi kaç g/cm³'tür?`,o:[`0,88`,`0,90`,`0,92`,`0,95`,`1,8`],d:2,y:[null,`ortalama`,null,null,`topla`],c:[`Suyun kütlesi: 1·300 = 300 g`,`Sıvının kütlesi: 0,8·200 = 160 g`,`Toplam kütle 460 g, toplam hacim 500 cm³`,`d = {460//500} = 0,92 g/cm³`],h:`Math.abs((300 + 0.8 * 200) / 500 - 0.92) < 1e-9`}]},u_=`Örnek ders dosyası`,d_={id:`biy-bitki`,ad:`Bitki Hormonları ve Bitki Hareketleri`,dk:16,tdk:9,giris:`Bitkinin siniri de kası da yok; ama ışığa döner, kuraklıkta kendini korur, dokununca yaprağını kapatır. Bunu hormonlarla yapar. Bu konuda ışığı sen çevireceksin, ucu sen keseceksin; sonucu şeklin üstünde göreceksin.`,yer:{sinif:11,ders:`biy`,konu:`Bitkisel Hormonlar Bitkilerde Tepki Mekanizmaları (Tropizma, Nasti)`},kaynak:`Notlar ve ilk beş soru sınıfta kullanılan örnek ders dosyasından aktarıldı; görseller ve öteki sorular aynı notlara göre hazırlandı. Ders kitabı ve öğretim programıyla karşılaştırması henüz yapılmadı.`,yan:{golge:{ad:`Oksinin ışık alan tarafta biriktiğini sanmak`,anlat:`Oksin **gölgede kalan** tarafa gider. O taraf daha çok uzar; bitki bu yüzden öbür tarafa, yani ışığa doğru eğilir.`,ornek:`Işık sağdan geliyorsa oksin solda birikir, bitki sağa eğilir.`},baski:{ad:`Tepedeki oksinin yan dalları büyüttüğünü sanmak`,anlat:`Tepe tomurcuğundan gelen oksin yan tomurcukları **baskılar**. Uç kesilince baskı kalkar ve bitki yana dallanır.`},hormon:{ad:`Hormonların işlerini karıştırmak`,anlat:`Oksin hücreyi uzatır. Giberellin boğum arasını uzatır ve çimlenmeyi başlatır. Sitokinin hücreyi böldürür. Absisik asit kuraklıkta stomaları kapatır. Etilen meyveyi olgunlaştırır.`},grup:{ad:`Teşvik eden ve engelleyen hormonları karıştırmak`,anlat:`Büyümeyi teşvik edenler: oksin, giberellin, sitokinin. Engelleyenler: absisik asit ve etilen.`},zit:{ad:`Birbirinin tersini yapan hormonları karıştırmak`,anlat:`Giberellin çimlenmeyi başlatır ve uykuyu kırar; absisik asit tohumu uykuda tutar. Oksin yan tomurcukları baskılar; sitokinin onları uyarır.`},tropNasti:{ad:`Tropizma ile nastiyi karıştırmak`,anlat:`Tropizma yönelmedir: uyaranın yönüne göre, büyümeyle olur ve kalıcıdır. Nasti irkilmedir: uyaranın yönü fark etmez, turgor değişir ve hareket geri döner.`,ornek:`Sarmaşığın desteğe sarılması tropizma, küstüm otunun kapanması nastidir.`},onek:{ad:`Hareketin önekini karıştırmak`,anlat:`Önek uyaranı söyler: foto ışık, kemo kimyasal, hidro su, termo sıcaklık, sismo sarsıntı ya da dokunma, gravi yer çekimi, tigmo temas.`},isaret:{ad:`Pozitif ile negatifi karıştırmak`,anlat:`Pozitif, uyarana doğru demektir; negatif, uyarandan uzağa. Kök yer çekimine doğru büyür (pozitif), gövde tersine büyür (negatif).`},uc:{ad:`Işığı algılayan yeri yanlış bilmek`,anlat:`Uç kesilirse ya da ışık geçirmez bir başlıkla örtülürse fide eğilmez. Demek ki ışığı algılayan ve oksini üreten yer fidenin ucudur.`}},kartlar:[{id:`oksin`,baslik:`Oksin ve ışığa yönelme`,giris:`Pencere kenarındaki saksıya birkaç gün sonra bak: bitki cama doğru eğilmiştir. Gözü yok, kası yok. Peki nasıl dönüyor?`,gorsel:{tip:`isik`},metin:[`Bitkide büyümeyi **hormonlar** yönetir. İlki **oksin**: gövde ucunda, genç yapraklarda ve tohumda üretilir. Asıl işi **hücreleri uzatmaktır**.`,`**Fototropizma (ışığa yönelme):** oksin gölgede kalan tarafa gider. O taraf daha çok uzar ve bitki ışığa doğru eğilir.`,`Oksinin öteki işleri: çelikte kök oluşturur, çekirdeksiz meyve oluşumunu sağlar (partenokarpi), yüksek dozu yabani ot ilacı olarak kullanılır. Kök oksine gövdeden çok daha hassastır: gövdeyi uzatan miktar kökü yavaşlatır.`],kural:[`Oksin gölgede kalan tarafa gider → o taraf daha çok uzar → bitki ışığa eğilir.`],baska:`Yan yana yürüyen bir sıra düşün. Sol uçtakiler uzun adım atarsa sıra sağa döner. Gövdede de böyle olur: gölgede kalan taraftaki hücreler daha çok uzar, gövde öbür tarafa, yani ışığa doğru kıvrılır.`,soru:{s:`Işık bir fideye yalnızca sağdan geliyor. Oksin hangi tarafta birikir?`,o:[`Sağda, ışık alan tarafta`,`Solda, gölgede kalan tarafta`,`İki tarafta eşit`],d:1,y:[`golge`,null,`golge`],neden:`Oksin gölgede kalan tarafa gider. O taraf daha çok uzar ve fide ışığa, yani sağa eğilir.`}},{id:`tepe`,baslik:`Tepe tomurcuğu neden baskındır?`,giris:`Bahçıvan bir çalının ucunu budar. Çalı bundan sonra boyuna değil, yana doğru dallanır ve sıklaşır.`,gorsel:{tip:`tepe`},metin:[`**Apikal dominans (tepe baskınlığı):** tepe tomurcuğundan gelen oksin, alttaki yan tomurcukları baskılar. Bitki önce boyuna uzar.`,`Ucu kesersen oksinin kaynağı gider, baskı kalkar ve bitki yana dallanır.`],kural:[`Tepeden gelen oksin yan tomurcukları baskılar.`,`Uç kesilirse baskı kalkar: bitki yana dallanır.`],baska:`Bir toplantıda sözü hiç bırakmayan birini düşün: o konuşurken ötekiler söz alamaz. O çıkınca herkes konuşmaya başlar. Tepe tomurcuğu oksinle yan tomurcukları susturur; uç kesilince yan tomurcuklar büyümeye başlar.`,soru:{s:`Tepe tomurcuğu kesilen bir bitkide ne olur?`,o:[`Bitki daha hızlı boy atar`,`Yan tomurcuklar gelişir, bitki yana dallanır`,`Bitkinin büyümesi tümüyle durur`],d:1,y:[`baski`,null,null],neden:`Tepeden gelen oksinin baskısı kalkar; yan tomurcuklar gelişir ve bitki yana dallanır.`}},{id:`gs`,baslik:`Giberellin ve sitokinin`,giris:`Bir tohum toprağın altında uzun süre uykuda bekleyebilir. Sonra uyanır ve çimlenir. Onu uyandıran bir hormondur.`,metin:[`**Giberellin:** boğum aralarını uzatır (cüce bitkiyi uzatır), çimlenmeyi başlatır, tohumun uykusunu (dormansi) kırar, çiçeklenmeyi ve meyve büyümesini sağlar.`,`**Sitokinin:** kökte üretilir. Hücre bölünmesini sağlar, yaşlanmayı geciktirir, yan tomurcukları uyarır. Tepe baskınlığında oksinin tersini yapar.`],tablo:{ad:`Büyümeyi teşvik eden üç hormon`,bas:[`Hormon`,`Asıl işi`,`Aklında kalsın`],sat:[[`Oksin`,`Hücre uzaması`,`Işığa yönelme, tepe baskınlığı`],[`Giberellin`,`Boğum arası uzaması, çimlenme`,`Cüce bitkiyi uzatır, uykuyu kırar`],[`Sitokinin`,`Hücre bölünmesi`,`Yaşlanmayı geciktirir, yan tomurcukları uyarır`]]},gorsel:{tip:`eslestir`,ad:`Hormonu işiyle eşleştir`,cift:[[`Oksin`,`Hücreyi uzatır`],[`Giberellin`,`Tohumun uykusunu kırar`],[`Sitokinin`,`Hücreyi böldürür`]]},kural:[`Giberellin: boyu uzatır, tohumu uyandırır.`,`Sitokinin: hücreyi böldürür, yaşlanmayı geciktirir.`],baska:`Üç hormonu üç ustaya benzet. Oksin hücreleri **uzatan** usta. Giberellin bitkiyi **boyuna çeken** ve tohumu **uyandıran** usta. Sitokinin hücreleri **çoğaltan** ve bitkiyi **genç tutan** usta.`,soru:{s:`Hücre bölünmesini sağlayan ve yaşlanmayı geciktiren hormon hangisidir?`,o:[`Giberellin`,`Sitokinin`,`Oksin`],d:1,y:[`hormon`,null,`hormon`],neden:`Sitokinin hücre bölünmesini sağlar ve yaşlanmayı geciktirir. Giberellin boğum aralarını, oksin hücreleri uzatır.`}},{id:`engel`,baslik:`Absisik asit ve etilen`,giris:`Meyve kasasında tek bir çürük elma kalırsa birkaç gün sonra bütün kasa bozulur. Elmalar birbirine dokunmadan bunu nasıl yapıyor?`,metin:[`**Etilen** gaz hâlindeki tek hormondur. Meyveyi olgunlaştırır; yaprak, çiçek ve meyve dökülmesini sağlar; yaşlanmaya yol açar. Bir çürük elmanın bütün kasayı bozması bu yüzdendir.`,`**Absisik asit (ABA)** stres hormonudur. Kuraklıkta stomaları kapatır, tohum ve tomurcukta uykuyu (dormansi) sağlar, büyümeyi engeller. Giberellinin tersini yapar.`,`Sınav klasiği: büyümeyi **teşvik edenler** oksin, giberellin ve sitokinin; **engelleyenler** absisik asit ve etilen.`],gorsel:{tip:`grupla`,ad:`Teşvik mi eder, engeller mi?`,kutu:[`Büyümeyi teşvik eder`,`Büyümeyi engeller`],oge:[[`Oksin`,0],[`Absisik asit`,1],[`Giberellin`,0],[`Etilen`,1],[`Sitokinin`,0]]},kural:[`Teşvik edenler: oksin, giberellin, sitokinin`,`Engelleyenler: absisik asit, etilen`],baska:`Bitkiyi bir arabaya benzet. Oksin, giberellin ve sitokinin **gaz pedalıdır**: büyümeyi hızlandırır. Absisik asit ve etilen **frendir**: kuraklıkta stomaları kapatır, tohumu uykuda tutar, yaprağı döker. Bitki koşullara ikisini birlikte kullanarak uyar.`,soru:{s:`Gaz hâlinde olan ve meyveyi olgunlaştıran hormon hangisidir?`,o:[`Absisik asit`,`Etilen`,`Giberellin`],d:1,y:[`hormon`,null,`hormon`],neden:`Etilen gaz hâlindeki tek hormondur ve meyveyi olgunlaştırır.`}},{id:`ad`,baslik:`Hareketin adını çöz`,giris:`Fototropizma, sismonasti, hidrotropizma… Bu adları tek tek ezberlemene gerek yok. Hepsi iki parçadan oluşur; parçaları bilirsen adı kendin çözersin.`,gorsel:{tip:`hareket-adi`},metin:[`Ad = **önek + son ek**. Önek **uyaranı**, son ek **hareketin türünü** söyler.`,`**-tropizma** yönelme demek: bitki uyaranın yönüne doğru ya da tersine büyür. Büyümeyle olur, kalıcıdır. **-nasti** irkilme demek: uyaranın yönü fark etmez, hücredeki su basıncı (turgor) değişir, hareket geri döner.`,`Yönelmede bir de işaret vardır: **pozitif** uyarana doğru, **negatif** uyarandan uzağa.`],tablo:{ad:`Önekler`,bas:[`Önek`,`Uyaran`],sat:[[`foto`,`ışık`],[`kemo`,`kimyasal`],[`hidro`,`su`],[`termo`,`sıcaklık`],[`sismo`,`sarsıntı, dokunma`],[`gravi ya da jeo`,`yer çekimi`],[`tigmo`,`temas`]]},kural:[`-tropizma: yönelme. Yöne bağlıdır, büyümeyle olur, kalıcıdır.`,`-nasti: irkilme. Yönden bağımsızdır, turgorla olur, geri döner.`],baska:`Adı bir adres gibi oku. Önek "neye tepki?" sorusunu, son ek "nasıl tepki?" sorusunu yanıtlar. Termo-nasti: sıcaklığa, yönden bağımsız ve geri dönen bir tepki. Hidro-tropizma: suya, yönüne göre büyüyerek verilen kalıcı bir tepki.`,soru:{s:`"Termonasti" adındaki "termo" öneki neyi söyler?`,o:[`Uyaranın sıcaklık olduğunu`,`Hareketin kalıcı olduğunu`,`Uyaranın ışık olduğunu`],d:0,y:[null,`tropNasti`,`onek`],neden:`Önek uyaranı söyler: termo sıcaklık demektir. Hareketin türünü son ek söyler.`}},{id:`tropizma`,baslik:`Tropizmalar: yönelerek büyüme`,giris:`Bir tohumu toprağa hangi yönde bırakırsan bırak kökü aşağı, gövdesi yukarı gider. Sarmaşık ise bulduğu desteğe sarılarak tırmanır.`,metin:[`Tropizmada bitki **uyaranın yönüne göre** büyür.`,`**Fototropizma:** saksıdaki bitki pencereye eğilir (gövde pozitif). **Kemotropizma:** polen tüpü yumurtaya doğru uzar. **Hidrotropizma:** kök suya yönelir. **Gravitropizma:** kök aşağı (pozitif), gövde yukarı (negatif) büyür. **Tigmotropizma:** sarmaşık desteğe sarılır.`],gorsel:{tip:`eslestir`,ad:`Örneği adıyla eşleştir`,cift:[[`Bitki pencereye eğilir`,`Fototropizma`],[`Polen tüpü yumurtaya uzar`,`Kemotropizma`],[`Kök suya yönelir`,`Hidrotropizma`],[`Kök aşağı, gövde yukarı büyür`,`Gravitropizma`],[`Sarmaşık desteğe sarılır`,`Tigmotropizma`]]},kural:[`Pozitif: uyarana doğru. Negatif: uyarandan uzağa.`,`Kök yer çekimine pozitif, gövde negatif yönelir.`],baska:`Her tropizmada kendine iki soru sor: Uyaran ne? Bitki ona doğru mu, ters yöne mi büyüyor? Kök aşağı iner: uyaran yer çekimi, yön ona doğru; pozitif gravitropizma. Gövde yukarı çıkar: uyaran yine yer çekimi, yön ters; negatif gravitropizma.`,soru:{s:`Gövdenin yer çekiminin tersine, yukarı doğru büyümesi hangi harekettir?`,o:[`Pozitif gravitropizma`,`Negatif gravitropizma`,`Negatif fototropizma`],d:1,y:[`isaret`,null,`onek`],neden:`Uyaran yer çekimidir: gravi. Gövde uyarandan uzağa büyür: negatif. Işığa göre bakılsaydı gövde ışığa doğru büyür, yani pozitif fototropizma olurdu.`}},{id:`nasti`,baslik:`Nastiler: irkilme hareketleri`,giris:`Küstüm otuna dokunursan yaprakları hemen kapanır, bir süre sonra kendiliğinden yeniden açılır. Nereden dokunduğun fark etmez.`,metin:[`Nastide uyaranın **yönü önemli değildir**. Hareket büyümeyle değil, hücredeki su basıncının (turgor) değişmesiyle olur; bu yüzden **geri döner**.`,`**Fotonasti:** akşamsefası akşam açar. **Termonasti:** lale sıcakta açılır, soğukta kapanır. **Sismonasti:** küstüm otu dokununca yapraklarını kapatır.`],gorsel:{tip:`grupla`,ad:`Tropizma mı, nasti mi?`,kutu:[`Tropizma`,`Nasti`],oge:[[`Bitki pencereye eğilir`,0],[`Küstüm otu yapraklarını kapatır`,1],[`Sarmaşık desteğe sarılır`,0],[`Lale sıcakta açılır`,1],[`Kök suya yönelir`,0],[`Akşamsefası akşam açar`,1]]},kural:[`Kalıcıysa ve yöne bağlıysa: tropizma.`,`Geri dönüyorsa ve yön fark etmiyorsa: nasti.`],baska:`İki soru yeter. Uyaranın geldiği yön sonucu değiştiriyor mu? Hareket geri dönüyor mu? Küstüm otu nereden dokunursan dokun kapanır ve sonra açılır: nasti. Sarmaşık desteğin olduğu yöne doğru büyür ve öyle kalır: tropizma.`,soru:{s:`Lalenin sıcakta açılıp soğukta kapanması hangi harekettir?`,o:[`Termonasti`,`Fotonasti`,`Fototropizma`],d:0,y:[null,`onek`,`tropNasti`],neden:`Uyaran sıcaklıktır: termo. Hareket geri döner ve yönden bağımsızdır: nasti.`}},{id:`deney`,baslik:`Koleoptil deneyi: ışığı kim algılıyor?`,giris:`Bitkinin ışığa eğildiğini gördün. Peki ışığı bitkinin neresi fark ediyor: ucu mu, gövdesi mi? Bunu anlamanın yolu bir deney kurmaktır.`,gorsel:{tip:`isik`,deney:!0},metin:[`Üç fideye aynı yönden ışık verilir. Birincinin ucu **açık** bırakılır, ikincinin ucu **kesilir**, üçüncünün ucu ışık geçirmez bir başlıkla **örtülür**.`,`Sonuç: yalnızca ucu açık olan fide ışığa eğilir. Ucu kesilen ve ucu örtülen fide eğilmez.`,`Demek ki ışığı algılayan ve oksini üreten yer fidenin **ucudur**.`],kural:[`Uç kesilir ya da örtülürse fide eğilmez.`,`Işığı algılayan ve oksini üreten yer: uç.`],baska:`Bir şeyin etkili olup olmadığını anlamak için onu ortadan kaldırır, neyin değiştiğine bakarsın. Ucu kestin: eğilme bitti. Ucu kesmeden yalnızca ışığını kestin: eğilme yine bitti. İkisi birlikte şunu söyler: uç hem yerinde olmalı hem ışığı görmeli.`,soru:{s:`Ucu ışık geçirmez başlıkla örtülen fide neden eğilmez?`,o:[`Uç ışığı algılayamadığı için`,`Başlık fideyi ağırlaştırdığı için`,`Gövde ışık alamadığı için`],d:0,y:[null,null,`uc`],neden:`Işığı algılayan yer uçtur. Uç örtülünce ışığın hangi yönden geldiği algılanmaz ve fide eğilmez.`}}],ozet:[`Oksin hücreyi uzatır. Gölgede kalan tarafa gider, o taraf daha çok uzar, bitki ışığa eğilir.`,`Tepe tomurcuğundan gelen oksin yan tomurcukları baskılar; uç kesilirse bitki yana dallanır.`,`Giberellin boyu uzatır ve tohumu uyandırır. Sitokinin hücreyi böldürür ve yaşlanmayı geciktirir.`,`Absisik asit kuraklıkta stomaları kapatır. Etilen gaz hâlindedir ve meyveyi olgunlaştırır.`,`Teşvik edenler: oksin, giberellin, sitokinin. Engelleyenler: absisik asit, etilen.`,`Tropizma: yöne bağlı, büyümeyle olur, kalıcı. Nasti: yönden bağımsız, turgorla olur, geri döner.`,`Koleoptil deneyi: ışığı algılayan ve oksini üreten yer fidenin ucudur.`],sorular:[{id:`s1`,z:1,kart:`oksin`,s:`Tek taraftan ışık alan bir fidede oksin nasıl dağılır ve sonuç ne olur?`,o:[`Işık alan tarafta birikir, bitki ışıktan uzaklaşır`,`Gölgede kalan tarafta birikir, o taraf uzar ve bitki ışığa eğilir`,`Eşit dağılır, bitki dik büyür`,`Köke taşınır, gövde büyümesi durur`,`Işık alan tarafta birikir, o taraf uzar ve bitki ışığa eğilir`],d:1,y:[`golge`,null,null,null,`golge`],ip:`Hangi taraf daha çok uzarsa bitki ters yöne eğilir.`,c:[`Oksin gölgede kalan tarafa gider.`,`Oksin hücreleri uzatır: gölgedeki taraf daha çok uzar.`,`Bir taraf daha çok uzayınca gövde öbür tarafa, yani ışığa doğru eğilir.`],kay:`${u_}, 1. soru (beşinci seçenek eklendi)`},{id:`s2`,z:2,kart:`tepe`,s:`Bir bitkinin tepe tomurcuğu kesilince yan dallar hızla gelişiyor. Bunun sebebi nedir?`,o:[`Etilen üretiminin artması`,`Absisik asidin yan tomurcuklara gitmesi`,`Tepeden gelen oksinin yan tomurcukları daha çok uyarması`,`Tepeden gelen oksinin yan tomurcuklar üzerindeki baskısının kalkması`,`Giberellinin azalması`],d:3,y:[`hormon`,`hormon`,`baski`,null,`hormon`],c:[`Tepe tomurcuğundan gelen oksin yan tomurcukları baskılar: apikal dominans.`,`Uç kesilince oksinin kaynağı gider ve baskı kalkar.`,`Sitokininin de etkisiyle yan tomurcuklar gelişir, bitki yana dallanır.`],kay:`${u_}, 2. soru (beşinci seçenek eklendi)`},{id:`s3`,z:1,kart:`engel`,s:`Kuraklık stresinde stomaların kapanmasını sağlayan hormon hangisidir?`,o:[`Absisik asit`,`Sitokinin`,`Giberellin`,`Oksin`,`Etilen`],d:0,y:[null,`hormon`,`zit`,`hormon`,`hormon`],c:[`Kuraklık bitki için bir strestir; stres hormonu absisik asittir.`,`Absisik asit stomaları kapatır.`],kay:`${u_}, 3. soru (beşinci seçenek eklendi)`},{id:`s4`,z:2,kart:`engel`,s:`Aşağıdakilerden hangisi büyümeyi genel olarak engelleyen hormon grubudur?`,o:[`Oksin ve giberellin`,`Sitokinin ve oksin`,`Absisik asit ve etilen`,`Giberellin ve sitokinin`,`Absisik asit ve sitokinin`],d:2,y:[`grup`,`grup`,null,`grup`,`grup`],c:[`Büyümeyi teşvik edenler: oksin, giberellin, sitokinin.`,`Geriye kalan ikisi büyümeyi engeller: absisik asit ve etilen.`],kay:`${u_}, 4. soru (beşinci seçenek eklendi)`},{id:`s5`,z:2,kart:`nasti`,s:`Küstüm otunun dokununca yapraklarını kapatması hangi harekettir?`,o:[`Tigmotropizma`,`Sismonasti`,`Fototropizma`,`Gravitropizma`,`Termonasti`],d:1,y:[`tropNasti`,null,`tropNasti`,`tropNasti`,`onek`],ip:`Kalıcı mı, geri dönüşümlü mü?`,c:[`Yapraklar sonra yeniden açılır ve dokunmanın yönü fark etmez: hareket bir nastidir.`,`Uyaran sarsıntı ya da dokunmadır: önek sismo.`,`Sismonasti. Sarmaşığın desteğe sarılması ise kalıcıdır: tigmotropizma.`],kay:`${u_}, 5. soru (beşinci seçenek eklendi)`},{id:`s6`,z:1,kart:`gs`,b:[`Bir tohum uygun koşullar oluşana kadar uykuda (dormansi) bekliyor.`],s:`Tohumun uykusunu kırıp çimlenmeyi başlatan hormon hangisidir?`,o:[`Absisik asit`,`Etilen`,`Sitokinin`,`Oksin`,`Giberellin`],d:4,y:[`zit`,`hormon`,`hormon`,`hormon`,null],ip:`Tohumu uykuda tutan hormon ile uyandıran hormon birbirinin tersini yapar.`,c:[`Tohumu uykuda tutan hormon absisik asittir.`,`Giberellin onun tersini yapar: uykuyu kırar ve çimlenmeyi başlatır.`],kay:`${u_}, giberellin ve absisik asit notlarına göre yazıldı`},{id:`s7`,z:2,kart:`ad`,s:`Adı "hidrotropizma" olan bir hareket için hangisi söylenebilir?`,o:[`Bitki suya göre yönelir; hareket büyümeyle olur ve kalıcıdır`,`Bitki suya yönden bağımsız tepki verir; hareket geri döner`,`Bitki ışığa göre yönelir; hareket büyümeyle olur ve kalıcıdır`,`Bitki sıcaklığa yönden bağımsız tepki verir; hareket geri döner`,`Bitki yer çekimine göre yönelir; hareket büyümeyle olur ve kalıcıdır`],d:0,y:[null,`tropNasti`,`onek`,`onek`,`onek`],ip:`Adı ikiye böl: hidro + tropizma.`,c:[`Önek uyaranı söyler: hidro su demektir.`,`Son ek hareketin türünü söyler: -tropizma yönelmedir; büyümeyle olur ve kalıcıdır.`,`Demek ki bitki suyun yönüne göre büyür ve bu hareket kalıcıdır.`],kay:`${u_}, "önek + son ek" notuna göre yazıldı`},{id:`s8`,z:2,kart:`tropizma`,s:`Bir bitkinin kökü aşağı, gövdesi yukarı doğru büyüyor. Bu durum hangisiyle doğru adlandırılır?`,o:[`Kök negatif, gövde pozitif gravitropizma`,`Kök de gövde de pozitif gravitropizma`,`Kök pozitif, gövde negatif fototropizma`,`Kök pozitif, gövde negatif gravitropizma`,`Kök de gövde de negatif gravitropizma`],d:3,y:[`isaret`,`isaret`,`onek`,null,`isaret`],c:[`Aşağı ve yukarı yönünü belirleyen uyaran yer çekimidir: gravitropizma.`,`Kök yer çekimine doğru büyür: pozitif.`,`Gövde yer çekiminin tersine büyür: negatif.`],kay:`${u_}, tropizma örneklerine göre yazıldı`},{id:`s9`,z:3,kart:`deney`,b:[`Üç fideye aynı yönden ışık veriliyor. Birinci fidenin ucu açık, ikincinin ucu kesilmiş, üçüncünün ucu ışık geçirmez bir başlıkla örtülmüş. Yalnızca birinci fide ışığa doğru eğiliyor.`],s:`Bu deneyden hangi sonuç çıkar?`,o:[`Işığı fidenin gövdesi algılar`,`Fide ışık olmadan büyüyemez`,`Işığı algılayan ve oksini üreten yer fidenin ucudur`,`Ucu kesilen fide ışıktan uzaklaşır`,`Oksin yalnızca kökte üretilir`],d:2,y:[`uc`,null,null,null,`uc`],c:[`Ucu kesilen fide eğilmiyor: eğilme için uç gerekli.`,`Ucu örtülen fidenin gövdesi ışık aldığı hâlde fide eğilmiyor: ışığı gövde değil, uç algılıyor.`,`Sonuç: ışığı algılayan ve oksini üreten yer fidenin ucudur.`],kay:`${u_}, koleoptil deneyi notuna göre yazıldı`}]},f_=`Örnek ders dosyası`,p_={id:`biy-noron`,ad:`Nöron ve Sinyal İletimi`,dk:14,tdk:8,giris:`Sinir hücresi bilgiyi nasıl alır, nasıl taşır, bir sonraki hücreye nasıl verir? Bu konuda her şeyi şeklin üstünde deneyerek göreceksin: uyartıyı sen göndereceksin, iyonları sen hareket ettireceksin.`,yer:{sinif:11,ders:`biy`,konu:`Uyartıların Alınması (Reseptörler, Uyaran Çeşitleri), Nöronların Yapısı, Nöronlarda Sinyal İletimi ve Sinaps, Duyu Organları`},kaynak:`Notlar ve ilk beş soru sınıfta kullanılan örnek ders dosyasından aktarıldı; görseller ve öteki sorular aynı notlara göre hazırlandı. Ders kitabı ve öğretim programıyla karşılaştırması henüz yapılmadı.`,yan:{tur:{ad:`Nöron çeşitlerini karıştırmak`,anlat:`Duyu nöronu bilgiyi merkeze **getirir**. Motor nöron komutu merkezden **götürür**. Ara nöron ikisinin arasındadır: beyin ve omurilikte bilgiyi değerlendirir.`,ornek:`Merkeze giden: duyu. Merkezden çıkan: motor.`},yon:{ad:`Uyartının yönünü ters çevirmek`,anlat:`Bilgi hep aynı yönde akar: dendrit → gövde → akson → akson ucu. Dendrit alır, akson taşır, akson ucu verir.`,ornek:`Dendrit giriş, akson ucu çıkıştır.`},karistir:{ad:`Depolarizasyon ile repolarizasyonu karıştırmak`,anlat:`Depolarizasyonda Na⁺ içeri girer ve içerisi + olur. Repolarizasyonda K⁺ dışarı çıkar ve içerisi yine − olur.`,ornek:`Kısa yol: Na girer, bozulur; K çıkar, düzelir.`},miyelin:{ad:`Uyartının miyelin üzerinde oluştuğunu sanmak`,anlat:`Miyelin kaplamadır: kaplamalı yerlerden iyon geçemez. Uyartı yalnızca kaplamanın kesildiği Ranvier boğumlarında oluşur ve boğumdan boğuma atlar.`},orantili:{ad:`Güçlü uyarının daha büyük uyartı oluşturduğunu sanmak`,anlat:`Ya hep ya hiç: eşik geçilmezse uyartı hiç oluşmaz, geçilirse tam oluşur. Uyarıyı güçlendirmek uyartının büyüklüğünü değiştirmez.`,ornek:`Işık düğmesi: ya açık ya kapalı.`},elektrik:{ad:`Elektriğin sinaps boşluğunu geçtiğini sanmak`,anlat:`İki nöron birbirine değmez; elektrik boşluktan atlayamaz. Boşluğu, akson ucundaki keseciklerden salınan nörotransmitter geçer.`},sinapsHiz:{ad:`Sinapsın iletimi hızlandırdığını sanmak`,anlat:`Hızlandıran miyelindir. Sinapsta iletim kimyasaldır ve yavaşlar; yolda ne kadar çok sinaps varsa tepki o kadar geç oluşur.`},kesecik:{ad:`Tek yönlülüğün sebebini yanlış yerde aramak`,anlat:`Sinapsta iletim tek yönlüdür, çünkü nörotransmitter kesecikleri yalnızca akson ucunda, reseptörler ise sonraki nöronun dendritinde bulunur.`}},kartlar:[{id:`ne`,baslik:`Nöron ne iş yapar?`,giris:`Telefonun cebinde titrer, elin cebine gider. Arada ne oldu? Derindeki bir alıcı uyarıldı, bilgi merkeze gitti, merkezden kasa bir komut geldi.`,metin:[`Nöron sinir hücresi demek. Vücudun **kablosu** gibi düşün: bilgiyi bir yerden bir yere **elektrikle** taşır.`,`Tepki hep aynı sırayla oluşur: uyaran → reseptör → duyu nöronu → beyin ya da omurilik (ara nöron) → motor nöron → kas ya da bez.`],tablo:{ad:`Nöron çeşitleri`,bas:[`Nöron`,`Ne yapar?`],sat:[[`Duyu nöronu`,`Reseptörden merkeze bilgi taşır.`],[`Ara nöron`,`Beyin ve omurilikte bilgiyi değerlendirir.`],[`Motor nöron`,`Merkezden kas ya da beze komut götürür.`]]},gorsel:{tip:`sirala`,ad:`Tepkinin yolunu sırala`,oge:[`Uyaran`,`Reseptör`,`Duyu nöronu`,`Ara nöron`,`Motor nöron`,`Kas ya da bez`]},kural:[`uyaran → reseptör → duyu nöronu → ara nöron → motor nöron → kas ya da bez`],baska:`Bir okul düşün. Kapıdaki görevli (reseptör) gelen haberi alır ve bir öğrenciyle (duyu nöronu) müdüre yollar. Müdür (ara nöron) haberi değerlendirir, kararını başka bir öğrenciyle (motor nöron) işi yapacak kişiye (kas) gönderir. Haber hep aynı yönde ilerler.`,soru:{s:`Merkezden kasa komut götüren nöron hangisidir?`,o:[`Duyu nöronu`,`Ara nöron`,`Motor nöron`],d:2,y:[`tur`,`tur`,null],neden:`Motor nöron, merkezden kas ya da beze komut götürür. Duyu nöronu ise bilgiyi merkeze getirir.`}},{id:`parca`,baslik:`Nöronun parçaları`,giris:`Bir kulaklık kablosuna bak: bir ucunda fiş, ortada kaplamalı uzun bir tel, öbür ucunda hoparlör. Nöron da böyle parçalardan oluşur ve her parçanın işi ayrıdır.`,gorsel:{tip:`noron`},metin:[`**Dendrit** girişteki antenlerdir, bilgiyi alır. **Hücre gövdesi** merkezdir, çekirdek buradadır. **Akson** uzun kablodur, bilgiyi taşır. **Miyelin kılıf** kablonun üstündeki kaplamadır. **Akson ucu** bilgiyi sonraki hücreye verir.`,`Bilgi hep aynı yönde akar: dendrit → gövde → akson → akson ucu.`],kural:[`dendrit → hücre gövdesi → akson → akson ucu`],baska:`Nöronu bir ağaca benzet. Dallar (dendritler) dışarıdan geleni toplar, gövde hepsini bir araya getirir, uzun kök (akson) bunu uzağa taşır, kökün uçları (akson uçları) bir sonraki ağaca verir. Yön hiç değişmez: daldan köke.`,soru:{s:`Uyartıyı alan, "girişteki anten" görevi gören parça hangisidir?`,o:[`Akson`,`Dendrit`,`Akson ucu`],d:1,y:[`yon`,null,`yon`],neden:`Dendrit uyartıyı alır. Akson uyartıyı taşır, akson ucu sonraki hücreye verir.`}},{id:`uyarti`,baslik:`Uyartı nasıl oluşur?`,giris:`Bir pilin iki ucu arasında yük farkı vardır; bu fark sayesinde iş yapar. Nöronun zarı da küçük bir pil gibidir: içi ile dışı arasında yük farkı vardır.`,gorsel:{tip:`aksiyon`},metin:[`Hücrenin içinde ve dışında **iyon** denen, elektrik yüklü minik parçacıklar var. İki tanesi önemli: **Na⁺ (sodyum)** ve **K⁺ (potasyum)**. İkisi de artı yüklü ve hücrenin içiyle dışında eşit dağılmamış.`,`**Polarizasyon (bekleme):** dışarıda çok Na⁺ var; bu yüzden dışı +, içi −. **Depolarizasyon (uyarı geldi):** kapılar açılır, Na⁺ içeri dalar, içerisi + olur. "De-" bozmak demek; uyartı tam olarak budur. **Repolarizasyon (eski hâle dönüş):** K⁺ dışarı çıkar, içerisi yine − olur. "Re-" yeniden demek.`,`Sonra hücre enerji harcayarak (ATP) iyonları eski yerlerine taşır ve nöron yeni uyarıya hazır olur.`],tablo:{ad:`Üç aşama yan yana`,bas:[`Aşama`,`Hangi iyon hareket eder?`,`Hücrenin içi`],sat:[[`Polarizasyon (bekleme)`,`Hareket yok; dışarıda çok Na⁺ var`,`−`],[`Depolarizasyon`,`Na⁺ içeri girer`,`+`],[`Repolarizasyon`,`K⁺ dışarı çıkar`,`−`]]},kural:[`Na girer, bozulur; K çıkar, düzelir.`],baska:`Kapıları kapalı bir salon düşün: kalabalık dışarıda bekliyor (Na⁺ dışarıda). Kapı açılınca kalabalık içeri dalar ve salonun durumu bir anda değişir (depolarizasyon). Sonra arka kapıdan başka bir grup (K⁺) dışarı çıkar, salon eski dengesine döner (repolarizasyon). En sonda görevliler herkesi ilk yerine götürür; bu iş emek ister (ATP).`,soru:{s:`Repolarizasyon sırasında ne olur?`,o:[`Na⁺ içeri girer, içerisi + olur`,`K⁺ dışarı çıkar, içerisi − olur`,`Na⁺ dışarı çıkar, içerisi + olur`],d:1,y:[`karistir`,null,`karistir`],neden:`K⁺ dışarı çıkar ve içerisi yine − olur. Na⁺ iyonunun içeri girmesi depolarizasyondur.`}},{id:`iletim`,baslik:`Uyartı aksonda nasıl ilerler?`,giris:`Stadyumda dalga yapılırken kimse yerinden koşmaz: herkes sırayla kalkıp oturur, dalga tribün boyunca ilerler.`,gorsel:{tip:`iletim`},metin:[`Uyartı aksonda **stadyum dalgası** gibi ilerler: her nokta sırayla depolarize ve repolarize olur, dalga kablo boyunca akar.`,`**Miyelin neden hızlandırır?** Kaplamalı yerlerden iyon geçemez; olay yalnızca aradaki boşluklarda, yani **Ranvier boğumlarında** olur. Uyartı boğumdan boğuma **atlar**. Bu yüzden miyelinli nöron çok daha hızlı iletir.`],kural:[`Miyelinli aksonda uyartı Ranvier boğumlarından atlayarak ilerler: iletim hızlanır.`],baska:`Bir dereyi geçmenin iki yolu var: ya suyun içinde adım adım yürürsün ya da taşların üstünden atlarsın. Miyelinsiz aksonda uyartı her noktaya tek tek uğrar. Miyelinli aksonda yalnızca boğumlara basar, aradaki kaplamalı kısımları atlar.`,soru:{s:`Miyelinli bir aksonda uyartı nerede oluşur?`,o:[`Yalnızca Ranvier boğumlarında`,`Miyelin kılıfın üstünde`,`Aksonun her noktasında`],d:0,y:[null,`miyelin`,`miyelin`],neden:`Kaplamalı yerlerden iyon geçemez; uyartı yalnızca boğumlarda oluşur ve boğumdan boğuma atlar.`}},{id:`hep`,baslik:`Ya hep ya hiç`,giris:`Bir ışık düğmesine hafifçe dokunursan lamba yanmaz. Yeterince bastığında yanar; daha sert basmak lambayı daha parlak yapmaz.`,gorsel:{tip:`esik`},metin:[`Nöron da böyle çalışır. Uyarı **eşik değeri** geçmezse uyartı hiç oluşmaz. Geçerse tam oluşur.`,`Uyarıyı daha da güçlendirmek uyartıyı büyütmez. Buna **ya hep ya hiç kuralı** denir.`],kural:[`Eşiğin altında: uyartı yok.`,`Eşiğin üstünde: uyartı tam; uyarı güçlense de büyümez.`],baska:`Bir domino taşını düşün. Hafifçe dokunursan devrilmez; yeterince itersen devrilir ve sıra aynı biçimde ilerler. Taşı daha sert itmek taşların "daha çok" devrilmesini sağlamaz: ya devrilir ya devrilmez.`,soru:{s:`Eşik değerin altında kalan bir uyarı nöronda ne oluşturur?`,o:[`Küçük bir uyartı`,`Hiç uyartı oluşturmaz`,`Yavaş ilerleyen bir uyartı`],d:1,y:[`orantili`,null,`orantili`],neden:`Uyarı eşik değeri geçmezse uyartı hiç oluşmaz. Uyartının küçüğü ya da yarımı olmaz.`}},{id:`sinaps`,baslik:`Sinaps: boşluğu ne geçer?`,giris:`İki nöron birbirine değmez; aralarında minicik bir boşluk vardır. Elektrik bu boşluktan atlayamaz. Peki bilgi karşıya nasıl geçer?`,gorsel:{tip:`sinaps`},metin:[`Bu boşluğa **sinaps** denir. Geçiş üç adımda olur: uyartı akson ucuna ulaşır; akson ucundaki keseciklerden **nörotransmitter** (kimyasal ileti maddesi) boşluğa salınır; bu madde sonraki nöronun dendritindeki reseptörlere bağlanır ve orada yeni uyartı başlar.`,`Demek ki nöronun içinde iletim **elektriksel**, sinapsta **kimyasaldır**.`],kural:[`Nöronun içinde: elektriksel iletim`,`Sinapsta: kimyasal iletim (nörotransmitter)`],baska:`Köprüsü olmaya
